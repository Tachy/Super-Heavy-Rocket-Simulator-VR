# ------------------------------------------------------------------ Falcon 9 Block 5 (milestone c)
# Sources (retrieved 2026-10-13):
#   sfn_sl1525  https://spaceflightnow.com/2026/10/12/spacex-falcon-9-rocket-to-launch-27-starlink-satellites-into-orbit-from-california/
#   wiki_slc40  https://en.wikipedia.org/wiki/Cape_Canaveral_Space_Launch_Complex_40  (LZ-40, CRS-35 landing 2026-10-13)
# Same round-dial layout as the Starship webcasts: "STAGE 1" left, "STAGE 2" right after separation; before it the
# right dials show G-FORCE and the first stage's engine icon in its propellant gauge (read with --vehicle falcon9).

[[flight]]
flight = "CRS-35"
date_utc = "2026-10-13T10:33:00Z"
booster = ""                 # serial not found in the sources
block = 5
config = "falcon9_block5"
engines = "Merlin 1D"
outcome_booster = "landed at LZ-40 (RTLS)"
notes = "cargo Dragon to the ISS (51.6 deg), payload ~12-13 t incl. trunk [E]; MECO ~T+2:20 (6,518 km/h, ~60 km), boostback T+2:30-3:15, apogee 116 km, entry burn T+5:56-6:13 on the centre engine only (55 -> 36 km), landing burn T+7:00-7:22 1 -> 3 -> 1 engines (3 engines ~T+7:04-7:08), gauge ~2.9 % at landing-burn ignition"
table = "f9_crs35_2026-10-13.csv"
webcast = "https://x.com/i/broadcasts/1aJbdEzoAvYKX"
sources = ["wiki_slc40"]

