# Starship integrated flight tests: which vehicles flew, and which of our vehicle configurations they validate.
# Only flights whose configuration is documented are evaluated (telemetry tables in this directory).
#
# Sources (retrieved 2026-10-13):
#   wiki_tests  https://en.wikipedia.org/wiki/SpaceX_Starship_flight_tests   (serials, block per vehicle, outcomes)
#   wiki_sh     https://en.wikipedia.org/wiki/SpaceX_Super_Heavy              (Raptor 2 on Block 1/2, Raptor 3 on Block 3
#                                                                              "for their first Starship flight of 2026")
#   nsf_f12     https://www.nasaspaceflight.com/2026/05/starship-flight-12-block-3-pad-2/
#   space_f12   https://www.space.com/news/live/spacex-starship-flight-12-launch-updates-may-22-2026
#   nsf_f13     https://www.nasaspaceflight.com/2026/07/starship-flight-13-flight/
#   nsf_f14     https://www.nasaspaceflight.com/2026/09/starship-flight-14-orbit/
#   space_f14   https://www.space.com/news/live/spacex-starship-flight-14-live-updates-sept-28-2026-starship-first-orbital-launch-attempt
#
# Notes marked "from memory" are not backed by the sources above; verify before relying on them.
# Fields: config = our vehicle id (config/vehicles); engines = Raptor generation (booster and ship);
# notes = what matters for evaluating the telemetry (engine-outs change thrust and mass flow: the engine icons in the
# webcast show them, read them before using a segment). table = our telemetry table, if made.

