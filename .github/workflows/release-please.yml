# release-please: keeps a release PR (version in game/util/game_version.gd + CHANGELOG.md) up to date from the
# Conventional Commits on main. It does not publish: /build (.claude/commands/build.md) builds the game and its data
# parts, merges the PR and creates the tag and the release with all files at once.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
