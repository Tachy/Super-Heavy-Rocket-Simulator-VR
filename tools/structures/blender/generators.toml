# Per-vehicle generator table of tools/structures/build_models.py --vehicle <id> (read by the driver with tomllib; the
# generators themselves run on Blender's Python and never see this file).
#   kind        "starship": spec by vehicle_spec.load_starship (hull / flap / fin / engine detail tables);
#               "falcon9": spec by vehicle_spec.load_falcon9 (first stage with interstage, legs; second stage with the Merlin Vacuum);
#               "dragon": spec by vehicle_spec.load_dragon (capsule, hinged nose, trunk);
#               "iss": spec by vehicle_spec.load_iss (the ports of the config, the drawing tables, the IDSS numbers of Dragon's detail file);
#               "generic": vehicle config + detail file, no table validation yet (later tasks add their own).
#   outputs     files every generator together must write (not the Starship: vehicle_outputs knows its fixed set).
#   scripts     helper modules in this folder that the generators import (hashed into the manifest, in this order).
#   bakers      Python texture modules in tools/structures/ (hashed after the scripts, in this order).
#   generators  Blender scripts, run in this order with --spec <json> --out <dir>.
# A vehicle with no generators has no models yet: the driver says so and exits 0, the game keeps the cylinders.
# The game side keeps the matching file lists in game/vehicle/vehicle_models.gd (MODEL_FILES, SOURCE_SCRIPTS).

[starship_block3]
kind = "starship"
scripts = ["common.py", "vehicle_common.py", "hull_profile.py"]
bakers = ["hull_textures", "hull_tiles"]
generators = ["gen_hull.py", "gen_flap.py", "gen_grid_fin.py", "gen_engine.py"]

[falcon9_block5]
kind = "falcon9"
scripts = ["common.py", "vehicle_common.py"]
bakers = ["surface_textures"]
generators = ["gen_falcon9_hull.py", "gen_falcon9_grid_fin.py", "gen_falcon9_leg.py", "falcon9_second_stage.py", "gen_engine.py"]
outputs = ["falcon9_stage1.gltf", "falcon9_grid_fin.gltf", "falcon9_leg.gltf", "falcon9_stage2.gltf", "mvac.gltf", "merlin.gltf"]

[crew_dragon]
kind = "dragon"
scripts = ["common.py", "vehicle_common.py"]
bakers = ["surface_textures"]
generators = ["gen_dragon.py", "idss_mechanism.py"]
outputs = ["dragon_capsule.gltf", "dragon_nose.gltf", "dragon_trunk.gltf", "idss_mechanism.gltf"]

[iss]
kind = "iss"
scripts = ["common.py", "vehicle_common.py", "idss_mechanism.py"]
bakers = ["iss_textures"]
generators = ["iss_station.py", "iss_arrays.py", "idss_passive_ring.py"]
outputs = ["iss_station.gltf", "iss_arrays.gltf", "iss_rings.gltf"]

# Ship variants (plan 2026-11-04 depot / tanker / HLS): the Block 3 generators with the detail file's [variant] switches.
# Tasks 3-6 add their own generators to these entries. The depot and HLS draw no flaps (no gen_flap); the HLS has no booster.
[starship_tanker]
kind = "starship"
scripts = ["common.py", "vehicle_common.py", "hull_profile.py"]
bakers = ["hull_textures", "hull_tiles"]
generators = ["gen_hull.py", "gen_flap.py", "gen_grid_fin.py", "gen_engine.py"]

[starship_depot]
kind = "starship"
outputs = ["booster.gltf", "ship.gltf", "grid_fin.gltf", "raptor.gltf", "rvac.gltf"]
scripts = ["common.py", "vehicle_common.py", "hull_profile.py"]
bakers = ["hull_textures", "hull_tiles"]
generators = ["gen_hull.py", "gen_grid_fin.py", "gen_engine.py"]

[starship_hls]
kind = "starship"
outputs = ["ship.gltf", "raptor.gltf", "rvac.gltf"]
scripts = ["common.py", "vehicle_common.py", "hull_profile.py"]
bakers = ["hull_textures", "hull_tiles"]
generators = ["gen_hull.py", "gen_engine.py"]
