# KSC-20211110-PH-SPX02_0003 (NASA, public domain; 3603 x 2160, Crew-3 on the pad, seen from the hatch, image right = +Z): the two ceiling posts and
# the console's back top edge (fidelity Task 8: this photo's camera, the console held at the table values). Read on 3x crops with a 10 px grid
# (posts) and column intensity profiles over 7 columns, 1.5 px Gaussian (back top edge: the white recess band -> the dark back face).
# Labels: points / edges of cabin_fit/parts/seats.py ConsoleFixed. post_l = image left (-Z) post.
sigma_px = 3.0

[[point]]
label = "post_l_top"      # centre of the collar ellipse at the ceiling (x 1148-1200 visible, cut by the frame top; centre from the rod axis)
px = [1175.0, 4.0]
[[point]]
label = "post_r_top"      # collar ellipse x 2448-2505, y 12-45
px = [2477.0, 27.0]
[[point]]
label = "post_l_base"     # the rod axis extended to the funnel's lower edge (the funnel flares outboard only)
px = [1150.0, 230.0]
[[point]]
label = "post_r_base"
px = [2498.0, 246.0]

[[edge]]
