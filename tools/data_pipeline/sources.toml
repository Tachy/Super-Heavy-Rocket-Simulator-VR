target = "data/spice/de440s.bsp"
license = "NAIF generic kernels: public, free to use"
credit = "Park et al. (2021), The JPL Planetary and Lunar Ephemerides DE440 and DE441, AJ 161:105"

[[source]]
id = "gm_de440"
name = "GM values consistent with DE440"
url = "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/gm_de440.tpc"
