# Every external data source or library used by the simulator.
# `target` is relative to the repository root. `extract = true` unpacks zip archives into `target`.
# CREDITS.md is generated from this file (tools/data_pipeline/credits.py).

[[source]]
id = "cspice"
name = "NAIF SPICE Toolkit (CSPICE N0067, Windows/MSVC 64-bit package; sources compiled by us)"
url = "https://naif.jpl.nasa.gov/pub/naif/toolkit/C/PC_Windows_VisualC_64bit/packages/cspice.zip"
target = "external/cspice.zip"
extract = true
extract_to = "external"
license = "NAIF rules: free of charge, may be redistributed; no warranty (https://naif.jpl.nasa.gov/naif/rules.html)"
credit = "SPICE Toolkit, NASA/JPL Navigation and Ancillary Information Facility (NAIF)"

