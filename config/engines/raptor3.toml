# SpaceX Raptor 3 - sea-level variant (Super Heavy Block 3, Starship Block 3)
[sources]
wiki_raptor = "https://en.wikipedia.org/wiki/SpaceX_Raptor (retrieved 2026-10-12)"
wiki_sh = "https://en.wikipedia.org/wiki/SpaceX_Super_Heavy (retrieved 2026-10-12): Block 3 Isp SL 330 s / vac 350 s"
satnews = "https://satnews.com/2026/05/14/spacex-debuts-starship-v3-redefining-heavy-lift-launch-capability/"
block3_summary = "Project decision 2026-10-12 (Block 3 summary: 33 Raptor 3, ~280 tf per engine at sea level)"

[engine]
id = "raptor3"
name = "Raptor 3"
cycle = "full-flow staged combustion"
propellant = "methalox"
mixture_ratio = 3.6                  # [S:wiki_raptor]
chamber_pressure_pa = 330e5          # operational; 350 bar reached on test stand [S:wiki_raptor]

[performance]
reference_pressure_pa = 101325.0
thrust_ref_n = 2.7459e6              # 280 tf [S:block3_summary]; Wikipedia's 250 tf is the earlier figure [S:wiki_raptor]
isp_ref_s = 330.0                    # sea level [S:wiki_sh]
nozzle_exit_diameter_m = 1.446       # [D] from Isp_vac = 350 s [S:wiki_sh]: A_e = F_sl*(350/330-1)/p0 = 1.6424 m^2
max_ambient_pressure_pa = 110000.0   # [E]

[throttle]
min = 0.30                           # [D] V3 lands hovering on 3 engines (baseline 13 -> 5 -> 3, satnews 2025-10-05): ~250 t on 3 x 280 tf needs <= ~30 %; Wikipedia gives 40 % for Raptor in general
max = 1.00
rate_per_s = 0.5                     # [E]

[gimbal]
max_angle_deg = 15.0                 # [E]
rate_deg_s = 20.0                    # [E]

[mass]
dry_kg = 1525.0                      # [S:wiki_raptor, satnews]
vehicle_side_hardware_kg = 195.0     # 1720 kg engine+vehicle-side minus engine [S:wiki_raptor, SpaceX Aug 2024]

[timing]
startup_s = 3.0                      # [E]
shutdown_s = 0.5                     # [E]
