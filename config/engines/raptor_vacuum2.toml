# SpaceX Raptor Vacuum (RVac) 2 - Starship Block 1/2
[sources]
wiki_raptor = "https://en.wikipedia.org/wiki/SpaceX_Raptor (retrieved 2026-10-12)"

[engine]
id = "raptor_vacuum2"
name = "Raptor Vacuum 2"
cycle = "full-flow staged combustion"
propellant = "methalox"
mixture_ratio = 3.6                  # [S:wiki_raptor]
chamber_pressure_pa = 300e5          # same powerhead as Raptor 2 [E]

[performance]
reference_pressure_pa = 0.0          # vacuum reference
thrust_ref_n = 2.5301e6              # 258 tf [S:wiki_raptor]
isp_ref_s = 380.0                    # [S:wiki_raptor] "~380 s"
nozzle_exit_diameter_m = 2.4         # 2018 projection [S:wiki_raptor]
max_ambient_pressure_pa = 5000.0     # flow separation limit, ~20 km altitude [E]

[throttle]
min = 0.40                           # [E] same powerhead
max = 1.00
rate_per_s = 0.5                     # [E]

[gimbal]
max_angle_deg = 0.0                  # RVacs on the ship are fixed [E]
rate_deg_s = 0.0

[mass]
dry_kg = 2100.0                      # [E] Raptor 2 + radiatively cooled nozzle extension
vehicle_side_hardware_kg = 1245.0    # [E] as Raptor 2

[timing]
startup_s = 3.0                      # [E]
shutdown_s = 0.5                     # [E]
