# SpaceX Raptor Vacuum (RVac) 3 - Starship Block 3
[sources]
wiki_raptor = "https://en.wikipedia.org/wiki/SpaceX_Raptor (retrieved 2026-10-12): comparison table 2,980 kN / 380 s; April 2024 target 306 tf"

[engine]
id = "raptor_vacuum3"
name = "Raptor Vacuum 3"
cycle = "full-flow staged combustion"
propellant = "methalox"
mixture_ratio = 3.6                  # [S:wiki_raptor]
chamber_pressure_pa = 330e5          # [E] same powerhead as Raptor 3

[performance]
reference_pressure_pa = 0.0
thrust_ref_n = 2.98e6                # [S:wiki_raptor]
isp_ref_s = 380.0                    # [S:wiki_raptor]
nozzle_exit_diameter_m = 2.4         # [E] as RVac 2
max_ambient_pressure_pa = 5000.0     # [E]

[throttle]
min = 0.30                           # [E] same powerhead as Raptor 3 (see raptor3.toml)
max = 1.00
rate_per_s = 0.5                     # [E]

[gimbal]
max_angle_deg = 0.0                  # [E] fixed
rate_deg_s = 0.0

[mass]
dry_kg = 1950.0                      # [E] Raptor 3 + nozzle extension
vehicle_side_hardware_kg = 195.0     # [E] as Raptor 3

[timing]
startup_s = 3.0                      # [E]
shutdown_s = 0.5                     # [E]
