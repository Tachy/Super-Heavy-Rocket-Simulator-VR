thrust_ref_n = 981e3                 # [S:wiki_merlin]
isp_ref_s = 348.0                    # [S:wiki_merlin]
nozzle_exit_diameter_m = 3.3         # [E]
max_ambient_pressure_pa = 2000.0     # [E]

[throttle]
min = 0.39                           # [S:wiki_merlin]
max = 1.00
rate_per_s = 0.5                     # [E]

[gimbal]
