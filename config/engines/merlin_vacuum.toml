# SpaceX Merlin Vacuum (1D) - Falcon 9 second stage
[sources]
wiki_merlin = "https://en.wikipedia.org/wiki/SpaceX_Merlin (commonly cited values)"

[engine]
id = "merlin_vacuum"
name = "Merlin Vacuum"
cycle = "gas generator"
propellant = "kerolox"
mixture_ratio = 2.36                 # [E]
chamber_pressure_pa = 97e5           # [E]

[performance]
