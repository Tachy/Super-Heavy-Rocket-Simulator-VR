# Starship V2: Super Heavy Block 2 + Starship Block 2 (flight tests 7-11, 2025)
# dry_mass_kg always INCLUDES the installed engines.
# Tank length is derived from mass, propellant density and the stage cross-section (domes ignored [E]).

[sources]
wiki_sh = "https://en.wikipedia.org/wiki/SpaceX_Super_Heavy (retrieved 2026-10-12)"
wiki_ship = "https://en.wikipedia.org/wiki/SpaceX_Starship_(spacecraft) (retrieved 2026-10-12)"

[vehicle]
id = "starship_block2"
name = "Starship V2 (Super Heavy Block 2 / Ship Block 2)"
display_name = "Heavy Launcher Mk2"     # neutral name used for public builds
propellant = "methalox"
stages_bottom_to_top = ["booster", "ship"]

# ---------------------------------------------------------------- booster
[[stage]]
id = "booster"
name = "Super Heavy Block 2"
length_m = 71.0                          # incl. 1.8 m vented hot-staging ring [S:wiki_sh]
diameter_m = 9.0                         # [S:wiki_sh]
dry_mass_kg = 275000.0                   # [S:wiki_sh] "empty mass"
dry_cg_station_m = 24.0                  # [E] engines + thrust section pull the CG aft
separation = "hot_staging"
jettison_after_separation_kg = 9000.0    # hot-staging ring, dropped after boostback [E]

[[stage.tank]]
id = "lox_main"
contents = "oxidizer"
mass_kg = 2700000.0                      # [S:wiki_sh]
base_station_m = 4.5                     # [E] above thrust section

[[stage.tank]]
id = "ch4_main"
contents = "fuel"
mass_kg = 700000.0                       # [S:wiki_sh] (total 3,400 t; other tables: 3,250 t)
base_station_m = 40.4                    # [E] above common dome

[[stage.engine_group]]
id = "center"
engine = "raptor2"
count = 3
ring_radius_m = 1.0                      # [E]
gimbal = true                            # [S:wiki_sh] inner 13 gimbal
relight = true

[[stage.engine_group]]
id = "middle"
engine = "raptor2"
count = 10
ring_radius_m = 2.6                      # [E]
gimbal = true
relight = true                           # boostback / landing [S:wiki_sh]

[[stage.engine_group]]
id = "outer"
engine = "raptor2"
count = 20
ring_radius_m = 4.1                      # [E]
gimbal = false                           # fixed [S:wiki_sh]
relight = false                          # started by ground equipment [S:wiki_sh]

[stage.aero]
reference_diameter_m = 9.0
ascent_drag_table = "aero/starship_stack_ascent.csv"
grid_fins = 4                            # ~3 t each, included in dry mass [S:wiki_sh]

[stage.recovery]
method = "tower_catch"
reserve_propellant_kg = 230000.0         # boostback + landing [E]
nominal_meco_s = 159.0                   # [S:wiki_sh]
nominal_meco_altitude_m = 64000.0        # [S:wiki_sh]

# ---------------------------------------------------------------- ship
[[stage]]
id = "ship"
name = "Starship Block 2"
length_m = 52.1                          # [S:wiki_ship]
diameter_m = 9.0                         # [S:wiki_ship]
dry_mass_kg = 85000.0                    # [S:wiki_ship] (Block 1 was ~100 t; treat as optimistic)
dry_cg_station_m = 20.0                  # [E]
payload_mass_kg = 0.0                    # set per mission

[[stage.tank]]
id = "lox_main"
contents = "oxidizer"
mass_kg = 1170000.0                      # [S:wiki_ship]
base_station_m = 3.5                     # [E]

[[stage.tank]]
id = "ch4_main"
contents = "fuel"
mass_kg = 330000.0                       # [S:wiki_ship]
base_station_m = 19.3                    # [E]

[[stage.engine_group]]
id = "sea_level"
engine = "raptor2"
count = 3
ring_radius_m = 1.3                      # [E]
gimbal = true
relight = true

[[stage.engine_group]]
id = "vacuum"
engine = "raptor_vacuum2"
count = 3
ring_radius_m = 3.0                      # [E]
gimbal = false
relight = true

[stage.aero]
reference_diameter_m = 9.0
entry_table = "aero/ship_entry.csv"
flaps = 4                                # 2 forward, 2 aft [S:wiki_ship]

[stage.recovery]
method = "tower_catch"
reserve_propellant_kg = 30000.0          # landing flip + burn, header tanks [E]
heat_shield_mass_kg = 10500.0            # incl. ablative layer, Block 1 figure [S:wiki_ship]

[stage.rcs]
type = "cold_gas_ullage"                 # [S:wiki_ship]
thruster_count = 6                       # [S:wiki_ship]
thrust_per_thruster_n = 1500.0           # [E]
