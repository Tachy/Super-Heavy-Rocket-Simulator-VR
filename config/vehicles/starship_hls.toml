# Starship HLS (Human Landing System) - lunar l2. The Block 3 ship's hull, tanks and engines without heat shield, flaps
# and catch pins, with landing thrusters high on the hull and fixed legs. Stays in lunar space (no Earth entry).
# dry_mass_kg always INCLUDES the installed engines.

[sources]
lunar_spec = "docs/superpowers/specs/2026-10-14-lunar-missions-design.md (HLS dry mass, propulsion concept)"
oig_2026 = "NASA OIG IG-26-004, March 2026 (LEO depot, >10 tankers, HLS fills up in LEO)"
wiki_starship = "https://en.wikipedia.org/wiki/SpaceX_Starship (retrieved 2026-10-12)"

[vehicle]
id = "starship_hls"
name = "Starship HLS"
display_name = "Lunar Lander Mk3"
propellant = "methalox"
stages_bottom_to_top = ["hls"]

[[stage]]
id = "hls"
name = "Starship HLS"
length_m = 52.1                          # [D] as the Block 3 ship
diameter_m = 9.0
dry_mass_kg = 120000.0                   # [E] user 2026-10-14: SpaceX publishes none; ~100-120 t Musk's older target,
                                         # LEO departure closes <= ~140 t, bottom-up estimate ~204 t (spec l2)
dry_cg_station_m = 30.0                  # [E] crew cabin, airlock and landing thrusters high on the hull
payload_mass_kg = 0.0
# Landing mass [D] (l4 mass correction, 2026-10-15): 1,720 t in LEO, TLI 3.14 km/s + LOI 0.86 km/s at Isp 380 s ->
# ~573 t in the LLO, a ~2 km/s descent -> ~340 t landed (LLO variant), ~260 t (NRHO variant, 0.9-1.0 km/s down to the
# LLO). Sizes the landing thrusters; the legs are drop-tested at both masses. (l4 first assumed ~1,185 t in the LLO:
# that was l3's propellant used.)
[[stage.tank]]
id = "lox_main"
contents = "oxidizer"
mass_kg = 1252200.0                      # [D] 1,600 t total [S:wiki_starship] split at O/F 3.6
base_station_m = 3.5                     # [E]

[[stage.tank]]
id = "ch4_main"
contents = "fuel"
mass_kg = 347800.0                       # [D]
base_station_m = 20.0                    # [E]

# Raptors as the Block 3 ship (three sea-level single-engine groups, three vacuum engines).

[[stage.engine_group]]
id = "sea_level_1"
engine = "raptor3"
count = 1
ring_radius_m = 1.3                      # [E]
angles_deg = [30.0]                      # [D] leeward pair (belly at 270 deg); ring radius [E]
gimbal = true
relight = true

[[stage.engine_group]]
id = "sea_level_2"
engine = "raptor3"
count = 1
ring_radius_m = 1.3                      # [E]
angles_deg = [150.0]                     # [D] leeward pair
gimbal = true
relight = true

[[stage.engine_group]]
id = "sea_level_3"
engine = "raptor3"
count = 1
ring_radius_m = 1.3                      # [E]
angles_deg = [270.0]                     # [D] towards the belly
gimbal = true
relight = true

[[stage.engine_group]]
id = "vacuum"
engine = "raptor_vacuum3"
count = 3
ring_radius_m = 3.0                      # [E]
angles_deg = [90.0, 210.0, 330.0]        # [D] one leeward, two towards the belly (flight 13 splashdown video)
gimbal = false
relight = true

[[stage.engine_group]]
id = "landing"
engine = "hls_landing_thruster"
count = 12                               # [E] evenly spaced
ring_radius_m = 4.6                      # [E] on the hull (radius 4.5 m)
station_m = 40.0                         # [E] high on the hull (SpaceX HLS renderings)
cant_deg = 15.0                          # [E] exhaust away from the hull
gimbal = false
relight = true
landing_only = true                      # l4 flies them: last part of the landing, liftoff

[stage.aero]                             # the ship's hull (never flown in air: data for completeness)
reference_diameter_m = 9.0
crossflow_table = "aero/ship_crossflow.csv"
ascent_drag_table = "aero/starship_stack_ascent.csv"
nose_length_m = 17.0

# Legs: all [E]; fixed (always deployed). Sized by the lunar l2 drop tests (user 2026-10-15): a vertical touchdown on a
# slope lands on the uphill feet first and pivots freely through the slope angle (CG ~21 m up) - the energy gained must
# stay below the tip barrier over the downhill feet. Slope limit (1 m/s + 0.5 m drop) vs footprint radius: 8 m ~5 deg,
# 10 m 7 deg, 12 m >= 9 deg (NASA's Artemis landing-slope limit is ~8-10 deg). Six legs: four would tip between two.
[stage.landing_legs]
fixed = true
azimuths_deg = [0.0, 60.0, 120.0, 180.0, 240.0, 300.0]
footprint_radius_m = 12.0                # static tip-over across an edge ~26 deg
foot_station_m = -1.5                    # feet below the skirt
stroke_m = 0.6
crush_force_n = 4.5e6                    # per leg: no crush in a 1.5 m/s touchdown on flat ground (reserve); l4 x3
                                         # for a 662 t landing (l2's 1.5 MN crushed through on 8 deg); kept for the
                                         # real 260-340 t: the drop tests land both without a bounce
stiffness_n_m = 1.0e7                    # 6-9 mm static in lunar gravity (221-340 t)
damping_n_s_m = 3.0e6                    # l4 Task 10: x3 - at 1e6 the hull rocked on 1-2 feet for ~15 s after an
                                         # engine cut on a 5 deg slope (rocking mode damping ~0.3, CG 21 m up) and
                                         # walked 1.2 m; 3e6 (~0.9) settles it. 1 m/s x 3e6 < the crush force
friction = 0.6                           # foot pad on regolith

# Ship RCS layout (cold gas from the main tanks).

[stage.rcs]
type = "cold_gas_ullage"                 # autogenous ullage gas from the main tanks [E]
isp_s = 70.0                             # [E]
propellant = "main"
minimum_on_time_s = 0.02                 # [E] valve; on/off only, fixed thrust (constant pressure)

[[stage.rcs.pod]]
id = "forward"
station_m = 46.0                         # [E] forward of the forward flaps; sides (belly at 270 deg)
radius_m = 4.5
azimuths_deg = [0.0, 180.0]
thrust_n = 1500.0                        # [E] (the pre-d1 estimate)
directions = ["tangential_plus", "tangential_plus", "tangential_minus", "tangential_minus", "inward", "inward"]

[[stage.rcs.pod]]
id = "aft"
station_m = 6.0                          # [E] above the aft flaps
radius_m = 4.5
azimuths_deg = [0.0, 180.0]
thrust_n = 1500.0                        # [E]
directions = ["tangential_plus", "tangential_plus", "tangential_minus", "tangential_minus", "inward", "inward", "forward"]  # forward: ullage settling, translation

# Docking probes and transfer connectors [E] as the tanker's (refuelling r1): the HLS fills up at the depot. The tank
# stations are Block 3's (3.5 / 20 m), so the connectors sit on the main tanks. Leg clearance at the depot: r3.
[[stage.docking_port]]
id = "transfer_dock"
name = "Transfer-Andockstelle (Rücken)"
mechanism = "probe_drogue"
position_m = [20.0, 0.0, 5.0]            # [E] centre of the four probes, in the interface plane
axis = [0.0, 0.0, 1.0]                   # dorsal normal
up = [1.0, 0.0, 0.0]                     # nose
soft_capture = "active"                  # the probes
elements_m = [[12.0, -1.5, 5.0], [12.0, 1.5, 5.0], [28.0, -1.5, 5.0], [28.0, 1.5, 5.0]]  # [E] probe tips

[[stage.transfer_connector]]
id = "lox_transfer"
tank = "lox_main"                        # LOX main tank from 3.5 m
position_m = [8.0, 0.0, 5.0]             # [E]

[[stage.transfer_connector]]
id = "ch4_transfer"
tank = "ch4_main"                        # CH4 main tank 20-32.6 m
position_m = [24.0, 0.0, 5.0]            # [E]
