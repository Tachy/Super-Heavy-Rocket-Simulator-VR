# Starship HLS (Human Landing System) - lunar l2. The Block 3 ship's hull, tanks and engines without heat shield, flaps
# and catch pins, with landing thrusters high on the hull and fixed legs. Stays in lunar space (no Earth entry).
# dry_mass_kg always INCLUDES the installed engines.

[sources]
lunar_spec = "docs/superpowers/specs/2026-10-14-lunar-missions-design.md (HLS dry mass, propulsion concept)"
oig_2026 = "NASA OIG IG-26-004, March 2026 (LEO depot, >10 tankers, HLS fills up in LEO)"
wiki_starship = "https://en.wikipedia.org/wiki/SpaceX_Starship (retrieved 2026-10-12)"

[vehicle]
id = "starship_hls"
name = "Starship HLS"
display_name = "Lunar Lander Mk3"
propellant = "methalox"
stages_bottom_to_top = ["hls"]

[[stage]]
id = "hls"
name = "Starship HLS"
length_m = 52.1                          # [D] as the Block 3 ship
diameter_m = 9.0
dry_mass_kg = 120000.0                   # [E] user 2026-10-14: SpaceX publishes none; ~100-120 t Musk's older target,
                                         # LEO departure closes <= ~140 t, bottom-up estimate ~204 t (spec l2)
dry_cg_station_m = 30.0                  # [E] crew cabin, airlock and landing thrusters high on the hull
payload_mass_kg = 0.0
# Landing mass ~221 t [E]: dry + the ascent propellant to a 100 km LLO (1.9 km/s x 1.1, Isp 350 s) - sizes the landing
# thrusters and legs below.
[[stage.tank]]
id = "lox_main"
contents = "oxidizer"
mass_kg = 1252200.0                      # [D] 1,600 t total [S:wiki_starship] split at O/F 3.6
base_station_m = 3.5                     # [E]

[[stage.tank]]
id = "ch4_main"
contents = "fuel"
mass_kg = 347800.0                       # [D]
base_station_m = 20.0                    # [E]

# Raptors as the Block 3 ship (three sea-level single-engine groups, three vacuum engines).

[[stage.engine_group]]
id = "sea_level_1"
engine = "raptor3"
count = 1
ring_radius_m = 1.3                      # [E]
angles_deg = [30.0]                      # [D] leeward pair (belly at 270 deg); ring radius [E]
gimbal = true
relight = true

[[stage.engine_group]]
id = "sea_level_2"
engine = "raptor3"
count = 1
ring_radius_m = 1.3                      # [E]
angles_deg = [150.0]                     # [D] leeward pair
gimbal = true
relight = true

[[stage.engine_group]]
id = "sea_level_3"
engine = "raptor3"
count = 1
ring_radius_m = 1.3                      # [E]
angles_deg = [270.0]                     # [D] towards the belly
gimbal = true
relight = true

[[stage.engine_group]]
id = "vacuum"
engine = "raptor_vacuum3"
count = 3
ring_radius_m = 3.0                      # [E]
angles_deg = [90.0, 210.0, 330.0]        # [D] one leeward, two towards the belly (flight 13 splashdown video)
gimbal = false
relight = true

[[stage.engine_group]]
id = "landing"
engine = "hls_landing_thruster"
count = 12                               # [E] evenly spaced
ring_radius_m = 4.6                      # [E] on the hull (radius 4.5 m)
station_m = 40.0                         # [E] high on the hull (SpaceX HLS renderings)
cant_deg = 15.0                          # [E] exhaust away from the hull
gimbal = false
relight = true
landing_only = true                      # l4 flies them: last part of the landing, liftoff

[stage.aero]                             # the ship's hull (never flown in air: data for completeness)
reference_diameter_m = 9.0
crossflow_table = "aero/ship_crossflow.csv"
ascent_drag_table = "aero/starship_stack_ascent.csv"
nose_length_m = 17.0

[stage.landing_legs]                     # all [E]; fixed (always deployed)
fixed = true
azimuths_deg = [0.0, 60.0, 120.0, 180.0, 240.0, 300.0]  # six: four would tip at ~14 deg between two legs
footprint_radius_m = 8.0
foot_station_m = -1.5                    # feet below the skirt
stroke_m = 0.6
crush_force_n = 5.0e5                    # per leg; 6 legs x 0.6 m: 1.8 MJ (~4 m/s at 221 t)
stiffness_n_m = 4.0e7
damping_n_s_m = 8.0e5                    # ~0.27 of critical per leg at 221 t
friction = 0.6                           # [E] foot pad on regolith

# Ship RCS layout (cold gas from the main tanks).

[stage.rcs]
type = "cold_gas_ullage"                 # autogenous ullage gas from the main tanks [E]
isp_s = 70.0                             # [E]
propellant = "main"
minimum_on_time_s = 0.02                 # [E] valve; on/off only, fixed thrust (constant pressure)

[[stage.rcs.pod]]
id = "forward"
station_m = 46.0                         # [E] forward of the forward flaps; sides (belly at 270 deg)
radius_m = 4.5
azimuths_deg = [0.0, 180.0]
thrust_n = 1500.0                        # [E] (the pre-d1 estimate)
directions = ["tangential_plus", "tangential_plus", "tangential_minus", "tangential_minus", "inward", "inward"]

[[stage.rcs.pod]]
id = "aft"
station_m = 6.0                          # [E] above the aft flaps
radius_m = 4.5
azimuths_deg = [0.0, 180.0]
thrust_n = 1500.0                        # [E]
directions = ["tangential_plus", "tangential_plus", "tangential_minus", "tangential_minus", "inward", "inward", "forward"]  # forward: ullage settling, translation
