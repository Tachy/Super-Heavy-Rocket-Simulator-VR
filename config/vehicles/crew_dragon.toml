# Crew Dragon (SpaceX Dragon 2, crew version) - capsule on its trunk. Flies as the payload of falcon9_block5
# (config::stack_payload via a mission's [payload] table) or alone in orbit. Milestone d2: orbital flight on the Dracos;
# aerodynamics, heat shield and parachutes follow in d3/d4.

[sources]
wiki_dragon2 = "https://en.wikipedia.org/wiki/SpaceX_Dragon_2 (commonly cited values)"
nasa_crew2 = "NASA Commercial Crew blog / SpaceX, Crew-2 return (2021-11-08): drogues ~18,000 ft at ~350 mph, mains ~6,000 ft, deorbit burn ~12 min"
nasa_demo2 = "NASA, Demo-2 return timeline (2020-08-02): drogues ~18,000 ft at ~350 mph, mains ~6,000 ft at ~119 mph, splashdown ~3 min later"
spacex_crew1 = "SpaceX, Crew-1 return (2021-05-02): two drogues, four mains at ~6,500 ft"
splashdown_speed = "Crew-7 coverage (Spectrum News 2024-03-11): ~16 mph at splashdown; TechCrunch Demo-2 preview: ~15 mph"

[vehicle]
id = "crew_dragon"
name = "Crew Dragon"
display_name = "Crew Capsule"
propellant = "mmh_nto"
stages_bottom_to_top = ["trunk", "capsule"]

[[stage]]
id = "trunk"
name = "Crew Dragon trunk"
length_m = 3.7                           # [D] 8.1 m with the trunk [S:wiki_dragon2] minus the 4.4 m capsule
diameter_m = 3.7                         # [E] on the 3.66 m second stage
dry_mass_kg = 1500.0                     # [E] solar arrays and radiators included, not modelled separately
dry_cg_station_m = 1.6                   # [E]
separation = "spring"

[[stage]]
id = "capsule"
name = "Crew Dragon capsule"
length_m = 4.4                           # [S:wiki_dragon2] with the nose cone
diameter_m = 4.0                         # [S:wiki_dragon2]
hull_top_diameter_m = 1.8                # [E] sidewall tapering from the 4 m base (station hull contact, ISS i5)
dry_mass_kg = 8438.0                     # [D] 12.5 t launch mass [S:wiki_dragon2] - 2,562 kg propellant - 1.5 t trunk;
                                         # includes the crew of four and their seats
dry_cg_station_m = 1.3                   # [E] low in the blunt body
dry_cg_offset_m = [0.0964, 0.0]          # [D] gen_capsule_aero.py --trim --cg-station-m 1.135 --entry-mass-kg 10538: L/D 0.20 [E: spec]
                                         # at the entry mass (2.1 t of propellant); lift in the body x-y plane
separation = "spring"                    # [E] from the trunk (d3)
nose_cone = true                         # [S] hinged; closed for ascent and entry, open in orbit

[[stage.tank]]
id = "mmh_nto"
contents = "rcs"
propellant_management_device = true      # [E] user 2026-10-21: diaphragm tank, always covered
mass_kg = 2562.0                         # [S:wiki_dragon2] shared by Dracos and SuperDracos
density_kg_m3 = 1162.0                   # [D] NTO/MMH at O/F 1.65 (1440 / 880 kg/m^3)
base_station_m = 0.4                     # [E] tanks in the service section above the heat shield

[stage.rcs]
type = "hypergolic"                      # Draco, MMH/NTO
isp_s = 300.0                            # [S:wiki_dragon2] vacuum
propellant = "mmh_nto"
minimum_on_time_s = 0.01                 # [E] 2 ticks: Draco valves pulse shorter than cold-gas ones

# [E] layout: no public drawing. Four Dracos under the nose cone push aft (plume forward: the deorbit / -x set, usable
# only with the cone open); four side pods with tangential +/- and a forward-pushing thruster give pure couples on all
# axes (balanced layout) and +x translation. Lateral translation (docking, i2): ~0.046 m/s^2 at 12.5 t with the cone
# open - the side pods' tangential couple is cancelled by differential axial thrust of the nose and forward Dracos;
# zero with the cone closed (layout kept, user 2026-10-19).
[[stage.rcs.pod]]
id = "nose"
station_m = 3.9                          # [E] forward bulkhead
radius_m = 0.6                           # [E]
azimuths_deg = [45.0, 135.0, 225.0, 315.0]
thrust_n = 400.0                         # [S:wiki_dragon2]
directions = ["aft"]
behind_nose_cone = true

[[stage.rcs.pod]]
id = "side"
station_m = 2.4                          # [E] on the 15 deg sidewall
radius_m = 1.5                           # [E]
azimuths_deg = [0.0, 90.0, 180.0, 270.0]
thrust_n = 400.0                         # [S:wiki_dragon2]
directions = ["tangential_plus", "tangential_minus", "forward"]

[[stage.engine_group]]
id = "superdraco"                        # launch escape: data only (abort_only: never lit by the session in d2)
engine = "superdraco"
count = 8                                # [S:wiki_dragon2] four pairs
ring_radius_m = 1.8                      # [E]
angles_deg = [40.0, 50.0, 130.0, 140.0, 220.0, 230.0, 310.0, 320.0]
gimbal = false
relight = true
abort_only = true

[stage.recovery]
method = "splashdown"                    # d3: guided entry to the drogue gate; d4: parachutes and splashdown
max_splashdown_speed_mps = 9.0           # [E: spec] faster sink at the water is an impact

[stage.aero]
reference_diameter_m = 4.0
nose_length_m = 4.0                      # [E] the blunt cone as the stack's nose (slender body while stacked)
capsule_table = "aero/crew_dragon_aero.csv"  # [D] modified Newtonian ([E] below Mach 2); used alone, after the trunk
entry_profile = "capsule"

[stage.heat_shield]                      # PICA-X [S:wiki_dragon2]; limits [E]: corridor bounds, not material limits
nose_radius_m = 4.8                      # [E] R_n = 1.2 D (Apollo / Orion ratio), Sutton-Graves
max_heat_rate_w_m2 = 2.0e6               # [E]
max_heat_load_j_m2 = 4.0e8               # [E]
max_load_g = 15.0                        # [E] structure
crew_load_limit_g = 4.0                  # [E: spec] crew, sustained: warning and the guidance's load limit

# Parachutes [S:nasa_demo2, spacex_crew1]: two drogues at the gate, released when the four mains open. Canopy drag areas
# [D] from the published speeds with a 10.0 t capsule [E] and its own subsonic C_A S 12.2 m^2: drogues 53 m/s (119 mph) at
# 1.8 km -> 68 m^2 in all; mains 7.0 m/s (15-16 mph [S:splashdown_speed]) at sea level -> 3270 m^2 in all (a 35 m Mark 3
# canopy at C_D ~0.85). Reefing, fill times and load limits [E] (no public data): sized so that the crew's sustained load
# stays under 3.6 g (0.9 x crew_load_limit_g).
[[stage.parachute]]
id = "drogue"
role = "drogue"
count = 2
drag_area_m2 = 28.0                      # [D] per canopy
attach_station_m = 3.6                   # [E] riser bridle under the nose cone, on the axis
fill_time_s = 1.0                        # [E]
reefing = [[0.35, 4.0]]                  # [E] one reefed stage
max_load_n = 200000.0                    # [E] per canopy
deploy_height_m = 5500.0                 # [S:nasa_demo2] ~18,000 ft
max_deploy_dynamic_pressure_pa = 15000.0 # [E] gate dispersion (d3: 160-178 m/s at 5.5 km) gives <= 11 kPa

[[stage.parachute]]
id = "main"
role = "main"
count = 4
drag_area_m2 = 815.0                     # [D] per canopy
attach_station_m = 3.6                   # [E]
fill_time_s = 2.0                        # [E]
reefing = [[0.06, 4.0], [0.20, 4.0], [0.45, 4.0]]  # [E] three reefed stages
max_load_n = 120000.0                    # [E] per canopy: 2x the nominal reefed peak (60 kN); mains opened
                                         # without drogues (~136 m/s at 1.8 km: ~140 kN) tear
deploy_height_m = 1800.0                 # [S:nasa_demo2] ~6,000 ft (Crew-1: ~6,500 ft)

# Docking port (milestone i): the IDSS-compatible docking system on the forward bulkhead, under the hinged nose cone.
# Stage frame (x station from the capsule bottom); clocking reference: body -z [E].
[[stage.docking_port]]
id = "idss"
name = "Dragon-Andocksystem"
position_m = [4.0, 0.0, 0.0]             # [E] top of the pressure vessel, below the cone hinge (length 4.4 m with the cone)
axis = [1.0, 0.0, 0.0]                   # forward, along the capsule axis
up = [0.0, 0.0, -1.0]                    # [E] clocking reference
behind_nose_cone = true                  # [S] the cone covers it during ascent and entry
soft_capture = "active"                  # [S: IDSS IDD E 3.1.1.1] Dragon's soft-capture system extends its ring
