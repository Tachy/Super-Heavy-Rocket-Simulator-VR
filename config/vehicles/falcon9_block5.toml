# Falcon 9 Block 5 - reference vehicle with well-documented public data (validates the generic schema)
# dry_mass_kg always INCLUDES the installed engines.

[sources]
wiki_f9 = "https://en.wikipedia.org/wiki/Falcon_9 (commonly cited values)"
# First-stage RCS and flip (follow-ups Task 7, researched 2026-10-23; docs/subsystems.md "Falcon 9 flip time")
ea_rcs = "https://everydayastronaut.com/definitive-guide-to-starship/ (Falcon 9 section: compressed nitrogen cold gas thrusters on the interstage, '2 packs of 4 little thrusters' at the top of the booster; they flip the stage and point it in the coast; no thrust or N2 figures)"
tl_crs35 = "https://www.spacelaunchschedule.com/launch/falcon-9-block-5-dragon-crs-2-spx-35/ (SpaceX mission timeline, RTLS: MECO T+2:15, separation T+2:18, flip T+2:22, boostback startup T+2:31)"
tl_bandwagon3 = "https://www.spacelaunchschedule.com/launch/falcon-9-block-5-bandwagon-3-dedicated-mid-inclina/ (SpaceX mission timeline, RTLS: MECO T+2:15, separation T+2:18, flip T+2:22, boostback startup T+2:32)"
tl_crew13 = "https://spacelaunchschedule.com/launch/falcon-9-block-5-crew-13 (SpaceX mission timeline, RTLS LZ-40: MECO T+2:24, separation T+2:27, flip T+2:31, boostback startup T+2:41)"

[vehicle]
id = "falcon9_block5"
name = "Falcon 9 Block 5"
display_name = "Medium Launcher"
propellant = "kerolox"
stages_bottom_to_top = ["first_stage", "second_stage"]

[[stage]]
id = "first_stage"
name = "Falcon 9 Block 5 first stage"
display_name = "Medium Launcher Stufe 1"  # [D] display name of the part flying alone, no trademark
length_m = 41.2                          # [S:wiki_f9]
diameter_m = 3.66                        # [S:wiki_f9]
dry_mass_kg = 25000.0                    # [S:wiki_f9] 25.6 t incl. the 0.6 t of RCS nitrogen below [D] (25.0 + 0.6:
                                         # the stage's total mass unchanged by the N2 sizing)
dry_cg_station_m = 12.0                  # [E]
jettison_after_separation_kg = 0.0
# [D] q limit over Mach ([mach, pa], linear between): the ascent guidance throttles the stack to hold q at or below
# it. Both flights hold q transonically with the engines throttled (gauge flow) and let it rise once supersonic:
#   python tools/telemetry/peak_dynamic_pressure.py tests/validation/telemetry/f9_crs35_2026-10-13.csv
#       --capacity-t 425 --rated-flow-tps 2.75
#   -> throttled T+52..66 s: Mach 0.92..1.26 (q flat 28.7-29.6 kPa over Mach 0.92-1.12, then rising as the engines
#      throttle up); full thrust: highest q 31559 Pa at T+70 s (Mach 1.43)
#   (the same for f9_starlink15-25_2026-10-12.csv)
#   -> q flat 31.0-31.5 kPa over Mach 0.97-1.13, throttled T+56..68 s (Mach 1.01-1.38, q rising to 34.9 kPa);
#      full thrust: highest q 35567 Pa at T+72 s (Mach 1.55)
# Transonic (Mach 0.90-1.12): the lower of the two holds, CRS-35's 29.6 kPa (Starlink 15-25 held 31.5); elsewhere the
# highest q flown at full thrust, 35.6 kPa (no evidence of a lower limit); ramps where the records leave the hold
# (from Mach 0.80, to Mach 1.45). The post-bucket ~95 % of the former CRS-35 schedule (a G-dial fit) is not data: the
# gauge shows the rated flow after the bucket (mass_estimate.py "mean flow" T+66-100 s: 0.997 / 0.993).
max_dynamic_pressure_pa = [[0.80, 35567.0], [0.90, 29600.0], [1.12, 29600.0], [1.45, 35567.0]]

# Cold staging (FlightSession::stage, ascent trajectory and staging Task 1). Event times from our webcast telemetry
# (tests/validation/telemetry, 0.5 s samples): MECO = the engine icon going dark, separation = the speed dials splitting
# into stage 1 and stage 2, the second stage's ignition = its speed's minimum (its thrust then balances the gravity loss)
# less the Merlin Vacuum's spool to that thrust (startup 2 s, linear: ~1.3 s on CRS-35, ~0.9 s on Starlink 15-25).
#   CRS-35:          MECO T+137.0 s, separation T+141.5 s, speed minimum T+149.5 s -> ignition ~T+148.2 s
#   Starlink 15-25:  MECO T+149.0 s, separation T+153.5 s, speed minimum T+159.5 s -> ignition ~T+158.6 s
[stage.staging]
kind = "cold"
separation_delay_s = 4.5                 # [D] 4.5 s on both flights
upper_ignition_delay_s = 6.0             # [D] 6.7 s (CRS-35) and 5.1 s (Starlink 15-25) after the separation
separation_dv_mps = 1.0                  # [E] pneumatic pushers: a slow, clean separation (order of 1 m/s relative)

[[stage.tank]]
id = "lox_main"
contents = "oxidizer"
mass_kg = 298600.0                       # [D] 425 t total split at O/F 2.36: the propellant gauge of our webcast
                                         # telemetry (CRS-35, Starlink 15-25) falls 0.63 %/s at full thrust; nine
                                         # Merlins at their 845 kN rating burn 2.75 t/s -> ~425 t at 100 %
                                         # (tools/telemetry/mass_estimate.py: rated thrust within +-4 % over the whole
                                         # ascent, liftoff 568-576 t). The commonly cited 395.7 t [S:wiki_f9] made the
                                         # engines run at 92-94 % and our stack 18 % too fast at T+60 s.
base_station_m = 2.5                     # [E] (425 t: the tanks fill the stage up to the interstage)

[[stage.tank]]
id = "rp1_main"
contents = "fuel"
mass_kg = 126400.0                       # [D]
base_station_m = 26.4                    # [E]

# Octaweb [S:wiki_f9]: 8 engines on a ring around a centre engine. Grouped for the burns of a return: the centre
# engine lands, centre + the opposite pair form the 3-engine set of boostback and entry burn (thrust on the axis).
[[stage.engine_group]]
id = "center"                            # landing engine
engine = "merlin1d"
count = 1
ring_radius_m = 0.0
gimbal = true
relight = true

[[stage.engine_group]]
id = "pair"                              # with the centre: the 3-engine set (boostback, entry burn)
engine = "merlin1d"
count = 2
ring_radius_m = 1.25                     # [E] octaweb ring from imagery (3.66 m core)
angles_deg = [0.0, 180.0]
gimbal = true
relight = true

[[stage.engine_group]]
id = "ring"
engine = "merlin1d"
count = 6
ring_radius_m = 1.25                     # [E]
angles_deg = [45.0, 90.0, 135.0, 225.0, 270.0, 315.0]
gimbal = true
relight = false

[stage.aero]
reference_diameter_m = 3.66
ascent_drag_table = "aero/falcon9_ascent.csv"
descent_drag_table = "aero/falcon9_descent.csv"   # tail first [D] from webcast telemetry

[stage.grid_fins]
azimuths_deg = [45.0, 135.0, 225.0, 315.0]   # [E] four fins between the legs' azimuths
area_m2 = 1.8                                # [E] titanium fin ~1.2 x 1.5 m frontal lattice
station_m = 39.0                             # [E] hinge near the interstage top (stage 41.2 m)
radius_m = 2.6                               # [E] 1.83 m core radius + half the fin span
max_deflection_deg = 20.0                    # [E]
rate_deg_s = 30.0                            # [E] hydraulic (open loop) actuators
table = "aero/grid_fin.csv"

[stage.landing_legs]                         # all [E] from imagery and public figures; contact physics in c2
azimuths_deg = [0.0, 90.0, 180.0, 270.0]
footprint_radius_m = 9.0                     # span ~18 m
foot_station_m = -1.5                        # feet below the engine bell exit when deployed
deploy_time_s = 2.0
stroke_m = 0.5                               # crush core
crush_force_n = 4.0e5                        # per leg: 4 legs ~6 g on a 27 t stage
stiffness_n_m = 2.0e7
damping_n_s_m = 2.0e5
friction = 0.6

[stage.recovery]
method = "leg_landing"                       # pad (RTLS) or drone ship, chosen by the mission (user 2026-10-13)
# Propellant from the stage's gauge in our webcast telemetry (tests/validation/telemetry, % of 425 t):
reserve_propellant_kg = 46750.0              # [D] MECO of a drone-ship return (Starlink 15-25: ~11 % at T+149 s);
                                             # an RTLS keeps more (CRS-35: ~15.5 % = 66 t at T+137 s)
landing_propellant_kg = 12100.0              # [D] at landing-burn ignition: 2.8-2.9 % on both flights (touchdown: 1.7 %
                                             # = 7.2 t on both: the real landing burn uses ~4.9 t)
nominal_meco_s = 137.0                       # [D] CRS-35 (RTLS); Starlink 15-25 (drone ship): 149 s
nominal_meco_altitude_m = 56600.0            # [D] CRS-35; Starlink 15-25: 60 km
# Return (gnc::booster_return_parameters). Evidence: our CRS-35 webcast telemetry (RTLS to LZ-40).
boostback_engine_groups = ["center", "pair"]  # [E] the 3-engine set (thrust on the axis)
flip_engine_groups = []                      # [S: SpaceX webcasts] the flip after separation on the nitrogen thrusters,
                                             # engines off until the boostback
flip_duration_s = 13.6                       # [D] MECO planning: separation -> boostback ignition as flown on our full
                                             # RTLS (13.6 s) with the RCS sized below; measured 13 / 14 / 14 s
                                             # [S:tl_crs35] [S:tl_bandwagon3] [S:tl_crew13], mean 13.7 s
boostback_loss_fraction = 0.13               # [D] MECO planning: identified on our full RTLS (12.1 t at the landing-burn
                                             # ignition for 12.1 t planned; 0.19 with the former 50 s flip)
return_flight_time_s = 260.0                 # [D] Lambert arc; with drag and the entry burn the touchdown follows ~300 s after
                                             # the boostback start as on CRS-35 (T+~150 s -> T+442 s; 290 s landed 38 s late)
entry_engine_groups = ["center"]             # [D] CRS-35: the engine icon shows the centre engine alone
entry_burn_altitude_m = 56600.0              # [D] CRS-35: lit at T+355 s, 56.6 km (out at 35.9 km)
entry_burn_delta_v_mps = 125.0               # [D] gauge 3.5 -> 3.1 %: 1.7 t on 40.5 t at Isp_vac 305 s (128 m/s; the
                                             # gauge's 0.1 % steps are 0.4 t)
entry_burn_throttle = 0.4                    # [D] 1.7 t in ~17 s burning: at or below minimum throttle
# Landing burn 1 -> 3 -> 1 [D] CRS-35: one engine from ~3.2 km / ~300 m/s, three from ~2.0 km / ~250 m/s, one again
# from ~1.05 km / ~165 m/s to the touchdown at T+442 s (Starlink 15-25, drone ship: one engine throughout).
landing_engine_phases = [["center"], ["center", "pair"], ["center"]]
landing_phase_throttles = [0.7, 0.45, 0.65]  # [E] design throttles that time the ignition: ~3.2 km at 300 m/s as CRS-35
landing_switch_sink_mps = [[230.0, 270.0], [140.0, 190.0]]  # [D] around ~250 / ~165 m/s
landing_gimbal_fraction = 0.45               # [E] planned share of the 5 deg gimbal, the whole landing burn (RTLS
                                             # and drone ship; default 0.3 is Super Heavy's catch campaign). Reach: the
                                             # drone-ship MECO seed 117 needs >= 0.40 (0.30 ditches, 0.35 fails 3
                                             # re-plans). Authority: at 0.45 the lateral command in the last 10 s uses
                                             # <= 0.50 of the whole gimbal in 62 of 63 Falcon 9 campaign cases (seed 117
                                             # 1.06: unmodelled cross-flow at 400 m). The derivation leaves a band
                                             # 0.40-0.45; 0.45 is chosen from it - docs/subsystems.md, Task 2b

# Return to a drone ship (milestone c4; keys left out come from the RTLS profile above). Evidence: our Starlink 15-25
# webcast telemetry (drone ship, no boostback).
[stage.recovery.drone_ship]
boostback = false                            # [D] no boostback: the stage coasts on its ascent arc, turns on its RCS
entry_engine_groups = ["center", "pair"]     # [D] three engine icons T+367.5-385 s (the centre engine lit 3.5 s earlier)
entry_burn_altitude_m = 66000.0              # [D] centre engine lit at 67.4 km, three engines from 64.2 km
entry_burn_delta_v_mps = 880.0               # [D] 7,926 -> 5,245 km/h over T+361-392 s (745 m/s) plus ~125 m/s of
                                             # gravity along the path; the rocket equation on the gauge (25.9 -> 12.1 t at
                                             # Isp_vac 305 s) gives 933 m/s
entry_burn_throttle = 0.72                   # [D] 880 m/s in ~19 s on three engines (12.8 t at 3 x 0.72 x 306 kg/s)
landing_engine_phases = [["center"], ["center"], ["center"]]  # [D] one engine icon from ignition to touchdown
landing_phase_max_tilt_deg = [20.0, 20.0, 20.0]  # [E] the same engine throughout: the same gimbal authority (the slanted
                                                 # drone-ship approach needs its divert in the last phase too)
landing_phase_throttles = [0.7, 0.7, 0.65]   # [E] design throttles that time the ignition (~3.0 km at ~270 m/s)
landing_switch_sink_mps = [[120.0, 280.0], [40.0, 120.0]]  # [E] no engine change: wide windows that only split the plan

[[stage.tank]]
id = "rcs_n2"
contents = "rcs"
mass_kg = 600.0                              # [D] nitrogen, carved out of the 25.6 t dry mass: the full RTLS uses 441 kg
                                             # (ascent 70 kg, flip 349 kg, coast trims and landing 22 kg), 159 kg left
                                             # at the touchdown = 36 % margin (>= 20 % [E] required)
density_kg_m3 = 250.0                        # [E] COPV gas at ~300 bar
base_station_m = 38.0                        # [E] interstage

[stage.rcs]
type = "cold_gas"                            # nitrogen, two pods at the top
isp_s = 70.0                                 # [E] typical N2 cold gas
propellant = "rcs_n2"
minimum_on_time_s = 0.02                     # [E] valve; on/off only, fixed thrust (constant pressure)

[[stage.rcs.pod]]
id = "pod"
station_m = 40.0                             # [E] interstage, below the grid fins
radius_m = 1.83
azimuths_deg = [0.0, 180.0]                  # [S:ea_rcs] two packs at the top; [E] azimuths between the fins
thrust_n = 6500.0                             # [D] rests ONLY on the measured flip time (large for cold gas: 9.5 kg/s
                                              # N2 each): no source gives or bounds the thrust (SpaceX, Wikipedia, spec
                                              # sheets: "nitrogen cold gas thrusters" only). Sized on the existing flip
                                              # controller and the 15 deg boostback gate so that separation -> boostback
                                              # is the measured 13.7 s mean (flown 13.6 s; 450 N [E] before: 53 s).
                                              # Pitch at the separation: one pack's two inward thrusters, 13 kN at
                                              # 28.5 m = 3.71e5 Nm on 1.01e7 kg m2 (~17 s bang-bang alone; the aero
                                              # moment carries a large share of the 13.6 s turn)
directions = ["tangential_plus", "tangential_minus", "inward", "inward"]  # [S:ea_rcs] 4 per pack

[[stage]]
id = "second_stage"
name = "Falcon 9 Block 5 second stage"
display_name = "Medium Launcher Stufe 2"  # [D] display name of the part flying alone, no trademark
length_m = 13.8                          # [S:wiki_f9]
diameter_m = 3.66
dry_mass_kg = 3820.0                     # [S:wiki_f9] 3.9 t incl. the 80 kg of RCS nitrogen below [E]
dry_cg_station_m = 4.0                   # [E]
payload_mass_kg = 0.0
fairing_mass_kg = 1900.0                 # [S:wiki_f9]

[[stage.tank]]
id = "lox_main"
contents = "oxidizer"
mass_kg = 75000.0                        # [D] 106.7 t total split at O/F 2.36: our CRS-35 webcast telemetry (G-force
                                         # and stage-1 gauge at T+112-132 s) puts ~125 t above the first stage
                                         # (12.5 t Dragon [E]); 92.67 t [S:wiki_f9] left the stack ~15 t light and
                                         # the liftoff mass 520 t instead of 549 t [S:wiki_f9]
base_station_m = 3.0                     # [E]

[[stage.tank]]
id = "rp1_main"
contents = "fuel"
mass_kg = 31700.0                        # [D]
base_station_m = 9.4                     # [E] above the longer LOX tank

[[stage.tank]]
id = "rcs_n2"
contents = "rcs"
mass_kg = 80.0                           # [E] nitrogen, carved out of the 3.9 t dry mass
density_kg_m3 = 250.0                    # [E] COPV gas at ~300 bar
base_station_m = 1.0                     # [E]

[stage.rcs]
type = "cold_gas"
isp_s = 70.0                             # [E] typical N2 cold gas
propellant = "rcs_n2"
minimum_on_time_s = 0.02                 # [E] valve; on/off only, fixed thrust (constant pressure)

[[stage.rcs.pod]]
id = "pod"
station_m = 1.5                          # [E] aft skirt
radius_m = 1.83
azimuths_deg = [90.0, 270.0]
thrust_n = 200.0                         # [E]
directions = ["tangential_plus", "tangential_minus", "inward", "forward"]

[[stage.engine_group]]
id = "mvac"
engine = "merlin_vacuum"
count = 1
ring_radius_m = 0.0
gimbal = true
relight = true

[stage.aero]
reference_diameter_m = 3.66
nose_length_m = 6.0                      # fairing ogive [E]
