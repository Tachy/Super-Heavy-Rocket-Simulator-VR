# Falcon 9 Block 5 - reference vehicle with well-documented public data (validates the generic schema)
# dry_mass_kg always INCLUDES the installed engines.

[sources]
wiki_f9 = "https://en.wikipedia.org/wiki/Falcon_9 (commonly cited values)"

[vehicle]
id = "falcon9_block5"
name = "Falcon 9 Block 5"
display_name = "Medium Launcher"
propellant = "kerolox"
stages_bottom_to_top = ["first_stage", "second_stage"]

[[stage]]
id = "first_stage"
name = "Falcon 9 Block 5 first stage"
length_m = 41.2                          # [S:wiki_f9]
diameter_m = 3.66                        # [S:wiki_f9]
dry_mass_kg = 25600.0                    # [S:wiki_f9]
dry_cg_station_m = 12.0                  # [E]
separation = "cold_pneumatic"
jettison_after_separation_kg = 0.0

[[stage.tank]]
id = "lox_main"
contents = "oxidizer"
mass_kg = 278000.0                       # [D] 395.7 t total [S:wiki_f9] split at O/F 2.36
base_station_m = 4.0                     # [E]

[[stage.tank]]
id = "rp1_main"
contents = "fuel"
mass_kg = 117700.0                       # [D]
base_station_m = 27.0                    # [E]

# Octaweb [S:wiki_f9]: 8 engines on a ring around a centre engine. Grouped for the burns of a return: the centre
# engine lands, centre + the opposite pair form the 3-engine set of boostback and entry burn (thrust on the axis).
[[stage.engine_group]]
id = "center"                            # landing engine
engine = "merlin1d"
count = 1
ring_radius_m = 0.0
gimbal = true
relight = true

[[stage.engine_group]]
id = "pair"                              # with the centre: the 3-engine set (boostback, entry burn)
engine = "merlin1d"
count = 2
ring_radius_m = 1.25                     # [E] octaweb ring from imagery (3.66 m core)
angles_deg = [0.0, 180.0]
gimbal = true
relight = true

[[stage.engine_group]]
id = "ring"
engine = "merlin1d"
count = 6
ring_radius_m = 1.25                     # [E]
angles_deg = [45.0, 90.0, 135.0, 225.0, 270.0, 315.0]
gimbal = true
relight = false

[stage.aero]
reference_diameter_m = 3.66
ascent_drag_table = "aero/falcon9_ascent.csv"
descent_drag_table = "aero/falcon9_descent.csv"   # tail first [D] from webcast telemetry

[stage.grid_fins]
azimuths_deg = [45.0, 135.0, 225.0, 315.0]   # [E] four fins between the legs' azimuths
area_m2 = 1.8                                # [E] titanium fin ~1.2 x 1.5 m frontal lattice
station_m = 39.0                             # [E] hinge near the interstage top (stage 41.2 m)
radius_m = 2.6                               # [E] 1.83 m core radius + half the fin span
max_deflection_deg = 20.0                    # [E]
rate_deg_s = 30.0                            # [E] hydraulic (open loop) actuators
table = "aero/grid_fin.csv"

[stage.landing_legs]                         # all [E] from imagery and public figures; contact physics in c2
azimuths_deg = [0.0, 90.0, 180.0, 270.0]
footprint_radius_m = 9.0                     # span ~18 m
foot_station_m = -1.5                        # feet below the engine bell exit when deployed
deploy_time_s = 2.0
stroke_m = 0.5                               # crush core
crush_force_n = 4.0e5                        # per leg: 4 legs ~6 g on a 27 t stage
stiffness_n_m = 2.0e7
damping_n_s_m = 2.0e5
friction = 0.6

[stage.recovery]
method = "leg_landing"                       # pad (RTLS) or drone ship, chosen by the mission (user 2026-10-13)
# Propellant from the stage's gauge in our webcast telemetry (tests/validation/telemetry, % of 395.7 t):
reserve_propellant_kg = 43000.0              # [D] MECO of a drone-ship return (Starlink 15-25: ~11 % at T+149 s);
                                             # an RTLS keeps more (CRS-35: ~15.5 % = 61 t at T+137 s)
landing_propellant_kg = 11300.0              # [D] at landing-burn ignition: 2.8-2.9 % on both flights
nominal_meco_s = 137.0                       # [D] CRS-35 (RTLS); Starlink 15-25 (drone ship): 149 s
nominal_meco_altitude_m = 56600.0            # [D] CRS-35; Starlink 15-25: 60 km
# Return (gnc::booster_return_parameters). Evidence: our CRS-35 webcast telemetry (RTLS to LZ-40).
boostback_engine_groups = ["center", "pair"]  # [E] the 3-engine set (thrust on the axis)
return_flight_time_s = 290.0                 # [D] CRS-35: boostback from ~T+150 s, touchdown T+442 s
entry_engine_groups = ["center"]             # [D] CRS-35: the engine icon shows the centre engine alone
entry_burn_altitude_m = 56600.0              # [D] CRS-35: lit at T+355 s, 56.6 km (out at 35.9 km)
entry_burn_delta_v_mps = 125.0               # [D] gauge 3.5 -> 3.1 %: 1.6 t on 39.5 t at Isp_vac 311 s
entry_burn_throttle = 0.4                    # [D] 1.6 t in ~17 s burning: at or below minimum throttle
# Landing burn 1 -> 3 -> 1 [D] CRS-35: one engine from ~3.2 km / ~300 m/s, three from ~2.0 km / ~250 m/s, one again
# from ~1.05 km / ~165 m/s to the touchdown at T+442 s (Starlink 15-25, drone ship: one engine throughout).
landing_engine_phases = [["center"], ["center", "pair"], ["center"]]
landing_phase_throttles = [0.9, 0.5, 0.75]   # [E] design throttles that time the ignition (~3.2 km at 300 m/s)
landing_switch_sink_mps = [[230.0, 270.0], [140.0, 190.0]]  # [D] around ~250 / ~165 m/s

[stage.rcs]
type = "cold_gas"                            # nitrogen, two pods at the top
thruster_count = 8                           # [E]
thrust_per_thruster_n = 450.0                # [E]

[[stage]]
id = "second_stage"
name = "Falcon 9 Block 5 second stage"
length_m = 13.8                          # [S:wiki_f9]
diameter_m = 3.66
dry_mass_kg = 3900.0                     # [S:wiki_f9]
dry_cg_station_m = 4.0                   # [E]
payload_mass_kg = 0.0
fairing_mass_kg = 1900.0                 # [S:wiki_f9]

[[stage.tank]]
id = "lox_main"
contents = "oxidizer"
mass_kg = 75000.0                        # [D] 106.7 t total split at O/F 2.36: our CRS-35 webcast telemetry (G-force
                                         # and stage-1 gauge at T+112-132 s) puts ~125 t above the first stage
                                         # (12.5 t Dragon [E]); 92.67 t [S:wiki_f9] left the stack ~15 t light and
                                         # the liftoff mass 520 t instead of 549 t [S:wiki_f9]
base_station_m = 3.0                     # [E]

[[stage.tank]]
id = "rp1_main"
contents = "fuel"
mass_kg = 31700.0                        # [D]
base_station_m = 9.4                     # [E] above the longer LOX tank

[[stage.engine_group]]
id = "mvac"
engine = "merlin_vacuum"
count = 1
ring_radius_m = 0.0
gimbal = true
relight = true

[stage.aero]
reference_diameter_m = 3.66
nose_length_m = 6.0                      # fairing ogive [E]
