# Starship tanker (refuelling r1): a Block 3 ship that carries propellant to the depot. Same hull, tanks and engines as
# starship_block3.toml - its stages are taken over unchanged ([[stage]] from = "<vehicle>:<stage>"); the ship adds four
# docking probes on the dorsal side and the transfer connectors (spec 2026-10-20-orbital-refuelling-design.md).

[sources]
spacex_v3 = "SpaceX Starship V3 update, May 2026, via https://www.teslarati.com/spacex-unveils-sweeping-starship-v3-upgrades-ahead-may-19-launch/ (four docking drogues and dedicated propellant transfer connections)"

[vehicle]
id = "starship_tanker"
name = "Starship Tanker (Super Heavy Block 3 / Ship Block 3)"
display_name = "Tanker Mk3"
propellant = "methalox"
stages_bottom_to_top = ["booster", "ship"]

[[stage]]
from = "starship_block3:booster"

[[stage]]
from = "starship_block3:ship"
display_name = "Tanker Mk3"  # [D] display name of the part flying alone, no trademark
# [E] placeholder until the real tanker is known (user 2026-10-20): a tanker ship without cargo doors, dispenser and
# interior (heat shield, flaps and header tanks stay), lighter by the V3 weight targets - chosen so that the tanker has
# 100 t main propellant after its ascent (with the 120 km insertion of tanker_ascent). Block 3's 255 t [D] is the
# flown cargo ship (flights 12-14); with it the tanker kept 48 t. 209 t (-46 t) gives 102 t at insertion, ~99 t
# after the perigee raise (r5). CG as Block 3's.
dry_mass_kg = 209000.0

# Docking probes and transfer connectors [E] (positions not published; spec r1, plan decision 3): the interface plane
# z = +5.0 m lies 0.5 m off the dorsal hull (radius 4.5 m; belly at -z). Mated with the depot's drogues the ships lie parallel,
# rolled 180 deg, 10 m between the centrelines. The layout is symmetric in y so the rolled ship meets it.
[[stage.docking_port]]
id = "transfer_dock"
name = "Transfer-Andockstelle (Rücken)"
mechanism = "probe_drogue"
position_m = [20.0, 0.0, 5.0]            # [E] centre of the four probes, in the interface plane
axis = [0.0, 0.0, 1.0]                   # dorsal normal
up = [1.0, 0.0, 0.0]                     # nose
soft_capture = "active"                  # the probes
elements_m = [[12.0, -1.5, 5.0], [12.0, 1.5, 5.0], [28.0, -1.5, 5.0], [28.0, 1.5, 5.0]]  # [E] probe tips

[[stage.transfer_connector]]
id = "lox_transfer"
tank = "lox_main"                        # LOX main tank 3.5-20.4 m
position_m = [8.0, 0.0, 5.0]             # [E]
line_diameter_m = 0.15                   # [E] one line per propellant (SpaceX publishes no size)
discharge_coefficient = 0.6              # [E] lumped line, valve and coupling losses
chilldown_kg = 150.0                     # [E] ~300 kg of line and coupling steel from ~250 K (c 450 J/kgK) over 213 kJ/kg
                                         # ~100 kg, +50 %

[[stage.transfer_connector]]
id = "ch4_transfer"
tank = "ch4_main"                        # CH4 main tank 20-32.6 m
position_m = [24.0, 0.0, 5.0]            # [E]
line_diameter_m = 0.15                   # [E]
discharge_coefficient = 0.6              # [E]
chilldown_kg = 60.0                      # [E] the same steel over 510 kJ/kg ~37 kg, +50 %

# Transfer pressures [E] (refuelling r4; spec: pressure-driven, Ars Technica 2024): the delivering ship holds its ullage
# at 3.5 bar (spec 3-4 bar), the receiving ship vents to 1.5 bar - 2 bar drive LOX at ~230 kg/s, CH4 at ~140 kg/s.
[stage.propellant_transfer]
delivery_pressure_pa = 3.5e5
receive_pressure_pa = 1.5e5

# Docking thrusters [E] (refuelling r3, user 2026-10-20): two cold-gas thrusters pushing along -x at the forward pod.
# In the docking attitude the ship's x axis lies along the V-bar; without -x a hold or retreat below the depot cannot
# stop the Coriolis drift forward (v_along + 2 n x_radial is conserved without along-track thrust). Same size as the
# aft pod's "forward" pair. SpaceX publishes no thruster layout.
[[stage.rcs_pod]]
id = "docking"
station_m = 46.0
radius_m = 4.5
azimuths_deg = [0.0, 180.0]
thrust_n = 1500.0
directions = ["aft"]
