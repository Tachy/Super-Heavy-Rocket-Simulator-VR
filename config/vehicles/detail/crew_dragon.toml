# Visual detail of crew_dragon (Crew Dragon capsule and trunk, hinged nose, docking mechanism): what the physics does not need.
# Placement and size come from config/vehicles/crew_dragon.toml (lengths, diameters, SuperDraco layout); this file never repeats them (tested).
# The docking mechanism comes with Task 6: its place is the recess in the neck under the nose, its port is `position_m` of the config.
# Every value line carries [E] (own estimate, method named) or [S] (published, URL). Keys: config/README.md.
# "M2" = reference "SpaceX - Dragon 2" (KUBAHA, CC BY 4.0), scaled to the 4.0 m diameter; ray-cast / vertex measurements by script (2026-11-02), re-typed here
# as a coarse table and re-drawn by gen_dragon.py, nothing of the mesh is copied or shipped (screenshots/falcon9_ref/INDEX.md 5.4, task-5-report "Task 5c").
# Photos checked against it: D_CCP_SpaceX_Demo_2_Dragon__3_ (closed capsule, cowl), D_Crew_2_..._Falcon_9_mate (capsule and trunk, fin outline), D_Iss071e186365 and
# D_Iss072e096331 (nose open, tilted seam, neck). Azimuth: 0 = hatch, 180 = nose hinge. Stations ("x") are metres above the heat shield apex (capsule station 0) unless stated.

[capsule]
az_step_deg = 3.0              # [E] column pitch outside the cowls: sagitta 2.7 mm at R = 2 m
nose_columns = 96              # [E] columns of the nose: sagitta 0.5 mm at R = 1.1 m
shield_edge_x_m = 0.35         # [E] M2 ray cast: heat shield (dark) ends at r 1.88, metal band above it
band_top_x_m = 0.68            # [E] M2 material boundary METAL / white at x 0.67-0.68; D_CCP_Demo_2 (3) shows the same bright band
# Meridian of the whole body, shield apex to nose tip, on the surface of revolution outside the cowls: [x, r]. The last x equals the config's capsule length (tested).
profile_m = [[0.0, 0.0], [0.01, 0.33], [0.02, 0.47], [0.05, 0.72], [0.1, 1.05], [0.2, 1.5], [0.3, 1.77], [0.35, 1.88], [0.4, 1.93], [0.45, 1.97], [0.5, 1.99], [0.6, 2.0], [0.68, 1.99], [0.72, 1.98], [0.8, 1.97], [1.0, 1.96], [1.2, 1.93], [1.4, 1.9], [1.6, 1.86], [1.8, 1.81], [2.0, 1.75], [2.2, 1.69], [2.4, 1.62], [2.6, 1.55], [2.8, 1.47], [3.0, 1.39], [3.2, 1.31], [3.4, 1.23], [3.6, 1.14], [3.8, 1.04], [4.0, 0.94], [4.2, 0.83], [4.3, 0.78], [4.4, 0.72], [4.5, 0.65], [4.6, 0.57], [4.7, 0.44], [4.8, 0.25], [4.84, 0.1], [4.85, 0.0]]  # [E] M2 ray cast r(x) at az 0..30, mirror asymmetry 1.3 cm
# SuperDraco cowl: a raised lobe (hood + cheeks) on each pod azimuth of the config, with the open bay cut into its lower part.
hood_half_width_deg = 17.0     # [E] M2 ray cast x 2.2-2.4: lobe from az 46 to 80 about the pod at 63
hood_outer_m = [[0.8, 1.97], [1.0, 1.97], [1.2, 1.99], [1.6, 1.99], [1.85, 2.0], [1.9, 1.985], [2.0, 1.95], [2.16, 1.88], [2.37, 1.8], [2.63, 1.68], [2.83, 1.59], [3.16, 1.42], [3.52, 1.24], [3.8, 1.08], [4.0, 0.96], [4.2, 0.83]]  # [E] M2 ray cast [x, r] along the lobe's crown, az 60-75
bay_top_x_m = 1.82             # [E] M2: hood lip at x 1.81 on the pod azimuth
bay_corner_drop_m = 0.05       # [E] D_CCP_Demo_2 (3): the bay's top has round corners (M2's are nearly square: the photo wins)
bay_corner_power = 8.0         # [E] same photo: flat over the middle, the corners only
bay_half_width_deg_m = [[0.72, 15.6], [1.4, 14.0], [1.6, 11.7], [1.82, 10.3]]  # [E] M2 same-scale render on the pod azimuth (2.75 mm / px) and ray cast: [x, half width]
bay_floor_m = [[0.72, 1.98], [0.76, 1.97], [1.0, 1.93], [1.2, 1.89], [1.4, 1.85], [1.6, 1.76], [1.82, 1.63]]  # [E] M2 ray cast [x, r] on the pod azimuth under the lip
nozzle_x_m = 1.5               # [E] D_CCP_Demo_2 (3): the two throats sit high in the bay
nozzle_half_x_m = 0.15         # [E] same photo, the lobed outlines ~0.3 m across
nozzle_half_az_deg = 4.0       # [E] same photo
nozzle_outline_scale = 0.9     # [E] same photo and D_Iss072e096331: only the outlines show on the closed bay (M2: nothing), inner edge of the line
# Seam of the nose: a plane through the body, x = seam_axis_x_m + seam_slope * Y (Y = r cos az): high on the hatch side, low at the hinge.
seam_axis_x_m = 4.0            # [E] M2 plane fit over the nose's lip, residual 1.4 mm
seam_slope = 0.26              # [E] same fit: tilt 14.8 deg; D_Iss071e186365 / D_Crew_2_..._mate show the tilted seam line
seam_gap_m = 0.008             # [E] visible seam line between capsule and closed nose
lip_thickness_m = 0.05         # [E] M2: inner lip r 0.77 at outer 0.82 (az 0), shell seat
# Nose hinge: pure rotation about the tangential axis through this point.
nose_hinge_x_m = 3.69          # [E] M2 animated node's pivot (3.690 above the shield apex)
nose_hinge_r_m = 1.108         # [E] same node: 1.108 from the axis on the az 180 side, just outside the skin
nose_hinge_azimuth_deg = 180.0 # [E] M2 and M4: opposite the hatch; D_Iss071e186365
nose_open_angle_deg = 120.0    # [E] M2 animation quaternion: exactly 120 deg (author's, not published); D_Iss071e186365 / D_Iss072e096331: cone lies beside the capsule, consistent to about +-15 deg
nose_open_time_s = 8.0         # [E] view easing only; the author's animation 1.7 s is a cartoon, the real motion takes seconds (no published value)
hinge_fairing_m = [3.62, 3.72, 1.12, 0.2]  # [E] M2 dark hinge parts lie under the skin at x < 3.6, D_Iss071e186365 shows only a small fairing at the seam: [x from, x to, outer r, width]
hinge_arm_m = [0.3, 0.05]      # [E] M2 strap inside the nose from the hinge to the seal ring: [width, thickness]
# Inside the nose, closed pose.
nose_inner_shoulder_m = [4.27, 0.72]   # [E] M2 meridian: shell's inside runs parallel to the skin up to here
nose_inner_cone_m = [[4.3, 0.72], [4.72, 0.31], [4.72, 0.0]]  # [E] M2 meridian az 0 / 90 / 180: inner cone with the port recess, flat end
nose_seal_m = [4.3, 0.6, 0.75]  # [E] M2 dark seal ring [x, r in, r out] that closes on the neck
# Neck under the nose (open pose), [x, r], outside to inside: deck, neck wall, top ring, recess to the port.
deck_x_m = 3.72                # [E] M2 meridian az 180: flat bulkhead at x 3.72 out to r 1.04
neck_m = [[3.72, 0.78], [4.2, 0.78], [4.22, 0.76], [4.22, 0.6], [3.98, 0.59], [3.98, 0.4], [3.74, 0.4], [3.74, 0.0]]  # [E] M2 meridians az 0 / 45 / 90 / 135 / 180
port_cone_m = [[3.98, 0.547], [4.23, 0.43], [4.44, 0.29]]  # [E] M2 'plastic' node: the place of the docking mechanism (Task 6), petals not drawn yet
deck_holes = [[56.0, 0.69, 0.07], [124.0, 0.69, 0.07], [236.0, 0.69, 0.07], [304.0, 0.69, 0.07]]  # [E] M2 dark discs on the top ring: [az, r, radius]; D-rendered nose Dracos are the config's physics pods, not these
# Surface details on the skin. Each [az deg, x, half x, half az deg]; mirrored to the side az < 0 where listed once.
windows = [[33.3, 2.38, 0.255, 5.5], [90.0, 2.385, 0.245, 5.6]]  # [E] M2 'okno' extents, mirrored; D_CCP_Demo_2 (3): window beside the hatch and one at the side
window_flange_scale = 1.25     # [E] D_CCP_Demo_2 (3): white flange around the glass
hatch = [0.0, 2.345, 0.645, 19.0]  # [E] M2 dark rim x 1.70-2.99, az +-18.9 (inner rim 15.8)
hatch_seam_m = 0.012           # [E] D_Crew_2_..._mate: a fine seam, not M2's wide rim (the photo wins)
draco_clusters_az_deg = [36.0, 144.0]  # [E] M2 dark slot groups, mirrored; D_CCP_Demo_2 (3): oval ports in the same place
draco_slots = [[0.98, 0.14, 0.035, 0.5, 25.0], [1.2, 0.1, 0.035, -0.5, 50.0], [1.42, 0.125, 0.035, 2.0, 5.0]]  # [E] M2 same-scale render on the pod azimuth: [x, half length, half width, az offset deg, lean from the axis deg toward the bay]
lift_panel_m = 0.008           # [E] panels above the skin: hatch, flanges
lift_detail_m = 0.014          # [E] dark details above the skin and panels

[trunk]
segments = 64                  # [E] sagitta 1 mm at R = 1.85 m
shield_well_m = 0.34           # [E] M2: white trunk top ring at x 0.34 above the shield apex: the apex sits in the trunk
top_wall_m = 0.04              # [E] M2: r 1.82 inside at 1.86 outside
floor_depth_m = 0.65           # [E] M2: dark floor at x -0.31 (0.65 under the top ring), the dome's recess
base_inner_r_m = 1.78          # [E] M2: dark base inside the ring r 1.78
fin_count = 4                  # [E] M2, M4, D_Crew_2_..._mate: four
fin_first_azimuth_deg = 0.0    # [E] M2: 0 / 90 / 180 / 270 relative to the hatch
fin_outline_m = [[-3.25, 1.85], [-3.21, 1.92], [-3.18, 2.55], [-3.11, 2.64], [-2.0, 2.64], [-1.87, 2.61], [-1.36, 2.45], [0.27, 1.92], [0.28, 1.85]]  # [E] M2 ray cast on az 0, [x above the shield apex, r]: full trunk height, swept upper edge (M2 tip 2.64, M4 2.7); D_Crew_2_..._mate same outline. Supersedes the "1.3 m fin" read of the first measurement.
fin_thickness_m = 0.05         # [E] M2: +-0.025
array_azimuths_deg = [[92.0, 178.0], [182.0, 268.0]]  # [E] M2 'radon_solar' only on the hinge side az 90-270; D_Iss072e096331: dark cells on one side, white on the other
radiator_azimuths_deg = [[-88.0, -2.0], [2.0, 88.0]]  # [E] the white half of the trunk on the hatch side, same photos
array_top_x_m = 0.26           # [E] M2 'radon_solar' top, above the shield apex
panel_base_m = 0.1             # [E] above the trunk base, M2 sits at the base ring
panel_proud_m = 0.012          # [E] cell layer thickness
umbilical_azimuth_deg = 21.0   # [E] M2 fairing that leaves with the trunk (its animation), az 15.3-26.7; D_CCP_Demo_2 (3): box at that place
umbilical_width_m = 0.39       # [E] same: 11.4 deg at r 2
umbilical_outline_m = [[0.056, 1.88], [0.1, 2.08], [0.4, 2.13], [0.7, 2.18], [1.15, 2.05], [1.194, 1.93]]  # [E] M2 extents by station: [x above the shield apex, outer r]
trunk_slots_m = [-0.28, -0.06, 0.09]  # [E] M2 dark ports near the trunk top: [x from, x to, width], az 45 / 135 / 225 / 315 read from the render
trunk_slots_azimuths_deg = [45.0, 135.0, 225.0, 315.0]  # [E] same

[paint]
