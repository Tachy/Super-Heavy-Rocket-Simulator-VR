windows = [[33.3, 2.38, 0.255, 5.5], [90.0, 2.385, 0.245, 5.6]]  # [E] M2 'okno' extents, mirrored; D_CCP_Demo_2 (3): window beside the hatch and one at the side
window_flange_scale = 1.25     # [E] D_CCP_Demo_2 (3): white flange around the glass
hatch = [0.0, 2.345, 0.645, 19.0]  # [E] M2 dark rim x 1.70-2.99, az +-18.9 (inner rim 15.8)
hatch_seam_m = 0.012           # [E] D_Crew_2_..._mate: a fine seam, not M2's wide rim (the photo wins)
draco_clusters_az_deg = [36.0, 144.0]  # [E] M2 dark slot groups, mirrored; D_CCP_Demo_2 (3): oval ports in the same place
draco_slots = [[0.98, 0.14, 0.035, 0.5, 25.0], [1.2, 0.1, 0.035, -0.5, 50.0], [1.42, 0.125, 0.035, 2.0, 5.0]]  # [E] M2 same-scale render on the pod azimuth: [x, half length, half width, az offset deg, lean from the axis deg toward the bay]
lift_panel_m = 0.008           # [E] panels above the skin: hatch, flanges
lift_detail_m = 0.014          # [E] dark details above the skin and panels

