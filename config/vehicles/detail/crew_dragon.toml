# Visual detail of crew_dragon (Crew Dragon capsule and trunk, hinged nose, docking mechanism): what the physics does not need.
# Placement and size come from config/vehicles/crew_dragon.toml (lengths, diameters, SuperDraco layout); this file never repeats them (tested).
# The docking mechanism: [idss], drawn by idss_mechanism.py; its HCS mating plane is `position_m` of the config's port = the first station of neck_m (tested).
# Every value line carries [E] (own estimate, method named) or [S] (published, URL). Keys: config/README.md; [idss]: docs/subsystems/vehicle-models.md.
# "M2" = reference "SpaceX - Dragon 2" (KUBAHA, CC BY 4.0), scaled to the 4.0 m diameter; ray-cast / vertex measurements by script (2026-11-02), re-typed here
# as a coarse table and re-drawn by gen_dragon.py, nothing of the mesh is copied or shipped (screenshots/falcon9_ref/INDEX.md 5.4, task-5-report "Task 5c").
# Photos checked against it: D_CCP_SpaceX_Demo_2_Dragon__3_ (closed capsule, cowl), D_Crew_2_..._Falcon_9_mate (capsule and trunk, fin outline), D_Iss071e186365 and
# D_Iss072e096331 (nose open, tilted seam, neck). Azimuth: 0 = hatch, 180 = nose hinge. Stations ("x") are metres above the heat shield apex (capsule station 0) unless stated.

[capsule]
az_step_deg = 3.0              # [E] column pitch outside the cowls: sagitta 2.7 mm at R = 2 m
nose_columns = 96              # [E] columns of the nose: sagitta 0.5 mm at R = 1.1 m
