shield_albedo = [0.07, 0.065, 0.06]  # [E] charred PICA-X (dark grey-brown)
band_albedo = [0.42, 0.42, 0.44]     # [E] bare aluminium band above the shield, D_CCP_Demo_2 (3)
cowl_albedo = [0.40, 0.40, 0.41]     # [E] grey metal bay interior, same photo
