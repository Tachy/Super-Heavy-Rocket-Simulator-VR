striker_box_m = [0.028, 0.018, 0.022]  # [E] half sizes tangential, radial, axial; the IDD names 3 strikers, no outline
# Six actuators of the soft-capture platform ([E]: the IDD defines the interface, not the actuators; the physics speaks of an "actuator platform". Six = what a 6-DOF ring needs, the stroke is the physics'.)
strut_pair_theta_deg = [90.0, 210.0, 330.0]  # [E] pairs under the petals
strut_top_half_deg = 15.0      # [E] top points +- about the pair
strut_base_half_deg = 45.0     # [E] base points +- about the pair
strut_top_r_m = 0.55           # [E] under the ring
strut_base_r_m = 0.52          # [E] on the recess floor, M2 floor r 0.4-0.59
