# Meridian of the whole body, shield apex to nose tip, on the surface of revolution outside the cowls: [x, r]. The last x equals the config's capsule length (tested).
profile_m = [[0.0, 0.0], [0.01, 0.33], [0.02, 0.47], [0.05, 0.72], [0.1, 1.05], [0.2, 1.5], [0.3, 1.77], [0.35, 1.88], [0.4, 1.93], [0.45, 1.97], [0.5, 1.99], [0.6, 2.0], [0.68, 1.99], [0.72, 1.98], [0.8, 1.97], [1.0, 1.96], [1.2, 1.93], [1.4, 1.9], [1.6, 1.86], [1.8, 1.81], [2.0, 1.75], [2.2, 1.69], [2.4, 1.62], [2.6, 1.55], [2.8, 1.47], [3.0, 1.39], [3.2, 1.31], [3.4, 1.23], [3.6, 1.14], [3.8, 1.04], [4.0, 0.94], [4.2, 0.83], [4.3, 0.78], [4.4, 0.72], [4.5, 0.65], [4.6, 0.57], [4.7, 0.44], [4.8, 0.25], [4.84, 0.1], [4.85, 0.0]]  # [E] M2 ray cast r(x) at az 0..30, mirror asymmetry 1.3 cm
# SuperDraco cowl: a raised lobe (hood + cheeks) on each pod azimuth of the config, with the open bay cut into its lower part.
hood_half_width_deg = 17.0     # [E] M2 ray cast x 2.2-2.4: lobe from az 46 to 80 about the pod at 63
hood_outer_m = [[0.8, 1.97], [1.0, 1.97], [1.2, 1.99], [1.6, 1.99], [1.85, 2.0], [1.9, 1.985], [2.0, 1.95], [2.16, 1.88], [2.37, 1.8], [2.63, 1.68], [2.83, 1.59], [3.16, 1.42], [3.52, 1.24], [3.8, 1.08], [4.0, 0.96], [4.2, 0.83]]  # [E] M2 ray cast [x, r] along the lobe's crown, az 60-75
bay_top_x_m = 1.82             # [E] M2: hood lip at x 1.81 on the pod azimuth
bay_corner_drop_m = 0.05       # [E] D_CCP_Demo_2 (3): the bay's top has round corners (M2's are nearly square: the photo wins)
bay_corner_power = 8.0         # [E] same photo: flat over the middle, the corners only
bay_half_width_deg_m = [[0.72, 15.6], [1.4, 14.0], [1.6, 11.7], [1.82, 10.3]]  # [E] M2 same-scale render on the pod azimuth (2.75 mm / px) and ray cast: [x, half width]
bay_floor_m = [[0.72, 1.98], [0.76, 1.97], [1.0, 1.93], [1.2, 1.89], [1.4, 1.85], [1.6, 1.76], [1.82, 1.63]]  # [E] M2 ray cast [x, r] on the pod azimuth under the lip
nozzle_x_m = 1.5               # [E] D_CCP_Demo_2 (3): the two throats sit high in the bay
