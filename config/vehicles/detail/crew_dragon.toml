[idss]
# IDSS Interface Definition Document Rev E (2016, NTRS 20170001546), [S] = dimension in the figure named; pdf page in brackets. Azimuth theta = the IDD's axial view, viewed from outside onto the port: 0 = line of androgyny = the port's `up`, clockwise.
# Copies of the physics defaults (contact/docking_interface.hpp, docking_mechanism.hpp: no config path there), test_idss_view_values.cpp compares them:
ring_extension_m = 0.30        # [E] copy of ring_extension_m: the ring's face above the HCS plane, full extension
ring_tilt_max_deg = 6.0        # [E] copy of ring_tilt_max_rad
petal_count = 3                # [S] copy; IDD 3.2.2.1 [p28]
petal_height_m = 0.20          # [S] copy; Fig 3.1.1.1-2 [p24] 200 REF
petal_base_diameter_m = 1.2    # [S] copy of 2 x petal_outline_radius_m; Fig 3.1.1.1-2 [p24]
hook_count = 12                # [S] copy; 3.2.3.4 [p42]
# Soft capture
scs_recess_m = 0.006           # [S] Fig 3.1.1.1-2 [p24] SCS mating plane 6 REF below the HCS plane
tunnel_diameter_m = 1.255      # [S] Fig 3.1.1.1-2 [p24]
petal_tip_diameter_m = 0.8     # [S] Fig 3.1.1.1-2 [p24] transfer passageway; with the height this is the 45 deg face of Fig 3.1.1.1-3 (the physics' petal_lean_rad 30 deg [E] differs: reported, not touched)
petal_theta_deg = [90.0, 210.0, 330.0]  # [S] Fig 3.1.1.1-1 [p23]: one on the line of symmetry, 120 deg pitch
striker_theta_deg = [30.0, 150.0, 270.0]  # [S] same figure: 3 latch strikers between the petals
petal_base_half_deg = 30.0     # [E] Fig 3.1.1.1-1 by eye: base corners +-30 deg (+-2)
petal_tip_half_deg = 10.6      # [E] same: tip edge +-0.075 m at r 0.4
petal_thickness_m = 0.006      # [E] plate
petal_rib_foot_m = [0.46, 0.03]  # [E] Fig 3.1.1.1-3 by eye: rear rib from the tip to r, depth below the SCS plane
ring_section_m = [[0.575, -0.09], [0.575, -0.02], [0.585, -0.012], [0.6, 0.0], [0.612, -0.008], [0.622, -0.03], [0.622, -0.09]]  # [E] capture ring [r, x from the SCS plane]: peak at the petal base [S], pentagon of Fig 3.1.1.1-3 by eye (the figure's section is not to scale), OD inside the tunnel
