nozzle_half_az_deg = 4.0       # [E] same photo
nozzle_outline_scale = 0.9     # [E] same photo and D_Iss072e096331: only the outlines show on the closed bay (M2: nothing), inner edge of the line
# Seam of the nose: a plane through the body, x = seam_axis_x_m + seam_slope * Y (Y = r cos az): high on the hatch side, low at the hinge.
seam_axis_x_m = 4.0            # [E] M2 plane fit over the nose's lip, residual 1.4 mm
seam_slope = 0.26              # [E] same fit: tilt 14.8 deg; D_Iss071e186365 / D_Crew_2_..._mate show the tilted seam line
seam_gap_m = 0.008             # [E] visible seam line between capsule and closed nose
lip_thickness_m = 0.05         # [E] M2: inner lip r 0.77 at outer 0.82 (az 0), shell seat
# Nose hinge: pure rotation about the tangential axis through this point.
nose_hinge_x_m = 3.69          # [E] M2 animated node's pivot (3.690 above the shield apex)
nose_hinge_r_m = 1.108         # [E] same node: 1.108 from the axis on the az 180 side, just outside the skin
nose_hinge_azimuth_deg = 180.0 # [E] M2 and M4: opposite the hatch; D_Iss071e186365
nose_open_angle_deg = 120.0    # [E] M2 animation quaternion: exactly 120 deg (author's, not published); D_Iss071e186365 / D_Iss072e096331: cone lies beside the capsule, consistent to about +-15 deg
nose_open_time_s = 8.0         # [E] view easing only; the author's animation 1.7 s is a cartoon, the real motion takes seconds (no published value)
hinge_fairing_m = [3.62, 3.72, 1.12, 0.2]  # [E] M2 dark hinge parts lie under the skin at x < 3.6, D_Iss071e186365 shows only a small fairing at the seam: [x from, x to, outer r, width]
hinge_arm_m = [0.3, 0.05]      # [E] M2 strap inside the nose from the hinge to the outer edge of the seal ring (clear of the flange): [width, thickness]
# Inside the nose, closed pose.
nose_inner_shoulder_m = [4.27, 0.72]   # [E] M2 meridian: shell's inside runs parallel to the skin up to here
nose_inner_cone_m = [[4.3, 0.72], [4.72, 0.31], [4.72, 0.0]]  # [E] M2 meridian az 0 / 90 / 180: inner cone with the port recess, flat end
nose_seal_m = [4.3, 0.6, 0.75]  # [E] M2 dark seal ring [x, r in, r out] that closes on the neck
# Under the nose (open pose): a white conical skirt from the seat on the seam plane to the flange (photo D_Iss071e186365: skin runs on past the seam line, Draco slot on it; M2's flat deck at 3.72 + cylinder not followed: the photo wins).
# neck_m [x, r]: flange top (the mating plane), tunnel, recess floor, well to the hatch.
neck_m = [[4.22, 0.70], [4.22, 0.6275], [3.98, 0.6275], [3.98, 0.4], [3.74, 0.4], [3.74, 0.0]]  # [E] station 4.22, floor 3.98 and well 3.74, r 0.4: M2 meridians; r 0.6275 [S: IDSS IDD E Fig 3.1.1.1-2 tunnel ID 1255]; r 0.70 flange OD [E, the IDD leaves it open: pin circle 687.5 + pin 12.5 mm; D_Iss065e002827: white starts about there]
deck_holes = [[56.0, 0.76, 0.05], [124.0, 0.76, 0.05], [236.0, 0.76, 0.05], [304.0, 0.76, 0.05]]  # [E] round ports on the skirt: [az, r, radius]. Az M2 (D_Iss065e002827 head-on: 64 / 118 / 241 / 309, low resolution); r from the same photo, M2 0.69 would lie on the hook circle
deck_slot = [224.0, 0.80, 0.09, 0.035]  # [E] the oval Draco slot on the skirt: D_Iss065e002827 az ~224, D_Iss071e186365 ~220: [az, r, half length along the circle, half width]
