# Measured layout of the ISS (NASA 3D Resources model D, IGOAL; vertices read by tools/structures/measure/iss_measure.py, nothing copied).
# Station frame of config/vehicles/iss.toml: x forward from the aft end of the Russian segment (Zvezda aft end), y starboard and z nadir from the module axis.
# Accuracy: scale +-0.5 % (cross-checks in docs/subsystems/iss.md), plane and axis fits +-0.1 m; extents include fittings of the node's own mesh.
# Gaps against config/vehicles/iss.toml: see docs/subsystems/iss.md (Model D measurement).

[scale]
metres_per_unit = 0.025420                      # [D] NASA ISS model D, vertex extents by script (iss_measure.py): 109 m span with the P6/S6 arrays turned broadside; the file's unit is 1 inch
truss_end_to_end_m = 97.92                   # [D] NASA ISS model D, vertex extents by script (iss_measure.py): truss without arrays
array_span_m = 109.00                        # [D] NASA ISS model D, vertex extents by script (iss_measure.py): 109 m [S: NASA / Wikipedia 'width']
aft_end_model_x_m = -35.76                      # [D] NASA ISS model D, vertex extents by script (iss_measure.py): model x of the Russian segment aft end (config x = model x - this)
