# Measured layout of the ISS (NASA 3D Resources model D, IGOAL; vertices read by tools/structures/measure/iss_measure.py, nothing copied).
# Station frame of config/vehicles/iss.toml: x forward from the aft end of the Russian segment (Zvezda aft end), y starboard and z nadir from the module axis.
# Accuracy: scale +-0.5 % (cross-checks in docs/subsystems/iss.md), plane and axis fits +-0.1 m; extents include fittings of the node's own mesh.
# Gaps against config/vehicles/iss.toml: see docs/subsystems/iss.md (Model D measurement).

