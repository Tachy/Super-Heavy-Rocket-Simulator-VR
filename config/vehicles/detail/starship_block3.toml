# Visual detail of starship_block3 (Super Heavy Block 3 + Starship Block 3): what the physics does not need.
# Placement and size come from config/vehicles/starship_block3.toml and config/engines/*.toml (length, diameter, nose,
# flap hinges / spans, fin station / radius / area, catch pins, engine rings, nozzle exit diameters, belly azimuth); this
# file never repeats them. Every value line carries [E] (own estimate, method named) or [S] (published, URL).
# Photo scale: spacex-starship-108 (9 m hull = 165 px, 18.3 px/m), references only in the git-ignored
# screenshots/mechazilla/; no photo pixels are used. Keys: config/README.md.

[hull]
segments = 128                     # [E] radial segments of the plain lathe: sagitta 1.4 mm at R = 4.5 m (the silhouette at close range)
ring_pitch_m = 2.0                 # [E] +-0.15 m: NSF photo 2026-03 (9 m = 41 px/m): rings 81 px apart on Booster 19; photo 108 (Block 2) read 1.8
weld_height_m = 0.005              # [E] weld bead height (baked into the steel normal map, not mesh); same bead slope 0.25 as before
weld_half_width_m = 0.02           # [E] half width of the bead: 4 cm line; frames (ref_steel_q, f12 / f13 close hull) show hairlines of 1-3 px at 41 px/m, i.e. <= 5 cm (upper bound, not resolved); was 10 cm
dent_slope_rms = 0.012             # [E] oil-canning dents of the steel map: rms slope (old analytic dents ~0.03-0.04)
dome_start_m = 2.88                # [E] booster: barrel end below the top = hot-stage ring 0.6 + dome height (section of ss3-booster-tank-top: shoulder y 20.7, apex 22.98 = the ring seat)
dome_height_m = 2.56               # [E] booster: forward dome from the shoulder to the ring's foot (0.32 m ring): NSF photo 2026-03 shoulder 3.07 +-0.15 m below the top; apex not visible
nose_tip_radius_m = 0.5            # [E] the ogive ends in a blunt rounded tip (photo 108: ~1 m across; model tip radius 0.55)
nose_tip_cap_m = 0.25              # [E] model: the tip closes within 0.2 m axially (blunt, not a ball); photo 108 ~1 m across
nose_drawn_length_m = 13.4         # [E] drawn tangent ogive (R = 4.5 m): 1:100 model x 0.1 and photo 108 (curved part ~11-13 m); the physics nose_length_m of the config (17 m) is NOT drawn
base_chamfer_m = 0.25              # [E] aft edge chamfer of the skirt (radial and axial)

[booster.hot_stage]
height_m = 4.0                     # [E] +-0.15 m: NSF photo 2026-03: top of the ring to the fork feet 157 px at 41 px/m, elevation 17 deg
flange_height_m = 0.10             # [E] photo 2026-03: only a thin line at the shoulder, no collar
flange_proud_m = 0.02              # [E] same photo

[booster.hot_stage_ring]
height_m = 0.32                    # [E] +-0.05 m: NSF photo 2026-03: flat band 13 px at 41 px/m (Booster 19, unstacked); replaces the model's 0.6
inner_radius_m = 4.15              # [E] same part: r 4.15 .. 4.50

[booster.top_truss]
tooth_count = 20                   # [E] model: model: 20 V teeth around the top ring, 18 deg pitch (photo: zigzag ring on the booster top)
height_m = 3.05                    # [E] +-0.15 m: ring top to the V valley, same photo (rods 2.72 m)
tube_radius_m = 0.13               # [E] +-0.02 m: largest rod radius: 10.7 px wide at 41.1 px/m = 0.26 m (9 m ratio, NSF photo 2026-03)
post_height_m = 0.95               # [E] fork legs below the valley block, same photo (0.97 m)
taper_top = 0.58                   # [E] rod end at the ring: 6 px = 0.15 m wide (same photo; a spindle)
taper_foot = 0.42                  # [E] rod end at the valley: 4.7 px = 0.11 m wide

[booster.skirt]
base_ring_radius_m = 0.15          # [E] model: base ring 4.65 m
ring_stations_m = [0.7, 1.05, 1.95, 2.35]   # [E] model: four thin ring tubes around the skirt (r 4.9), seen in the model view
ring_proud_m = 0.35                # [E] model: the ring tubes stand 0.35-0.4 m out of the 4.5 m hull
ring_thickness_m = 0.12            # [E] model: tube ~0.1 m
tooth_count = 48                   # [E] model: comb of posts between the middle rings, counted ~24 on the visible half
tooth_height_m = 0.7               # [E] model
tooth_station_m = 1.5              # [E] model: tooth band centre above the base
tooth_proud_m = 0.28               # [E] model
port_count = 4                     # [E] one skirt port in the model; the count is not known, four drawn
port_width_m = 0.57                # [E] model: model port 0.57 x 0.74 x 0.8
port_height_m = 0.80               # [E] model
port_proud_m = 0.25                # [E] model
port_station_m = 3.3               # [E] model: port centre above the base (model 2.87 .. 3.67)

[booster.raceway]
azimuth_deg = 270.0                # [E] pill-shaped line fairing seen along the booster in the model (tank-top part); side unknown
pill_width_m = 0.7                 # [E] model: pill seen in the tank-top part, 0.7 wide
pill_length_m = 5.0                # [E] model: pill length (view of the tank-top part)
pill_pitch_m = 23.1                # [E] one pill per tank section (model: tank parts 23.1 m)
height_m = 0.12                    # [E]
rail_radius_m = 0.04               # [E] thin rail next to the pills

[booster.strakes]
# 1:100 model (tank-bottom / tank-center STL, hull r 4.5): four long ridges, 0.82 m high / ~1 m wide, with 1.7 m brackets at
# the ends, at azimuth 67 / 113 / -21 / -159 (+-23 deg about +90 deg, +-69 deg about -90 deg); the +90 pair continues 8 m
# into the centre tank part. Photo 2026-05 (full stack on the mount): two tall boxes with a sloped top, up to ~25.6 m above
# the base, ~1.5 m out of the silhouette. Height 1.2 m = between model and photo (+-0.4 m).
ridge_azimuth_deg = [67.0, 113.0, 339.0, 201.0]   # [E] model (azimuth of the model's x / z axes taken as ours)
from_m = [3.2, 3.2, 3.2, 3.2]                # [E] lower end: the tank-bottom part starts here (skirt top)
to_m = [34.4, 34.4, 25.8, 25.8]              # [E] model: 23.1 m (bottom tank) + 8 m (centre tank) / photo end 25.6 m
height_m = 1.2                               # [E] see above
base_width_m = 1.0                           # [E] model: section at 10.5 m, azimuth 60-72 deg
top_width_m = 0.7                            # [E] flank slope in the model section (0.54 -> 0.82 m)
chamfer_m = 5.0                              # [E] soft fairing ramp at the upper end, straight to flush (photos: stack on the mount, sloped soft end, no point)

[ship.ports]
port_count = 2                     # [E] transfer ports (model 0.9 x 0.45 x 0.8 m part); position not known, drawn on the lee side
placed_at_m = 44.0                 # [E] port station
azimuth_from_belly_deg = 180.0     # [E]
spread_deg = 14.0                  # [E] the two ports straddle the lee line by this angle
port_radius_m = 0.4                # [E] round fitting (the 1:100 part is a 0.9 x 0.8 m block: print form; photos show round couplings)
port_height_m = 0.45               # [E] model

[booster.grid_fin_fairing]
length_frac = 0.25                 # [E] unused since the round mount ring (kept for the spec check)
width_m = 1.4                      # [E] +-0.3 m: round mount ring diameter, B19 image (dark ring ~14 px of 9.1 px/m)
height_m = 0.12                    # [E] mount ring height out of the hull (the fin plate starts at 0.15 m)

[grid_fin]
# Plan geometry from the 1:100 model's plain fin STL (screenshots/starship_v3_ref/ss3-grid-fin.stl, x 0.1; measured by
# tools/structures/measure/fin_stl_outline.py, nothing of the mesh is copied): an irregular octagon, exactly mirror-symmetric about the
# hinge axis (axis error 0.000 m), wall lattice at 45 deg to the axis, square cells, a crossing on the axis. Checked against the
# installed-fin image: its outline holds 102.9 cells = the STL's 102.9 cells (pitch 0.350 m), rows of 11 cells match. (z chord, y span from the root.)
outline_z_m = [-0.173, 0.173, 1.766, 1.764, 0.990, -0.990, -1.764, -1.766]   # [E] STL 1:100 model root chamfer 0.35, tapers, parallel sides, tail chamfers, tail 1.98
outline_y_m = [0.0, 0.0, 1.751, 3.762, 4.536, 4.536, 3.762, 1.751]           # [E] STL 1:100 model root at the hinge; cross rib at 1.751 (corner to corner)
thickness_m = 0.50                 # [E] +-0.1 m: rim band 0.43 m + cusp tips, NSF photo 2026-03 at 17 deg elevation (model 0.4 / 0.7)
cell_pitch_m = 0.350               # [E] STL 1:100 model +-0.005 m wall pitch (square cells, walls +-45 deg to the axis); the installed-fin image gives the same: 102.9 cells in the outline
wall_m = 0.04                      # [E] wall thickness not resolved in any frame (model 0.045): upper bound
frame_m = 0.07                     # [E] +-0.03 m: outer frame wall thickness, closed all round the outline (template 333b32ea and factory 3ef6737f: about as thick as 1.5-2 lattice walls; not resolved)
band_m = 0.08                      # [E] +-0.03 m: thin light band on the upper rim face, only along band_edges (template image, user 2026-10-31)
band_edges = [7, 0, 1]             # [E] outline edges with the thin light band: left taper, root chamfer, right taper (the frame wall runs round all 8 edges)
lattice_inset_m = 0.02             # [E] the walls end this far inside the outline
edge_tooth_depth_m = 0.22          # [E] +-0.05 m: depth of the frame's soft free-edge arcs (one per wall end, wave in the template's lower edge)
cusp_dip_aft_m = 0.30             # [E] +-0.08 m: saddle scoop of the aft face (the face seen from below), measured against the template hearts: a scoop of 0.3 of the 0.5 m depth turns the openings into hearts at a 25-30 deg view (ray test `measure/fin_hearts.py`); factory photo 3ef6737f shows deep scoops on the visible face
cusp_dip_fwd_m = 0.0              # [E] forward face: flat (not seen in any photo; hearts need one flat and one scooped face, the other combinations give lenses or chevrons)
cusp_soft = 0.3                   # [E] 0 = pointed saddle tips (sin), 1 = round tips; template tips are crisp but not needles
cusp_steps = 3                     # [E] profile segments per wall between two crossings (triangle budget)
rib_y_m = 1.751                    # [E] STL 1:100 model cross rib corner to corner, 1.75 m from the root chamfer
rib_thickness_m = 0.06             # [E] cross rib wall
rib_wave_m = 0.13                  # [E] cross rib wave amplitude of its free edges
hinge_ring_radius_m = 0.40               # [E] +-0.08 m: round bolted hinge ring at the root (installed-fin photo)
ring_length_m = 0.15               # [E] ring height along the hinge axis: its top touches the root chamfer
ring_bolts = 12                    # [E] bolt heads on the ring
strut_beam_m = 0.05                # [E] +-0.02 m: wall of the mount housing
lattice_axis_y_m = 5.003          # [E] STL 1:100 model a wall crossing on the axis this far from the root vertex (crossings every 0.495)
housing_half_root_m = 0.173       # [E] mount housing half width at the root chamfer
housing_half_rib_m = 0.45         # [E] +-0.1 m: half width at the cross rib (factory photo from the root side: ~0.9 m)
catch_fin_azimuths_deg = [0.0, 180.0]   # [E] fins that carry the flat bar under the root: the bar is seen on one fin of the opposite pair, the 90 deg fin has none (user images 2026-10-31); the second opposite fin is unseen: fallback 0 / 180
bearing_length_m = 0.50            # [E] +-0.2 m: flat bar under the root, oblique view of the installed fin, ~170 px/m
bearing_width_m = 0.15             # [E] +-0.06 m
bearing_thickness_m = 0.04         # [E] +-0.02 m: not resolved
bearing_slant_deg = 30.0           # [E] +-12 deg: slant of the bar against the chord axis, seen from above
root_gap_m = 0.15                  # [E] the corner hangs just off the hull on the stem (aerial 2026-04)
shaft_radius_m = 0.12              # [E] hinge shaft, along the radial axis
shaft_inset_m = 0.6                # [E] the shaft continues this far into the hull

# Flaps redrawn from the 1:100 model (Printables "I am Darth", CC BY-NC-SA 4.0; geometry measured, nothing copied). Planform
# in the hinge frame: u along the hinge from its aft end, v = span away from the hinge (u may be < 0 = the panel overhangs the
# hinge's aft end). The drawn hinge edge is centred on the physics hinge.
[flap]
root_thickness_m = 0.45            # [E] wedge section: thickness at the hinge (model: slab 0.45 at the hinge)
tip_thickness_m = 0.20             # [E] thickness at the outer edge (model 0.2-0.25)
hinge_radius_m = 0.20              # [E] no proud tube in f14 5099 s / 5299 s: the hinge sits in the cover
lug_length_m = 0.6                 # [E] hinge lug along the hinge (model pegs 0.5)
lug_height_m = 0.7                 # [E] lug height normal to the hinge (model lugs 0.3-0.5 out of the panel)

[flap.aft]
hinge_drawn_length_m = 12.0        # [E] model: 1:100 model hinge edge 11.99 m (physics 12 m)
outline_u_m = [0.0, 12.0, 12.0, 7.2, 0.0]     # [E] model: model x 0.1: hinge edge, forward tip, swept outer edge, outer corner
outline_v_m = [0.0, 0.0, 0.44, 3.69, 3.69]    # [E] model: span 3.69 m (physics 4.0 m); area 36.5 m^2 (physics 48)
lug_u_m = [0.8, 5.0, 10.7]         # [E] +-0.7 m: f14 file 5099 / 5299 s: two V brackets and one central actuator T (the model's 4 pegs are not on the flap)

[flap.fwd]
hinge_drawn_length_m = 5.8         # [E] model: model hinge edge 5.8 m (physics 8 m); the real hinge also leans 19 deg along the ogive
outline_u_m = [0.0, 5.8, 5.7, 0.48, -1.49]    # [E] model: model x 0.1 (swept quad with an aft foot beyond the hinge's aft end)
outline_v_m = [0.0, 0.0, 0.2, 3.04, 2.31]     # [E] model: span 3.04 m (physics 3.0 m); area 13.8 m^2 (physics 24)
lug_u_m = [0.46, 5.3]              # [E] two brackets assumed like the aft flap, f12 1804 s does not resolve them

[catch_pin]
radius_m = 0.25                    # [E] pin shaft radius
head_radius_m = 0.4                # [E] pin head radius
head_length_m = 0.25               # [E] pin head length (the protrusion beyond the hull is the config's)

# Exit plane of each engine kind above the ship's aft end (0 = rim flush with the aft edge; a bell is wholly inside the hull).
# Drawn gimbal station = this + bell_length_m; the physics keeps its own gimbal at station 0 (docs: deviations table).
# Measured: docs/subsystems/vehicle-models.md "Stage interface".
[ship.engine_recess]
raptor3 = 0.0                      # [E] +-0.3 m: camera fit to frame f12 file 138.9 s gives +0.02 +-0.08 m (fit error) against the RVac rims; model section 0.0
raptor_vacuum3 = 0.0               # [E] +-0.15 m: Ship 39 from below (stack_S39_base_gamma): cover plane -0.07 m; hull rim fit +0.04 +-0.07 m; model section 0.0

# The open aft end (user 2026-10-31, frames f12 138.9 s, f13 2262 s, Ship 39 photo; shapes from ss3-ship-engine-plate).
[ship.engine_bay]
aft_chamfer_m = 0.05               # [E] the rim is nearly square in the Ship 39 photo (replaces the hull's base_chamfer_m on the ship)
wall_inner_radius_m = 4.41         # [E] model section: wall 0.09 m at the aft end
plate_station_m = 3.7              # [E] model section: flat engine plate 3.7 m above the aft end
plate_radius_m = [2.8, 1.8, 1.4, 0.0]      # [E] model section: flat from the wall to r 2.8, then the cone of the centre puck (f13 2256.5 s shows the puck)
plate_cone_station_m = [3.7, 2.95, 2.7, 2.7]  # [E] model section, stations of the radii above
ring_stations_m = [0.9, 1.8, 2.8]  # [E] three inner frames above the rim: f12 138.9 s, three stringer rows on the far wall
ring_height_m = 0.06               # [E]
ring_depth_m = 0.14                # [E]
stringer_count = 96                # [E] dense stringers in frame f13 2262 s (not counted; about 30 cm pitch)
stringer_width_m = 0.05            # [E]
stringer_depth_m = 0.09            # [E]

[flap.hinge_cover]
width_m = 1.3                      # [E] tiled cover on the hull, belly side of the hinge, flap motion clear: f12 1804 s, f14 4949 s (not measurable better than +-0.3 m)
height_m = 0.5                     # [E] +-0.2 m: bulge out of the hull at the hinge, same frames
fade_m = 1.0                       # [E] tapers into the hull at both ends
overhang_m = 0.8                   # [E] continues beyond the hinge ends

[ship.chine]
width_m = 0.30                     # [E] strake width along the tile boundary
height_m = 0.12                    # [E] strake height out of the hull
fade_m = 1.5                       # [E] the strake grows from the hull over this length at both ends
first_station_m = 1.0              # [E] starts above the skirt
last_station_m = 38.5              # [E] ends where the nose is wrapped completely (the model's nose shield closes round the ogive)

[ship.raceway]
azimuth_from_belly_deg = 180.0     # [E] on the lee side, opposite the belly (position not verified against Block 3)
radius_m = 0.12                    # [E] cable raceway tube
foot_width_m = 0.7                 # [E] the wider saddle feet under the tube (ship aft photos: the raceway widens at its brackets)
foot_length_m = 0.4                # [E]
foot_height_m = 0.06               # [E]
first_station_m = 1.5              # [E]
last_station_m = 36.0              # [E] ends below the nose

# Heat-shield layout for the tile shader (task 3) and the chine: tile coverage around the belly per station from the
# ship's base. [E] model from the 1:100 model's three shield shells (half angle around the belly: aft shell +-90, upper shell
# +-78, nose shell closes all round); photos 108 / 2026-05 agree (the nose is dark all round). Replaces the earlier [E]
# table 75 / 65 / 55 / 30.
[ship.tiles]
hex_across_flats_m = 0.30          # [E] research-models 7.2: forum estimate, no official size
gap_m = 0.006                      # [E] gap between tiles
coverage_station_m = [0.0, 13.0, 13.5, 21.5, 22.0, 38.0, 41.0, 52.1]    # [E] see vehicle-models.md "Tile boundary": Ship 42 photo 2026-09
coverage_half_angle_deg = [90.0, 90.0, 112.0, 112.0, 105.0, 105.0, 180.0, 180.0]  # [E] +-10 deg: read on one side, the other taken symmetric (stack photo 2026-05: both silhouettes black)

[engines.raptor3]
file = "raptor.gltf"               # [E] model file name
bell_length_m = 2.1                # [E] gimbal point to exit plane (Raptor 3 is ~3.1 m tall incl. chamber and pumps)
throat_from_exit_m = 1.35          # [E] +-0.3 m: f14 file 2515 s: bell height / exit width 1.04 (model 1.3); above it the chamber
rib_count = 200                    # [E] fine regen ribs, f14 file 2563 s (not countable); read only up close
throat_diameter_m = 0.30           # [E]
contour_exponent = 0.5             # [E] bell radius r = r_t + (r_e - r_t) * (z / L)^exponent (parabola-like, quick opening)
wall_m = 0.02                      # [E] bell wall
mount_height_m = 1.0               # [E] chamber / pump housing above the gimbal point (inside the stage's skirt)
mount_radius_frac = 0.45           # [E] housing radius as a fraction of the exit radius
segments = 32                      # [E]

[engines.raptor_vacuum3]
file = "rvac.gltf"                 # [E] model file name
bell_length_m = 3.6                # [E] gimbal point to exit plane incl. the nozzle extension
throat_from_exit_m = 3.0           # [E] +-0.4 m: f14 file 2515 s: height / rim width 1.37 x perspective (model 2.8)
rib_count = 80                     # [E] flutes, f14 file 2515 s: ~40 on the visible half
throat_diameter_m = 0.30           # [E]
contour_exponent = 0.5             # [E]
wall_m = 0.02                      # [E]
mount_height_m = 1.0               # [E]
mount_radius_frac = 0.30           # [E]
segments = 40                      # [E]
