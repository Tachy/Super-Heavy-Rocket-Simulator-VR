# Starship V3: Super Heavy Block 3 + Starship Block 3 (from flight test 12, 2026)
# Many masses are not public yet -> [E] values; calibrate against telemetry.
# dry_mass_kg always INCLUDES the installed engines.

[sources]
wiki_sh = "https://en.wikipedia.org/wiki/SpaceX_Super_Heavy (retrieved 2026-10-12)"
wiki_starship = "https://en.wikipedia.org/wiki/SpaceX_Starship (retrieved 2026-10-12)"
nsf_b3 = "https://www.nasaspaceflight.com/2026/05/super-heavy-block-3-booster-future/"
satnews = "https://satnews.com/2026/05/14/spacex-debuts-starship-v3-redefining-heavy-lift-launch-capability/"
satnews_2025_10 = "https://news.satnews.com/2025/10/05/spacex-prepares-starship-for-11th-flight-test-on-the-13th-using-a-new-engine-configuration/ (V3 landing burn baseline: 13 -> 5 divert -> 3 centre engines, ending in a hover)"
faa_ea_2024 = "https://www.faa.gov/media/87636 (FAA Revised Draft EA, Nov 2024, p. 7): up to ~74 t residual propellant on Super Heavy for landing, incl. expenditures"

[vehicle]
id = "starship_block3"
name = "Starship V3 (Super Heavy Block 3 / Ship Block 3)"
display_name = "Heavy Launcher Mk3"
propellant = "methalox"
stages_bottom_to_top = ["booster", "ship"]

# ---------------------------------------------------------------- booster
[[stage]]
id = "booster"
name = "Super Heavy Block 3"
display_name = "Booster Mk3"  # [D] display name of the part flying alone, no trademark
length_m = 72.3                          # [S:wiki_sh]
diameter_m = 9.0                         # [S:wiki_sh]
dry_mass_kg = 210000.0                   # [D] +-40 t: flights 12-14 telemetry - stack mass balance (gauge + acceleration, minus
                                         # the ship: 165-215 t) and the descent ballistic coefficient (~20 % below Block 1/2,
                                         # if the drag shape is unchanged). Previously 255 t [E].
dry_cg_station_m = 24.0                  # [E]
jettison_after_separation_kg = 0.0       # hot-stage truss integrated, not jettisoned [S:wiki_sh, nsf_b3]
# [D] the ascent guidance throttles the stack to hold q at or below this: the peak dynamic pressure of flight 14 (the
# webcast's speed and altitude with US76 air; the recorded q holds at 38-39 kPa from T+58 s to T+71 s - a max-Q hold):
#   python tools/telemetry/peak_dynamic_pressure.py tests/validation/telemetry/flight14_2026-09-28.csv
#   -> peak q 38909 Pa at T+63.0 s (h 9.20 km, v 413.1 m/s, Mach 1.36)
max_dynamic_pressure_pa = 38909.0
# [D] operational ascent throttle (user 2026-10-23: the throttle the flights flew is vehicle data; 280 tf stays the
# engines' capability for every other burn): the propellant gauge's mean mass flow before max-Q against the rated flow
# (33 x 280 tf / 330 s = 28.00 t/s), 3,650 t at 100 %:
#   python tools/telemetry/mass_estimate.py tests/validation/telemetry/flight14_2026-09-28.csv --capacity-t 3650
#       --isp-sl 330 --isp-vac 350 --from 20 --to 56 --engine-rating-tf 280   -> 24.45 t/s = 0.873 of the rated flow
#   (the same for flight13_2026-07-24.csv)                                     -> 25.02 t/s = 0.894
# After max-Q (T+70-125 s) the flow stays at 0.871 / 0.856: no separate late-boost limit (the drop in the last ~10 s
# before MECO falls with the acceleration, not a constant-acceleration hold).
max_ascent_throttle = 0.88

# Hot staging (FlightSession::stage, ascent trajectory and staging Task 1): MECO cuts the outer engines, the 3 centre
# engines run on at minimum throttle [S:wiki_starship], the ship's engines start while joined, the separation follows
# once they are at thrust - the ship's start-up time (raptor3 / raptor_vacuum3 startup_s 3.0 s [E]): the flight 14
# telemetry has no samples from T+138.75 s to T+146.25 s across the staging. The centre engines stay lit into the flip
# ([stage.recovery] flips on the final landing set).
[stage.staging]
kind = "hot"
run_on_engine_groups = ["center"]

[[stage.tank]]
id = "lox_main"
contents = "oxidizer"
mass_kg = 2856500.0                      # [D] 3,650 t total [S:wiki_starship] split at O/F 3.6
base_station_m = 4.5                     # [E]

[[stage.tank]]
id = "ch4_main"
contents = "fuel"
mass_kg = 793500.0                       # [D]
base_station_m = 42.6                    # [E]

[[stage.engine_group]]
id = "center"
engine = "raptor3"
count = 3
ring_radius_m = 0.88                     # [E, STL 1:100] 0.878 m; 3 lips of 1.32 m: chord 1.52 m, gap +0.20 m (no-touch bound 0.76 m)
gimbal = true
relight = true

[[stage.engine_group]]
id = "divert"                            # with the centre engines: the 5-engine divert phase of the landing burn
engine = "raptor3"                       # (V3 baseline 13 -> 5 -> 3 [S:satnews_2025_10]); which pair: [E]
count = 2
ring_radius_m = 2.55                     # [E, STL 1:100] 2.550 m middle ring; 10 lips: chord 1.58 m, gap +0.26 m
angles_deg = [0.0, 180.0]                # [E] a symmetric pair
gimbal = true
relight = true

[[stage.engine_group]]
id = "middle"                            # the other 8 engines of the 10-engine middle ring
engine = "raptor3"
count = 8
ring_radius_m = 2.55                     # [E, STL 1:100] 2.550 m
angles_deg = [36.0, 72.0, 108.0, 144.0, 216.0, 252.0, 288.0, 324.0]
gimbal = true
relight = true

[[stage.engine_group]]
id = "outer"
engine = "raptor3"
count = 20
ring_radius_m = 4.40                     # [E] 1:100 STL engine plate 4.40 m; user photo 2026-11-03 4.3 +-0.15 m; no-touch bound for 20 lips of 1.32 m: 4.22 m
gimbal = false                           # [E]
relight = true                           # Raptor 3 outer engines can relight [S:wiki_sh]

[stage.aero]
reference_diameter_m = 9.0
ascent_drag_table = "aero/starship_stack_ascent.csv"
descent_drag_table = "aero/super_heavy_descent.csv"  # tail first (booster return)

[stage.grid_fins]
azimuths_deg = [0.0, 90.0, 180.0]          # [E] layout 3 fins, ~1.5x Block 2 size, 90/90/180 deg spacing [S:wiki_sh]
area_m2 = 12.63                       # [E] gross area inside the outline, STL 1:100 model (detail [grid_fin] outline; 102.9 cells x 0.35^2 = 12.60), docs/subsystems/aero-derivation.md; was 13.5
station_m = 64.0                       # [E] hinge station from the bottom of the stage (below the hot-staging ring)
radius_m = 7.19                         # [E] centre of pressure = drawn outline centroid: 4.5 m hull + 0.15 m root gap + 2.544 m (detail [grid_fin] outline); was 6.0
max_deflection_deg = 30.0               # [E]
rate_deg_s = 30.0                       # [E] electric actuators
table = "aero/super_heavy_grid_fin.csv"  # [E] lattice derivation (depth, pitch, wall); ca_axial as identified

[stage.catch_pins]
azimuths_deg = [0.0, 180.0]             # [E] on the fin hinge line (user 2026-10-31): the pins lie across the arms, was 45 / 225
station_m = 63.0                       # [E] hinge station of the grid fins (64.0) - 1.0 (user 2026-10-31); was 66.5
protrusion_m = 1.0                     # [E] beyond the hull
max_load_n = 5.0e6                     # [E] structural limit per pin (~1.9 g of a 275 t booster on two pins)
away_from_tower_azimuth_deg = 90.0     # [E] the single 90 deg fin looks away from the tower, the fin gap at it (user 2026-10-31)

[stage.recovery]
method = "tower_catch"
reserve_propellant_kg = 225000.0         # [D] MECO without return guidance (with it, the autopilot plans MECO from landing_propellant_kg)
landing_propellant_kg = 51000.0          # [D] at landing-burn ignition: flight 14 gauge 1.4 % of 3,650 t after the boostback, video T+188-195 s (FAA EA cap 74 t [S:faa_ea_2024])
rcs_propellant_kg = 1700.0               # [D] main-tank RCS gas MECO -> landing-burn ignition: our full return arrived with
                                         # 49.2 t instead of 50.9 t once the RCS drew it (d1)
nominal_meco_s = 160.0                   # [E]
nominal_meco_altitude_m = 65000.0        # [E]

[stage.rcs]
type = "cold_gas"                        # gas thrusters fed with autogenous ullage gas from the main tanks [E]
isp_s = 70.0                             # [E] warm gas (cold N2 ~70 s; gaseous CH4 / O2 of the same order)
propellant = "main"                      # drawn from the stage's oxidizer and fuel tanks
minimum_on_time_s = 0.02                 # [E] valve; on/off only, fixed thrust (constant pressure)

[[stage.rcs.pod]]
id = "forward"
station_m = 68.0                         # [E] below the hot-stage ring (imagery)
radius_m = 4.5
azimuths_deg = [45.0, 135.0, 225.0, 315.0]  # [E]
thrust_n = 3000.0                        # [E] (the pre-d1 estimate)
directions = ["tangential_plus", "tangential_minus", "inward"]

# ---------------------------------------------------------------- ship
[[stage]]
id = "ship"
name = "Starship Block 3"
display_name = "Raumschiff Mk3"  # [D] display name of the part flying alone, no trademark
length_m = 52.1                          # [D] stack 124.4 m [S:wiki_starship] - booster 72.3 m
diameter_m = 9.0
dry_mass_kg = 177000.0                   # [D] +-20 t: flights 12-14 webcast telemetry, rocket equation ignition -> cutoff
                                         # with gravity and steering losses; the gauge shows the main tanks only, so
                                         # the 35 t of header propellant and the payload are taken out (planner plan
                                         # Task 3b; 255 t before held the headers):
#   python tools/telemetry/ship_dv.py tests/validation/telemetry/flight12_2026-05-22.csv --ignition-s 145 --p1 2.38
#       --payload-t 37.5 --rvac-out-s 183   -> 165.8 t
#   (flight13_2026-07-24.csv --ignition-s 143 --p1 2.89 --payload-t 38.5 -> 182.4 t; flight14_2026-09-28.csv
#    --ignition-s 146 --p1 2.5 --payload-t 50 --rvac-out-s 438 -> 181.7 t); flight 12's one-engine landing phase
#   bounds the splashdown mass at <= 209-218 t at 280 tf (177 t + residue fits, 255 t needed 117 % of the rating)
dry_cg_station_m = 22.03                 # [D] +-1.3 m: bottom-up budget at 177 t (127 t of named items at 20.94 m, the
                                         # rest like the shell):  python tools/structures/ship_mass_budget.py --dry-t 177
                                         # (rest like the named items 20.94, uniform over the tanks 20.07, along the
                                         # hull 22.37 m); with full headers 24.99 m, inside the entry trim window
payload_mass_kg = 0.0

[[stage.tank]]
id = "lox_main"
contents = "oxidizer"
mass_kg = 1224808.7                      # [D] 1,600 t total [S:wiki_starship] at O/F 3.6, less the LOX header
base_station_m = 3.5                     # [E]

[[stage.tank]]
id = "ch4_main"
contents = "fuel"
mass_kg = 340191.3                       # [D] less the CH4 header
base_station_m = 20.0                    # [E]

# Header tanks [E] (header-tank plan, user 2026-10-18): the landing propellant (35 t, part of the 1,600 t) feeds the
# flip and the landing burn - in an entry the main-tank residue lies away from the outlets. Placement from SN-era
# reports (2020-2022): LOX header in the nose tip, CH4 header a bubble on the CH4 main tank's lower dome; Block 3
# placement is not published. Short cylinders of the given diameter.
[[stage.tank]]
id = "lox_header"
contents = "oxidizer"
role = "header"
propellant_management_device = true      # [E] user 2026-10-21: always covers its outlet (SpaceX details not public)
mass_kg = 27391.3                        # [D] 35 t at O/F 3.6
base_station_m = 44.0                    # [E] nose (from before the drawn flap hinge, now 42.3-47.8 m)
diameter_m = 3.6                         # [E] ~23 m^3

[[stage.tank]]
id = "ch4_header"
contents = "fuel"
role = "header"
propellant_management_device = true      # [E] user 2026-10-21: always covers its outlet (SpaceX details not public)
mass_kg = 7608.7                         # [D]
base_station_m = 20.0                    # [E] on the CH4 main tank's lower dome
diameter_m = 3.0                         # [E] ~17 m^3

# Propellant the engines cannot draw (lines, sumps, below the outlets) [E]: the landing burn's floor in the headers (the
# ship's small landing propellant, b3 catch campaigns) and the main tanks' residue after a transfer (tanker reserve).
[stage.tanks]
unusable_propellant_kg = { main = 1000.0, header = 1000.0 }

# Sea-level Raptors as three single-engine groups. Layout [D] from the flight 13 splashdown video (ship upside down,
# user 2026-10-13): two sea-level engines on the leeward side, one towards the belly; vacuum engines one leeward, two
# towards the belly. The landing burn steps down 3 -> 2: the belly engine shuts down, the leeward pair (sea_level_1/2)
# lands - its thrust centroid lies in the symmetry plane (pitch offset only, symmetric to the side pins).
[[stage.engine_group]]
id = "sea_level_1"
engine = "raptor3"
count = 1
ring_radius_m = 0.95                     # [E, STL 1:100] 0.95 m sea-level ring (real 0.89 +-0.04); 3 lips: chord 1.65 m, gap +0.33 m
angles_deg = [30.0]                      # [D] leeward pair (belly at 270 deg); ring radius [E]
gimbal = true
relight = true

[[stage.engine_group]]
id = "sea_level_2"
engine = "raptor3"
count = 1
ring_radius_m = 0.95                     # [E, STL 1:100] 0.95 m sea-level ring (real 0.89 +-0.04); 3 lips: chord 1.65 m, gap +0.33 m
angles_deg = [150.0]                     # [D] leeward pair
gimbal = true
relight = true

[[stage.engine_group]]
id = "sea_level_3"
engine = "raptor3"
count = 1
ring_radius_m = 0.95                     # [E, STL 1:100] 0.95 m sea-level ring (real 0.89 +-0.04); 3 lips: chord 1.65 m, gap +0.33 m
angles_deg = [270.0]                     # [D] towards the belly
gimbal = true
relight = true

[[stage.engine_group]]
id = "vacuum"
engine = "raptor_vacuum3"
count = 3
ring_radius_m = 3.0                      # [E]
angles_deg = [90.0, 210.0, 330.0]        # [D] one leeward, two towards the belly (flight 13 splashdown video)
gimbal = false
relight = true

[stage.aero]
reference_diameter_m = 9.0
crossflow_table = "aero/ship_crossflow.csv"  # belly-first entry [D]
hull_cp_table = "aero/ship_hull_cp.csv"  # [E] normal force's station over alpha, drawn mesh
ascent_drag_table = "aero/ship_ascent.csv"  # [E] axial drag of the ship alone; the stack has its own table (booster stage)
flap_table = "aero/flap.csv"
entry_alpha_table = "aero/ship_entry_alpha.csv"  # nominal entry angle of attack over Mach [D]
belly_azimuth_deg = 270.0                # heat shield towards body -z
nose_length_m = 13.4                     # [E] the drawn tangent ogive (1:100 model, detail file nose_drawn_length_m)
flaps = 4

# Flaps [E]: size and place from the drawn model (`[flap.*]` in detail/starship_block3.toml, the 1:100 STL; user
# 2026-11-01); hinges on the hull sides (belly at body -z). 0 deg = folded leeward (edge-on to a belly-first flow),
# 90 deg = in the meridian plane (broadside). Rest pose 90 deg (user 2026-11-01, flight 14 frame at T+49 s: all flaps
# fully out, smooth in the flight axis): on the pad, in ascent, coast and orbit. Rates [E]: electric actuators, ~20 deg/s.
[[stage.flap]]
id = "aft_right"
hinge_azimuth_deg = 0.0
station_fwd_m = 14.0
station_aft_m = 2.0
span_m = 3.69                            # [E] detail outline, tools/aero_derive secured areas (+-0.04)
area_m2 = 36.48                          # [E] detail outline (+-0.73)
centroid_u_m = 5.0592                    # [E] centroid of the detail outline, pinned by tools/structures/tests
centroid_v_m = 1.6821
max_deflection_deg = 90.0
initial_deflection_deg = 90.0            # rest pose
rate_deg_s = 20.0

[[stage.flap]]
id = "aft_left"
hinge_azimuth_deg = 180.0
station_fwd_m = 14.0
station_aft_m = 2.0
span_m = 3.69                            # [E] detail outline, tools/aero_derive secured areas (+-0.04)
area_m2 = 36.48                          # [E] detail outline (+-0.73)
centroid_u_m = 5.0592                    # [E] centroid of the detail outline, pinned by tools/structures/tests
centroid_v_m = 1.6821
max_deflection_deg = 90.0
initial_deflection_deg = 90.0            # rest pose
rate_deg_s = 20.0

[[stage.flap]]
id = "forward_right"
hinge_azimuth_deg = 20.0                 # moved leeward (Block 2 on)
station_fwd_m = 47.75                    # [E] STL flat face: 42.282 + 5.784 cos(19.03 deg)
station_aft_m = 42.282
hinge_lean_deg = 19.03                   # [E] STL, towards the axis going forward
hinge_radius_aft_m = 4.621               # [E] STL
span_m = 3.154                           # [E] detail outline (+-0.03)
area_m2 = 12.374                         # [E] detail outline (+-0.25)
centroid_u_m = 1.6091                    # [E] centroid of the detail outline, pinned by tools/structures/tests
centroid_v_m = 1.2499
centroid_hull_radius_m = 3.852           # [E] drawn hull (13.4 m ogive, hull_profile.py) at the centroid's station 44.21
centroid_hull_taper = -0.2816             # [E] same profile: (3.348 - 3.852) / (46 - 44.21)
max_deflection_deg = 90.0
initial_deflection_deg = 90.0            # rest pose
rate_deg_s = 20.0

[[stage.flap]]
id = "forward_left"
hinge_azimuth_deg = 160.0
station_fwd_m = 47.75                    # [E] STL flat face: 42.282 + 5.784 cos(19.03 deg)
station_aft_m = 42.282
hinge_lean_deg = 19.03                   # [E] STL, towards the axis going forward
hinge_radius_aft_m = 4.621               # [E] STL
span_m = 3.154                           # [E] detail outline (+-0.03)
area_m2 = 12.374                         # [E] detail outline (+-0.25)
centroid_u_m = 1.6091                    # [E] centroid of the detail outline, pinned by tools/structures/tests
centroid_v_m = 1.2499
centroid_hull_radius_m = 3.852           # [E] drawn hull (13.4 m ogive, hull_profile.py) at the centroid's station 44.21
centroid_hull_taper = -0.2816             # [E] same profile: (3.348 - 3.852) / (46 - 44.21)
max_deflection_deg = 90.0
initial_deflection_deg = 90.0            # rest pose
rate_deg_s = 20.0

[stage.catch_pins]
azimuths_deg = [0.0, 180.0]              # [E] the sides, below the forward flaps: with the nose towards the tower before
                                         # the flip they lie across the arms after it (no roll needed; user 2026-10-13)
station_m = 36.5                         # [E] below the forward flaps (42.3-47.8 m, aft foot at d = 90 41.7 m)
protrusion_m = 1.0                       # [E] beyond the hull (as the booster's)
max_load_n = 5.0e6                       # [E] per pin (~1.9 g of a 265 t ship on two pins)

[stage.recovery]
method = "tower_catch"
reserve_propellant_kg = 30000.0          # [E]
# landing_propellant_kg: the header tanks' contents (35 t [E]; the webcast gauge shows the main tanks only): flip
# (~8 t) and landing burn; a tower catch ends slower than the splashdowns of flights 13/14. b3 catch campaign: 30 t
# ran dry in a third of the dispersed cases, 35 t holds
deorbit_engine_groups = ["sea_level_3"]  # user 2026-10-13: the belly Raptor alone (in the symmetry plane), thrust
                                         # gimballed through the CG
# Flip and landing burn at the tower (gnc::ship_landing_parameters; b3 ship-return design). The landing burn steps down
# 3 -> 2 (user 2026-10-13, flight 13/14 videos: the belly engine shuts down, the leeward pair lands; the planner's third
# phase flies the same pair). Tilt-rate limits, the 3 -> 2 sink window and the gate lead are derived from these sets.
flip_engine_groups = ["sea_level_1", "sea_level_2", "sea_level_3"]
landing_engine_phases = [["sea_level_1", "sea_level_2", "sea_level_3"], ["sea_level_1", "sea_level_2"],
                         ["sea_level_1", "sea_level_2"]]
landing_phase_max_tilt_deg = [20.0, 20.0, 15.0]  # [E] gimbal authority: the more engines, the more; the divert phase
                                         # took 15 deg until f3 and saturated after the flip (lunar return seed 1)
flip_throttle = 0.8                      # [E]
flip_tolerance_deg = 15.0                # [E] axis from the vertical: the burn plans start ...
flip_settled_rate_rad_s = 0.2            # [E] ... once the flip's pitch/yaw rate is this low
flaps_until_deg = 30.0                   # [E] the flip starts aerodynamically (aft flaps folded, forward out): flaps
                                         # until the axis is this near the vertical, then the attitude controller
descent_propellant_margin = 1.3          # [E] an abort turns to the upright descent below this times a vertical stop's need
landing_lateral_effort = 0.03            # [D] identified on the lunar-return seed-18 replay (ship catch robustness
                                         # 2026-10-21): 0.1 / 0.07 miss, 0.05-0.02 catch; the middle of that band

[stage.heat_shield]
nose_radius_m = 6.0                      # [E] effective radius of the belly-first windward side
max_heat_rate_w_m2 = 1.2e6               # [E] ceramic tiles; LEO entries peak ~0.5-0.7 MW/m^2
max_heat_load_j_m2 = 6.0e8               # [E]
max_load_g = 6.0                         # [E] structure
heat_shield_mass_kg = 10500.0            # [E] Block 1 figure

# Entry guidance (gnc::entry_guidance_parameters, planner plan Task 4): limits and caps. The hypersonic bank rate and
# the terminal nose turn's angular acceleration fly what the RCS alone gives at the entry mass (dry + full headers,
# the weaker transverse axis), up to these caps; the other values are used as they stand.
[stage.entry]
max_dynamic_pressure_pa = 25000.0        # [E] structural (b2 estimate, no source)
lunar_max_dynamic_pressure_pa = 32000.0  # [E] user 2026-10-17: 25 kPa cut the dispersed lunar returns' bank back
                                         # (campaign 3/11 -> 7/11 at 32 kPa); 0.9 x 6 g still bounds the load
terminal_mach = 5.0                      # [E] hand-over to the terminal steering ...
terminal_mach_latest = 3.0               # [E] ... at the latest, when a bank reversal still ran
terminal_min_alpha_deg = 50.0            # [D identified on the b1 terminal-phase campaign, 2026-10-13: 12 dispersed
                                         # entries, 12/12 at the gate, 11 within 0.11 m; 55 deg before] most lift of the
                                         # terminal steering (the flown floor is the table's lowest trimmed alpha at the
                                         # flying mass, EntryAeroTable)
terminal_alpha_authority_deg = 20.0      # [D identified on the same campaign] steering range about the alpha schedule
bank_rate_max_deg_s = 1.0                # [E] hypersonic (b1: faster departed in alpha with weak flaps)
fast_bank_rate_deg_s = 3.0               # [E] below Mach 5: the flaps' authority in dense air (needs the air: not
                                         # derived from the config); late reversals must be quick
alpha_slew_rate_deg_s = 3.0              # [E] the terminal phase's attitude slew (as the fast bank rate)
nose_slew_acceleration_max_deg_s2 = 0.5  # [E] vehicle physics Task 6b: the step to the turn's rate asked 20-40 x the RCS

# Boil-off heat balance (refuelling r2). Bare stainless hull - the hull is the tank wall (integral tanks, no vacuum
# jacket): alpha / eps [E] from handbook values for polished stainless steel (~0.4 / 0.1-0.15); effective wall
# resistance [E] of a wetted 4 mm steel wall with its liquid-side film. Tiles on the windward half [E]: black coating
# alpha = eps ~0.85, ~4 cm silica tile + felt (evacuated in orbit) ~1.5 m^2K/W.
[stage.thermal]
absorptivity = 0.40                      # [E]
emissivity = 0.15                        # [E]
wall_resistance_m2k_w = 0.01             # [E]
ullage_resistance_m2k_w = 100.0          # [E] dry wall: ullage gas conduction (k ~0.01 W/mK over ~1 m), no
                                         # convection near free fall - only the wetted wall feeds the liquid

[stage.thermal.shield]
absorptivity = 0.85                      # [E]
emissivity = 0.85                        # [E]
wall_resistance_m2k_w = 1.5              # [E]
half_width_deg = 90.0                    # [E] the belly half, around [stage.aero] belly_azimuth_deg

[stage.rcs]
type = "cold_gas_ullage"                 # autogenous ullage gas from the main tanks [E]
isp_s = 70.0                             # [E]
propellant = "main"
minimum_on_time_s = 0.02                 # [E] valve; on/off only, fixed thrust (constant pressure)

[[stage.rcs.pod]]
id = "forward"
station_m = 46.0                         # [E] beside the forward flap hinge (20 deg off, Task 3 report); sides (belly at 270 deg)
radius_m = 4.5
azimuths_deg = [0.0, 180.0]
thrust_n = 1500.0                        # [E] (the pre-d1 estimate)
directions = ["tangential_plus", "tangential_plus", "tangential_minus", "tangential_minus", "inward", "inward"]
# [E] two of each: the pre-d1 per-axis estimate (roll 20, pitch / yaw 117 kNm) available on all axes at once - with one
# of each, roll and pitch shared their thrusters and the entry's nose turn ran out of torque (d1 campaigns)

[[stage.rcs.pod]]
id = "aft"
station_m = 6.0                          # [E] above the aft flaps
radius_m = 4.5
azimuths_deg = [0.0, 180.0]
thrust_n = 1500.0                        # [E]
directions = ["tangential_plus", "tangential_plus", "tangential_minus", "tangential_minus", "inward", "inward", "forward"]  # forward: ullage settling, translation
