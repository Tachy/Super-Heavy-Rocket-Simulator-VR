# Refuelling r6: measured numbers of the r5 reference flights (pad starts, 2026-10-20 epochs) - the campaign
# calculator's inputs. [D] all: read from the flights' leg marks (core/tests/refuelling_measurements.hpp) and checked by
# the slow r5 campaigns (1 % or 0.3 t). Re-measure after any change to the vehicles, ascents, phasing or transfer.
# f2 2026-10-21: re-measured after the rendezvous cold-gas limit (burns over 300 s of cold gas fly on the Raptor)
# and the raise from the J2-mean apsides (the 150 x 190 km raise now reaches its mean orbit: 2.5 t more).

# f4: FNV-1a 64 of the configs the flights read (core/tests/test_refuelling_campaign.cpp lists them, LF line ends);
# a config change without a re-measure fails the fast check "The measured numbers belong to the current configs".
inputs_digest = "a19eb2bbbaf8285c"  # ascent staging Task 1: staging sequence, tanker re-measured (depot / HLS unchanged)

[depot]
mission = "depot_launch"
initial_propellant_t = 55.5        # [D] main tanks after the ascent (199.6 x 211.7 km)
# [D] f2 2026-10-22: the flown depot's mean-orbit decay against the calculator's rho(US76 at a - R) Cd 2.2 x end-on
# area x sqrt(mu a) / m: a free depot (571.5 t, 198 km, 6 days) 0.3294 vs 0.3062 km/day; the 14 flown transfers'
# heights fit 1.08 (the flown aero, the J2-swinging radius in an exponential atmosphere, the co-rotating air)
drag_decay_factor = 1.076

[tanker]
mission = "tanker_flight"
dry_mass_t = 209.0                 # [D] the configured tanker (starship_tanker) the numbers belong to
residue_after_ascent_t = 97.3      # [D] staging 2026-10-23 (f2 2026-10-21: 97.2): main tanks at the Rendezvous mark
                                   # (after the raise to the window's orbit)
rendezvous_t = 15.64               # [D] staging 2026-10-23 (f2: 17.0; it varies 13-21 t): Rendezvous -> Docked: burns,
                                   # RCS gas (+ settling pushes), boil-off
delivered_oxidizer_t = 54.1        # [D] staging 2026-10-23 (f2: 53.1): into the depot
delivered_fuel_t = 13.6            # [D] staging 2026-10-23 (f2: 13.2)
chilldown_t = 0.42                 # [D] vented
settling_gas_t = 0.94              # [D] staging 2026-10-23 (f2: 0.92): the transfer's settling push (r4)
main_at_undock_t = 12.6            # [D] the reserve kept for the return
main_at_catch_t = 1.19             # [D] staging 2026-10-23 (f2: 1.88): what the reserve left over
dry_mass_sensitivity = 0.99        # [D] r5 probes: ship dry -10 / -20 t -> residue +9.9 / +19.8 t
# [D] f2 2026-10-21: the tanker with 99.7 t main in a 24 h free coast (the phasing flight between its burns), the flown
# heat balance: 3.38 t/day at 150 x 190 km, 3.65 t/day at 220 x 260 km. The orbit average at a fixed LVLH attitude
# gives 15.9 t/day (the walls stay wet; the flown free drift settles the liquid) - the flown campaign's tanker 2 (9 h
# phasing) delivered 18 t less than the calculator booked with it.
phasing_boil_off_t_per_day = 3.5
# [D] f2 2026-10-22: the full flown campaign (refuelling_report --fly, 14 tankers) delivered more than the calculator's
# model of each flown window (reference delivery + phasing boil-off difference + phasing cost difference): below the
# depot 5 flights +0.6..+3.2 t, above 9 flights +1.0..+3.7 t (sd ~1 t per flight, the rendezvous varies 13-21 t).
# The means calibrate the calculator per phasing orbit class (user decision 2026-10-21, fill tolerance stays 2 %).
# [D] staging 2026-10-23: re-calibrated after the tanker re-measure (reference delivery +1.4 t): the flown campaign
# against the calculator's model of the flown window, flights whose class both agree on: above 7 flights -3.0..+2.6 t
# (mean -0.66 t on 2.25), below 3 flights -2.7..-1.7 t (mean -2.23 t on 1.7).
campaign_offset_below_t = -0.5
campaign_offset_above_t = 1.6
# [D] f2 2026-10-22: the depot's velocity gain from a tanker transfer's settling push (prograde: the pair flies nose
# along +V-bar): the 14 flown transfers' impulse / docked pair mass, 0.527-0.566 m/s (the push is 1e-4 g x its time).
# The calculator raises the depot's mean orbit by it (2 a dv / v ~ 0.9 km).
transfer_push_dv_mps = 0.55

[hls]
mission = "hls_refuel"
main_at_docking_t = 193.6          # [D] f2 2026-10-21: HLS main tanks at the Docked mark
phasing_boil_off_t_per_day = 0.47  # [D] f2 2026-10-21: 200 t main, 24 h free coast: 0.70 (150 km) / 0.23 (220 km)
