# Launch and landing sites. Geodetic coordinates on WGS84, height above the ellipsoid.
# Without Earth terrain the ground near a site is flat at this height (physics and rendering); with it (M8) the site
# is a plateau at this height (plateau_radius_m, then a linear apron of plateau_apron_m into the terrain).
# height_m is [D]: the median ellipsoidal height of the 1 m local terrain grid (USGS 3DEP + GLO-30 gaps, NAVD88 ->
# GEOID18 -> NAD83(2011) -> ITRF2014, see tools/data_pipeline/earth_terrain.py) within plateau_radius_m, written by
# `python tools/data_pipeline/site_heights.py --write`. The geoid (EGM2008) lies ~22-30 m below the ellipsoid on the
# US Gulf/Atlantic coasts, so pads a few metres above sea level have negative ellipsoidal heights. The orthometric
# heights (height - undulation) are +1.4 m (OLP-1), +13.8 m (LC-39A mound), +6.4 m (SLC-40), +3.7 m (LZ-40).

[[site]]
id = "starbase_olp1"
name = "Starbase OLP-1"
latitude_deg = 25.99686     # [E] from public satellite imagery
longitude_deg = -97.15394
height_m = -21.11  # [D] median of 3DEP 1 m + GLO-30 within 150 m, 2026-10-23
plateau_radius_m = 150.0      # [E] from imagery: mount + tower + hardstand, flat at height_m (Earth terrain, M8)
plateau_apron_m = 50.0        # [E] linear blend into the terrain beyond the plateau

[site.tower]                  # catch tower ("chopsticks"); all values [E] from public imagery and reporting
azimuth_deg = 315.0           # [E] pad centre -> tower centre, clockwise from north (verify against imagery)
distance_m = 30.0             # [E]
width_m = 12.0                # [E] square lattice tower
height_m = 146.0              # [E]
mount_height_m = 20.0         # [E] top of the orbital launch mount: a stack stands here
mount_outer_radius_m = 13.0   # [E]
mount_inner_radius_m = 5.5    # [E] open centre for the engine exhaust
arm_length_m = 36.0           # [E] hinge -> tip
arm_width_m = 2.0             # [E] top surface the pins land on
arm_thickness_m = 2.5         # [E]
arm_open_deg = 40.0           # [E] each arm swung outward
arm_standby_deg = 6.5         # [E] waiting before the catch: ~3 m clear per side at the catch axis (24 m from the hinges)
arm_closed_gap_m = 9.6        # [E] hull 9 m + 0.3 m each side; pins (4.5-5.5 m) overlap the arm tops by 0.7 m
arm_rate_deg_s = 10.0         # [E]
arm_force_limit_n = 2.0e6     # [E] closing stalls when the hull pushes back harder
catch_height_m = 95.0         # [E] arm tops above the pad ground; caught booster bottom clears the mount
carriage_mass_kg = 1.5e5      # [E] carriage + arms
carriage_stiffness_n_m = 2.0e6    # [E] shock absorbers: ~1.4 m static travel under a 275 t booster
carriage_damping_n_s_m = 1.2e6    # [E]
carriage_stroke_m = 4.0       # [E] travel to the hard stop

[site.sea]                    # coastline for aborted landings: ground beyond this line is water (flat until M8)
direction_deg = 90.0          # [E] towards the sea (Gulf of Mexico), clockwise from north (verify against imagery)
shoreline_distance_m = 500.0  # [E] pad centre -> shoreline along that direction (verify against imagery)

[[site]]
id = "ksc_lc39a"
name = "KSC LC-39A"
latitude_deg = 28.60822     # [E] from public satellite imagery
longitude_deg = -80.60410
height_m = -15.85  # [D] median of 3DEP 1 m + GLO-30 within 60 m, 2026-10-23
plateau_radius_m = 60.0       # [D] was 150 m [E]: the 3DEP relief inside 150 m spans 13.6 m (flame trench, ramps); the median
                              # is stable within 0.2 m for 30-80 m, so the plateau keeps the mound top only
plateau_apron_m = 50.0        # [E]

[site.tower]                  # catch tower ("chopsticks"); all values [E] from public imagery and reporting
azimuth_deg = 0.0             # [E] pad centre -> tower centre, clockwise from north (tower north of the mount, verify against imagery)
distance_m = 30.0             # [E]
width_m = 12.0                # [E] square lattice tower
height_m = 146.0              # [E]
mount_height_m = 20.0         # [E] top of the orbital launch mount: a stack stands here
mount_outer_radius_m = 13.0   # [E]
mount_inner_radius_m = 5.5    # [E] open centre for the engine exhaust
arm_length_m = 36.0           # [E] hinge -> tip
arm_width_m = 2.0             # [E] top surface the pins land on
arm_thickness_m = 2.5         # [E]
arm_open_deg = 40.0           # [E] each arm swung outward
arm_standby_deg = 6.5         # [E] waiting before the catch: ~3 m clear per side at the catch axis (24 m from the hinges)
arm_closed_gap_m = 9.6        # [E] hull 9 m + 0.3 m each side; pins (4.5-5.5 m) overlap the arm tops by 0.7 m
arm_rate_deg_s = 10.0         # [E]
arm_force_limit_n = 2.0e6     # [E] closing stalls when the hull pushes back harder
catch_height_m = 95.0         # [E] arm tops above the pad ground; caught booster bottom clears the mount
carriage_mass_kg = 1.5e5      # [E] carriage + arms
carriage_stiffness_n_m = 2.0e6    # [E] shock absorbers: ~1.4 m static travel under a 275 t booster
carriage_damping_n_s_m = 1.2e6    # [E]
carriage_stroke_m = 4.0       # [E] travel to the hard stop

[site.sea]                    # coastline for aborted landings: ground beyond this line is water (flat until M8)
direction_deg = 90.0          # [E] towards the Atlantic, clockwise from north (verify against imagery)
shoreline_distance_m = 1300.0 # [E] pad centre -> shoreline along that direction (verify against imagery)

[[site]]
id = "ccsfs_slc40"
name = "CCSFS SLC-40"
latitude_deg = 28.56194     # [S] Wikipedia "Cape Canaveral Space Launch Complex 40": 28°33'43"N 80°34'38"W
longitude_deg = -80.57722
height_m = -23.29  # [D] median of 3DEP 1 m + GLO-30 within 30 m, 2026-10-23
plateau_radius_m = 30.0     # [D] was 100 m [E]: the 3DEP relief inside 100 m spans 7.5 m (slopes); 30 m spans 3.3 m
plateau_apron_m = 50.0      # [E]
landing_zone = "ccsfs_lz40" # [S] Wikipedia "Cape Canaveral Space Launch Complex 40" / CRS-35: first stages return to
                            # LZ-40 inside the complex (the onboard computer's RTLS choice)

[site.sea]
direction_deg = 90.0        # [E] towards the Atlantic (verify against imagery)
shoreline_distance_m = 1000.0  # [E] pad -> shoreline (verify against imagery)

[[site]]
id = "ccsfs_lz40"
name = "Landezone LZ-40"
kind = "landing_zone"       # Falcon first stages land here (first landing Crew-12, 2026-02-13)
latitude_deg = 28.56194     # [E] east of the SLC-40 pad inside the complex (FAA EA 2025: "a single LZ east of SLC-40");
longitude_deg = -80.57370   # [E] ~340 m east of the pad (verify against imagery)
height_m = -26.03  # [D] median of 3DEP 1 m + GLO-30 within 61 m, 2026-10-23
pad_radius_m = 42.7         # [S] FAA EA 2025: 280 ft concrete pad (400 ft with the gravel apron)
plateau_radius_m = 61.0     # [S] FAA EA 2025: half the 400 ft gravel apron
plateau_apron_m = 30.0      # [E]

[site.sea]
direction_deg = 90.0        # [E]
shoreline_distance_m = 650.0  # [E] (verify against imagery)
