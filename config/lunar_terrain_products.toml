# Lunar terrain and albedo products for the landing-site tiles (lunar sites plan, task 1).
# Every layout value below was read from the PDS label of the file (checked by
# `python tools/data_pipeline/probe_lunar_products.py --verify-config`); findings and measured throughput are in
# docs/subsystems/lunar.md (data products). Documented in config/README.md. Sources: tools/data_pipeline/sources.toml.
#
# value = raw * scale + offset. Heights: metres above the 1737.4 km LOLA sphere (offset 0; SLDEM2015 raw values are
# kilometres, hence scale 1000). Albedo: photometrically normalised reflectance (float32, dimensionless).
# Cylindrical files: first_latitude_deg / first_longitude_deg are the outer EDGE of pixel (0, 0), latitude falling and
# longitude rising with the index; pixel (l, s) is centred at first + (k + 0.5) / pixels_per_degree.
# Polar files: pole_line / pole_sample are 0-based pixel-centre coordinates of the pole, scale_m the pixel size.
# header_bytes = bytes before the first pixel (the PDS3 header attached to the LROC files, one record).
# A product may carry its own tile_half_size_m, overriding [selection] (ledger ruling R1).

[selection]
# First product whose coverage holds the whole tile wins. LDEM_64 (473 m) is deliberately absent: no landing on a
# coarse fallback. The 100 m LDEM_45* products bridge the +-60 deg seam where SLDEM2015 ends and the 60 m polar
# products begin (a tile straddling 60 deg is in neither of them).
height_order = ["ldem_80s_20m", "ldem_80n_20m", "sldem2015_512", "ldem_60s_60m", "ldem_60n_60m", "ldem_45s_100m", "ldem_45n_100m"]
# The WAC mosaic has the same photometric normalisation on both sides of 60 deg, so a tile across the seam can be
# assembled per pixel from the equatorial and the polar file (task 3); the order is for tiles inside one product.
albedo_order = ["wac_emp_643nm_equatorial", "wac_emp_643nm_south", "wac_emp_643nm_north"]
tile_half_size_m = 75000.0
albedo_tile_half_size_m = 75000.0

# LOLA polar 20 m, 80-90 S (the Mons Mouton tile source; 1.8 GB, never downloaded whole).
[[product]]
id = "ldem_80s_20m"
kind = "height"
projection = "polar_stereographic_south"
latitude_min_deg = -90.0
latitude_max_deg = -80.0
resolution_m = 20.0
sample_type = "int16"
scale = 0.5
offset = 0.0
source = "lola_ldem_80s_20m"
tile_half_size_m = 10000.0

[[product.file]]
url = "https://pds-geosciences.wustl.edu/lro/lro-l-lola-3-rdr-v1/lrolol_1xxx/data/lola_gdr/polar/img/ldem_80s_20m.img"
lines = 30400
samples = 30400
record_bytes = 60800
header_bytes = 0
pole_line = 15199.5
pole_sample = 15199.5
scale_m = 20.0

# LOLA polar 20 m, 80-90 N.
[[product]]
