# Propellant combinations. Densities at loading conditions.

[[propellant]]
id = "methalox"
oxidizer = "LOX"
fuel = "CH4"
mixture_ratio = 3.6               # O/F by mass [S: Wikipedia "SpaceX Raptor"; design text also mentions ~3.8]
oxidizer_density_kg_m3 = 1200.0   # subcooled LOX (~70 K); 1141 at normal boiling point [E]
fuel_density_kg_m3 = 440.0        # subcooled liquid methane (~95 K); 422 at normal boiling point [E]
# Boil-off (refuelling r2): normal boiling point and latent heat of vaporisation [S: NIST Chemistry WebBook -
# O2 90.19 K, 6.82 kJ/mol / 32.00 g/mol; CH4 111.67 K, 8.19 kJ/mol / 16.04 g/mol]. Loaded subcooled; the sensible
# heat up to the boiling point is not credited (no tank temperature model).
oxidizer_boiling_point_k = 90.19
oxidizer_latent_heat_j_kg = 213100.0
fuel_boiling_point_k = 111.67
fuel_latent_heat_j_kg = 510800.0
# Surface tension at the boiling point (the Bond number of the liquid in a tank) [E: from the Jasper 1972 (J. Phys.
# Chem. Ref. Data 1) linear fits: O2 ~13.2 mN/m at 90 K, CH4 ~13.7 mN/m at 112 K; only the order matters here].
oxidizer_surface_tension_n_m = 0.0132
fuel_surface_tension_n_m = 0.0137

[[propellant]]
id = "kerolox"
oxidizer = "LOX"
fuel = "RP-1"
mixture_ratio = 2.36              # Merlin 1D [E: commonly cited]
oxidizer_density_kg_m3 = 1200.0   # densified LOX on Falcon 9 (~66 K) [E]
fuel_density_kg_m3 = 830.0        # chilled RP-1 [E]
oxidizer_boiling_point_k = 90.19  # [S: NIST] as methalox (RP-1 does not boil off)
oxidizer_latent_heat_j_kg = 213100.0
oxidizer_surface_tension_n_m = 0.0132

[[propellant]]
id = "mmh_nto"
oxidizer = "N2O4"
fuel = "MMH"
mixture_ratio = 1.65              # [E] typical for Draco-class thrusters
oxidizer_density_kg_m3 = 1440.0   # [S: NTO at 20 C]
fuel_density_kg_m3 = 880.0        # [S: MMH at 20 C]
