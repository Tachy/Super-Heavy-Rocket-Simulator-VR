hip_m = [1.474, -0.307, -0.35]   # [D] mirror of s2
back_angle_deg = 35.0          # [E] see s1
width_m = 0.58                 # [E] see s1
foot_rest_m = [1.3223, 0.4471, -0.350]   # [D] sole plate centre under the boots: seat hip + (-0.152, 0.754) from the figure bones (fix 8/8b round 1: thigh raise -21, interior knee 102 deg, knee swung out 20 deg about the hip-ankle line; was (-0.185, 0.753) for -25 / 105) + the same sole / plate offset from the ankle in the shin-foot frame (0.082 along the shin, 0.109 along the foot); moves with the hip (round 4)
foot_rest_normal = [0.8988, -0.4384, 0.0]  # [D] plate normal, toward the knee = minus the sagittal shin direction (shin 64 deg below the hatch axis before the knee swings out, figure_layout.leg_joints): a tray under the soles facing up the shin, seen nearly edge-on from the hatch (crew1_1)

[[seat]]
id = "s4"                      # [D] see s1
role = "specialist"            # [S] spec 2026-11-07
hip_m = [1.444, 0.132, -1.05]   # [D] mirror of s1
back_angle_deg = 35.0          # [E] see s1
width_m = 0.58                 # [E] see s1
foot_rest_m = [1.2923, 0.8861, -1.050]   # [D] sole plate centre under the boots: seat hip + (-0.152, 0.754) from the figure bones (fix 8/8b round 1: thigh raise -21, interior knee 102 deg, knee swung out 20 deg about the hip-ankle line; was (-0.185, 0.753) for -25 / 105) + the same sole / plate offset from the ankle in the shin-foot frame (0.082 along the shin, 0.109 along the foot); moves with the hip (round 4)
foot_rest_normal = [0.8988, -0.4384, 0.0]  # [D] plate normal, toward the knee = minus the sagittal shin direction (shin 64 deg below the hatch axis before the knee swings out, figure_layout.leg_joints): a tray under the soles facing up the shin, seen nearly edge-on from the hatch (crew1_1)

[eye]
position_m = [2.2857, -0.5945, 0.35]  # [D] round 4: centre screen centre + 0.55 m along its normal + 0.23 m along its up (the discovery2 GoPro sits 0.61 / 0.23 from it between the heads); eye to centre screen centre 0.69 m, right shoulder to it 0.69 m of the 0.78 m reach (near-straight arm: crew2_1, inspiration4_1, demo1_3); +-0.08 per axis
forward = [0.37956, 0.92517, 0.0]     # [D] straight ahead in the seat plane toward the screen plane (z = 0.35): 22 deg above horizontal, 13 deg below the chest normal, 22.7 deg off the screen normal
up = [0.92517, -0.37956, 0.0]         # [D] perpendicular to forward in the X-Y plane, head-up side

[console]
# Housing: one straight filleted body across the panel, front face in the centre screen's plane; the three screens are coplanar (user decision 2026-11-07).
# Fidelity Task 4 (2026-11-21, fix round 1): multi-view fit tools/structures/cabin_fit/parts/console.py on crew1_1 (back face, both posts), discovery2 and
# discovery10 (screen glass corners, the front bottom edge; discovery10 = another frame of discovery2's fixed GoPro mount), "as built" run
# (python -m cabin_fit.parts.console --as-built: block placement, width, top edge and post top radius held). Fit residuals 1.25 / 5.9 / 4.4 px rms (of 1200 /
# 4128 / 4128) are the sharp-edged fit model on its own points; render-vs-photo residuals per feature: docs/subsystems/cockpit.md "Console (fidelity Task 4)".
# Tags follow FitResult.constrained_by_data: a value the data do not dominate, or that no photo sees, is [E] with its prior and tolerance.
centre_m = [2.5076, -0.0386, 0.0000]  # [E] block placement = the centre screen centre (round 4, +-0.06; the free fit cx 2.537 / cy -0.032 +-0.029 agrees within 1 sigma, not moved) - 0.0062 up [D] (the housing runs from u_bot -0.2772 to u_top +0.265 along up; was - 0.0052)
normal = [-0.70711, -0.70711, 0.0]   # [D] = centre screen normal (from tilt_deg)
up = [0.70711, -0.70711, 0.0]        # [D] = eye up (from tilt_deg)
tilt_deg = 45.0                     # [D] console up axis 45 deg from +X toward -Y; the generator builds the body on it (cabin_layout.console_frame, checked against the centre screen +-0.5 deg); free fit 46.3 +-1.2 deg (data-constrained), built 45 within 1.1 sigma
width_m = 1.40                      # [E] the front plate and the upper half: crew1_1's end cap at mid height of the back face lies at |lat| 0.70-0.72 (Task 7: cabin_fit/parts/recess.py, rays onto the back plane), the outer glass edges at +-0.649 need >= 1.30 at the front; free fit 1.344 +-0.046 not data-constrained; the lower back ends taper in (end_taper); +-0.04
end_taper = [0.6063, 0.590, 0.543]  # [E] the lower ends behind the front plate, an upper bound equal only where crew1_1 shows the console end: half width = min(width / 2, w0 + dw_du u + dw_ddepth depth) (u up from the centre screen centre, depth behind the screen plane). crew1_1's dark line is the console silhouette only on the right side, rows 190-220 (2-5 px outside the mirrored recess floor line; cabin_fit/parts/recess.py silhouette_samples): on the back face (depth = hood 0.221) the line fit gives a = w0 + 0.221 dw_ddepth = 0.7270 +- 0.0055, dw_du 0.590 +- 0.022 (rms 2.1 mm; built 0.7263 / 0.590, within sigma), and the silver lip band ends on the line at |lat| 0.53 on both sides (equality at the lip). The left rows at the same heights lie on the wall line and the left underside rows (v 230-260) show no console outside 0.49-0.52: upper bounds only (bound_samples; the built taper lies inside them within the read sigma). dw_ddepth (and so w0) is seen by no view (dark underside on the dark recess; no fitted camera sees a console end, the end-on stills nasatour_0310 / 0320 have none): tolerance one-sided, the ends may taper in further below the lip (half width -0.06 / +0.005)
end_ramp = 2.5                      # [E] behind the front zone the ends slope in to the end_taper plane by 2.5 m of half width per m of depth (a 68 deg chamfer: crew1_1 shows a light, smoothly shaded surface there, read as the silver tapered end, not a dark overhang of the front plate); 1.5-5
end_taper_from_m = 0.04             # [E] the taper starts this far behind the screen plane (= edge_radius_m: the front fillet zone keeps the full width under the outer screens and the tray ends; crew1_1 sees the front corners only behind the helmets / headrests); +-0.02
height_m = 0.542                    # [E] top half: u_top 0.265 kept (free fit 0.270 +-0.046, not data-constrained, +-0.05); [D] bottom half: u_bot -0.2772 +-0.0021 (front bottom edge under the modules, discovery2 + discovery10, data-constrained); was 0.540
hood_depth_m = 0.221                # [D] the body's back face 0.221 +-0.011 m behind the screen plane (as-built fit, crew1_1 back top / lip edges with the screens of discovery2 / 10; data-constrained; free fit 0.181 +-0.030); was 0.205
edge_radius_m = 0.04                # [E] fillet radius of every housing edge: crew1_1 back-face end caps round over ~20 px at 1.7 m (0.06-0.07 in plan view), nasatour_0320 right end cap ~0.03-0.05; the front edges keep a flat face 4 cm past the screens / modules; +-0.02
side_draft_deg = 0.0                # [E] the side faces stand square: the free fit reads -2 +-10 deg (not data-constrained); the sculpting is the fillet; +-10
underside_profile = [[0.0, 0.0], [0.221, 0.059]]  # [E] [depth behind the front face m, drop below the front bottom edge m]: as-built fit back_drop 0.059 +-0.036 from crew1_1's lip edge (v 226.5 px) alone, 1.6 sigma from flat; no photo sees the underside's shape (jsc2022e068643 / 646 / 660, jsc2025e064539, jsc2026e404725: see cockpit.md); +-0.04
fold_deg = 0.0                      # [S] user decision 2026-11-07: the console runs straight across all three screens, no folded wings. Photo check: discovery10 (top-down: screens and the button shelf in one straight line), crew2_1 / inspiration4_1 (side views: one flat front, the three screens share the plane), training2 / discovery10 shelf continuous under all three
strut_z_m = [0.555, -0.555]         # [D] post bases |Z| 0.555 +-0.008 (as-built fit, crew1_1 rod axes and feet, data-constrained); the base stands on the housing top post_foot_m[0] in front of the back face (built 0.199 behind the screen plane, fit 0.216 +-0.011); was 0.549
post_top_m = [-0.579, 0.747]        # [E] radius 0.945 (crew1_1 sees the top only along its ray: free fit 0.966 +-0.027, not data-constrained; set so the collar's flush cut stays inside the ring's outer radius 0.997, test_console_posts_end_on_the_ceiling_ring; +-0.03); [D] angle 52.2 +-0.7 deg off -Y (the +Z post's top on the ceiling plane, Y, Z; the other mirrored); was (-0.632, 0.751)
post_radius_m = 0.017               # [D] rod radius: crew1_1 7.5 px wide at 2.47 m (f 534 px) -> 0.0174; +-0.003 (1.5 px)
post_head_radius_m = 0.039          # [D] the cylindrical joint head (collar) where the rod enters the ceiling: crew1_1 15-16 px at 2.7 m -> 0.039; +-0.004
post_head_length_m = 0.04           # [E] collar length: seen end-on from the hatch (8 px ellipse), not measurable; +-0.02
post_foot_m = [0.022, 0.066, 0.051, 0.306]  # [E] lengths: sleeve 0.066, funnel 0.306 (crew1_1 v 145-150 / 150-172 of the post's 112-172 times the fitted 0.826 m length; foreshortened 14 mm/px, +-50 %); [D] radii: sleeve 0.022 (10-11 px at 2.2 m), funnel foot 0.051 (28-29 px at 1.9 m), +-0.004; the real funnel flares outboard only

screen_gap_m = 0.057                # [D] gap between the active areas of neighbouring screens = screen pitch 0.449 - active width 0.392 (fidelity Task 5 fit; discovery10 shows ~4.5 cm of dark housing between the glass edges); was 0.020 (bezels read as touching)
shelf_height_m = 0.088              # [D] the tray from its top at the housing face (u -0.149) to the lip's front bottom edge (u -0.237): discovery10 column u 1450 back-projected through the fitted camera (deck start v 1375 on o 0; lip bottom v 1630 on the lip front, o 0.040); +-0.006
shelf_top_gap_m = 0.0395            # [D] the tray starts this far under the screens' active lower edge (u -0.1095): discovery10 dark housing v 1292-1375 under the centre glass, back-projected; +-0.005
upper_top_x_m = 2.845               # [D] the dark upper panel above the housing reaches this station at its front top edge: 0.47 m up the console from the centre screen centre (covers the lamp panels at 0.43; discovery2 dark to the frame top); crew1_1 shows the dish over the console from the hatch, so the panel does not run to the ceiling (round 4)
upper_depth_m = 0.04                # [E] thickness of the upper panel (it only closes the view up to the ceiling; crew1_1 / discovery2: dark grey structure up to the frame top)
locker_proud_m = 0.012              # [E] the lockers 5 / 6 stand this far proud of the housing front (discovery2)

[recess]
# The trapezoid recess of the white wall panelling around the console (fidelity Task 7, crew1_1): the panels on both sides end in a light grey bevel
# that runs as a straight diagonal (in the hatch view) from the ceiling dish down past the console ends to the headrests. cabin_fit/parts/recess.py
# reads both bevel lines per side (out = the panel edge, white -> grey; in = the dark line where the bevel meets the recess floor) and back-projects
# them through the fitted crew1_1 camera onto the inner wall (floor depth_m further out); both are fitted as |az| quadratic in (x - x_ref_m), mirrored
# (c1 / c2 shared, c0 = the mean of one per side). The in edge uses only the rows where no console end stands in front of the line (fix round 1: rows
# 170-220 are the console's end, ~0.8 m nearer along the same rays). Single view: the wall surface is the assumed depth; the camera's prior-dominated x / pitch (+-3.5 cm / 0.7 deg) move both
# lines together by ~1 deg / 2 cm. The generator pushes the wall out by depth_m over the recess (a ramp from the out edge to the in edge, the bevel)
# and puts those faces in the node cabin_recess (light grey). Outside the read station ranges the edges continue at constant az [E].
x_ref_m = 3.0                       # [D] reference station of the edge lines
depth_m = 0.03                      # [E] the recess floor lies this far outside the panel surface (single view: not measurable; the bevel's width on the wall follows from the two lines); +-0.02
edge_out_deg = [107.12, -184.66, -691.56]  # [D] panel edge: |az| = c0 + c1 (x - x_ref_m) + c2 (x - x_ref_m)^2 (the straight image line is a curve on the cone), mirrored fit of 15 rows per side (v 100-240): 107.10 +- 0.38 deg, -184.2 +- 3.6 deg/m, -680 +- 72 deg/m2, left / right differ 0.62 deg, rms 0.77 deg (the built values, from the earlier per-side average, lie within these sigmas: not moved)
out_x_m = [2.896, 3.065]            # [D] station range of the out-edge reads (above / below: constant az [E])
edge_in_deg = [124.47, -86.45, -60.40]  # [D] floor edge, same form, from the clean rows only (left v 160 + 230-290, right 270-290; rows 170-220 feed [console] end_taper, not this line): 124.47 +- 0.48 deg, -86.5 +- 1.5 deg/m, -60 +- 13 deg/m2, left / right differ 0.86 deg, rms 0.11 deg
in_x_m = [2.824, 3.137]             # [D] station range of the in-edge reads
bottom_x_m = 2.35                   # [E] the recess ends behind the seat headrests (crew1_1 / KSC-20240927: the grey recess runs down to the headrests, below them hidden); +-0.15
bottom_bevel_m = 0.08               # [E] the floor ramps back to the panel surface over this height at the bottom (hidden)
top_bevel_m = 0.06                  # [E] and at the ceiling trim (the shell meets the ceiling ring there)

[tray]
# The button tray (fidelity Task 5): ONE continuous sloped tray under all three screens (discovery10: one grey band from the left to the right module;
# jsc2022e068617: the grey deck, the dark key faces, the lip at the low front edge), replacing the separate shelf modules. Profile in the centre screen's
# frame (u up, o toward the crew): the deck runs from the housing face at u_top = -(active height / 2) - shelf_top_gap_m down and out to the key face; the
# key face slopes out toward its bottom (its normal turned up by slope_deg, toward the crew's eyes, which sit 0.23 m up the console); the lip stands
# proud at the bottom edge (u_top - shelf_height_m). cabin_layout.tray_face_o / tray_profile; the key faces stand KEY_HEIGHT_M proud of it.
depth_m = 0.024                     # [E] (a single view cannot fix depth along the ray) key face 2.4 cm in front of the screen plane at the face's mid height: the key-face plane of the round-4 buttons (0.029-0.030) less their 6 mm height; discovery10 back-projection at o 0.024 puts the face top at u -0.168, bottom -0.235; +-0.006. The u heights read on this assumed plane (deck_drop_m, shelf_height_m, lip_width_m) are only weakly sensitive to it from the near-normal GoPro, so they stay [D]
slope_deg = 15.0                    # [E] the key face leans out toward its bottom (a tray): jsc2022e068617 shows the deck and the key faces at different angles to the screens; single views only (no camera for 068617), +-10
deck_drop_m = 0.019                 # [D] the deck falls from u -0.149 at the housing to the key face's top at u -0.168 (discovery10 v 1375 -> 1452 back-projected); +-0.005
lip_width_m = 0.010                 # [D] the lip's height along the face at the bottom: discovery10 v 1600 -> 1630 (u -0.235 -> -0.245); +-0.004
lip_height_m = 0.006                # [E] the lip stands this far proud of the key face (jsc2022e068617: the red-lit rim at the module bottom, a few mm proud); +-0.004
radius_m = 0.004                    # [E] fillet of the tray's edges (deck front, lip): jsc2022e068617 soft highlights, no sharp edge; +-0.003
half_length_m = 0.625               # [D] the tray runs +-0.625 m along the row: discovery10 band x 215-1350 of 1600 (just inside the outer glass edges at +-0.649), past the outermost keys (+-0.605); +-0.02

# Guards: hinged clear covers with a red rim over the 2 x 3 key blocks of both outer modules (jsc2022e068617: the right module, red-outlined clear cover
# over EMERGENCY DEORBIT / BREAKOUT / ... ; discovery10: the same block in the left and right module). A button with guard = "<id>" lies under it.
[[guard]]
