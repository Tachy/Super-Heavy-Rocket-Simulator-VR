# Buttons on the left / right panels: fold 0, they lie on the flat plane at their in-plane (row, height) position (re-placed 2026-11-07 from the folded values).
# Physical buttons, flight panel as discovery10 shows it (camera between s2 and s3). Positions: read along the screens' lower
# edges (fraction of the screen above), rows 0.17 / 0.20 m below the screen centre on the screen's up axis, 0.03 m proud along
# its normal; +-0.02 m along the row, +-0.03 m elsewhere. panel = the screen above (its normal and up apply). shape round = a
# round push button with a ring, rect = a labelled push button. Functions only with evidence; "none" = drawn, inert.
# Under the left screen (clusters A and B): camera direct keys by the user's decision (spec 2026-11-07 item 5), slots upper row
