# edges (fraction of the screen above), rows 0.17 / 0.20 m below the screen centre on the screen's up axis, 0.03 m proud along
# its normal; +-0.02 m along the row, +-0.03 m elsewhere. panel = the screen above (its normal and up apply). shape round = a
# round push button with a ring, rect = a labelled push button. Functions only with evidence; "none" = drawn, inert.
# Camera direct keys (user decision 2026-11-09, replaces the cam1-18 mapping of 2026-11-07; second decision 2026-11-09: four keys, left hand):
# the four BLANK-faced keys next to the left screen's right edge (c_upper_1, c_upper_2, c_lower_1, c_lower_2) are function = "camera" with
# camera_slot 1..4 = the first four catalog cameras in config order; the fifth camera (dragon_nose, last in the catalog) only through the
# on-screen camera button (ScreenCamera.next()). c_lower_round (centre screen, right hand) is function = "none". The 18 keys under the left screen (cam1..cam18, ids kept) carry real labels (DEORBIT NOW, SUPPRESS FIRE, ...)
# and are function = "none" (tap animates, nothing happens) until their real function is implemented. Engadget 2018 names the panel groups Commands, Pyros, Displays, Power (no per-button functions).
# label (Task 5b, optional): the text printed on the key, only where a photo shows it legibly (conv_42860a, the Crew Dragon 2020 module row:
# the same 5 + 3 / 5 + 5 / 4 + 3 key layout as discovery10); keys without `label` get a blank key face.

