up = [0.57358, -0.81915, 0.0]         # [D] = eye up
size_m = [0.382, 0.215]             # [E] see left
aspect = 1.7778                     # [E] see left
# Screen gap 0.045 m [E]: discovery10 centre-right active gap 90 px of 780 px width.

[[tablet]]
id = "l"                            # [E] procedure tablets on mounts above the outer screens, discovery1..15
centre_m = [3.075, -0.191, 0.366]   # [E] lower edge on the left screen's top bezel, 0.045 inboard of its centre (discovery10: at 0.61 of its width), 0.06 proud on the mount
