# label (Task 5b, optional): the text printed on the key, only where a photo shows it legibly (conv_42860a, the Crew Dragon 2020 module row:
# the same 5 + 3 / 5 + 5 / 4 + 3 key layout as discovery10); keys without `label` get a blank key face. The camera keys keep their
# function (user decision) although the real keys carry the abort / fire / power labels.

