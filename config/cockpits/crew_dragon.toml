[eye]
position_m = [2.447, -0.351, 0.35]  # [D] s2 hip + 0.72 m up the seat back + 0.10 m forward (seated eye height 0.79 m above the pan, hip point 0.07 above it); +-0.10 per axis
forward = [0.81915, 0.57358, 0.0]     # [E] straight ahead, 20 deg above the seat's chest normal toward the console (crew11, crew10: gaze up to the screens)
up = [0.57358, -0.81915, 0.0]         # [D] perpendicular to forward in the X-Y plane, head-up side

[console]
# Housing: one straight slab across the panel, front face in the centre screen's plane; the three screens are coplanar (user decision 2026-11-07).
centre_m = [2.6796, 0.0377, 0.0]    # [D] centre screen centre + 0.015 up (housing reaches 0.265 above and 0.235 below the screen centre: 0.1575 above the screen top, review item 3: 0.15-0.17)
normal = [-0.81915, -0.57358, 0.0]    # [D] = centre screen normal
up = [0.57358, -0.81915, 0.0]         # [D] = eye up
width_m = 1.32                      # [E] discovery2 / discovery10 at the iPad-mini scale (134.8 mm tablet = ~255 px, ~1,900-2,100 px/m): the three screens with gaps span 1.22 m, the button shelf ends 0.03-0.05 m past the outer screen edges (dark upper panel 0.05-0.08 m); the tablets stand above the outer screens, not on wings; +-0.05
height_m = 0.50                     # [D] 0.1575 housing above the screens (discovery2 / discovery10, review item 3: 0.15-0.17) + 0.215 screen + 0.1275 below the screens (0.0175 gap + the 0.10 button shelf + 0.01 lip; the photo shelf ~0.083 + 0.015 lip)
depth_m = 0.15                      # [E] crew11, crew13: thin box; back top stays below ceiling_x_m (x 3.29)
fold_deg = 0.0                      # [S] user decision 2026-11-07: the console runs straight across all three screens, no folded wings. Photo check: discovery10 (top-down: screens and the button shelf in one straight line), crew2_1 / inspiration4_1 (side views: one flat front, the three screens share the plane), training2 / discovery10 shelf continuous under all three
strut_z_m = [0.55, -0.55]           # [E] hand-hold posts of crew1_1, silver, from the dark upper panel to the ceiling ring; two struts from the housing top to the ceiling ring, crew1_1 / Wikimedia (at 1/3 and 2/3 of the box)

screen_gap_m = 0.020                # [D] gap between the active areas of neighbouring screens: 2 x 0.007 bezel + 0.006 seam of the housing (discovery2: bezels nearly touch, review item 3 says 1-2 cm; the earlier 0.045 was read from discovery10's 90 px active gap and is superseded); left / right screen centres = 0.382 + 0.020 = 0.402 m from the centre
shelf_height_m = 0.10               # [D] button shelf (modules) height: discovery2 module row ~160 px of 415 px screen height (0.215 m) = 0.083 m + 0.015 m lip (review item 3: ~0.10)
shelf_top_gap_m = 0.0175            # [E] the shelf's top edge lies this far under the screens' lower edge (housing seam)
module_split_m = 0.012              # [E] buttons whose edges lie further apart than this start a new module (discovery2: clusters A, B, C, handle, right clusters, each a light grey module with dark gaps between)
module_margin_m = 0.004             # [E] a module's face extends this far past its outermost buttons
upper_top_x_m = 2.95                # [D] the dark upper panel (soffit) above the housing reaches this station at its front top edge; 0.05 under the ceiling plane (ceiling_x_m 3.35) with the back edge at 3.33
upper_depth_m = 0.04                # [E] thickness of the upper panel (it only closes the view up to the ceiling; crew1_1 / discovery2: dark grey structure up to the frame top)
locker_proud_m = 0.012              # [E] the lockers 5 / 6 stand this far proud of the housing front (discovery2)

