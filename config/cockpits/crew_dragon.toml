hip_m = [1.474, -0.307, 0.35]    # [D] Z = half seat pitch 0.70 (Wikimedia pitch / back width 1.2, back 0.58); X, Y round 4: [eye] position_m minus the crew figure's own eye point (figure_layout.eye_point: 0.83 up the back + 0.23 along the chest normal = (0.812, -0.288) at back 35 deg), so the player's body sits under the eye; +-0.1
back_angle_deg = 35.0          # [E] see s1
width_m = 0.58                 # [E] see s1
foot_rest_m = [1.3223, 0.4471, 0.350]   # [D] sole plate centre under the boots: seat hip + (-0.152, 0.754) from the figure bones (fix 8/8b round 1: thigh raise -21, interior knee 102 deg, knee swung out 20 deg about the hip-ankle line; was (-0.185, 0.753) for -25 / 105) + the same sole / plate offset from the ankle in the shin-foot frame (0.082 along the shin, 0.109 along the foot); moves with the hip (round 4)
foot_rest_normal = [0.8988, -0.4384, 0.0]  # [D] plate normal, toward the knee = minus the sagittal shin direction (shin 64 deg below the hatch axis before the knee swings out, figure_layout.leg_joints): a tray under the soles facing up the shin, seen nearly edge-on from the hatch (crew1_1)

