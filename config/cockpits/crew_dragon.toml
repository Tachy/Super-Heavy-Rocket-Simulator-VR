# Crew Dragon cabin (M7 cockpit step 1): measured from reference photos, rebuilt by us; nothing of any photo or model is copied.
# Frame: the capsule stage body frame of docs/subsystems/vehicle-models.md "Crew Dragon": X = station above the heat shield apex
# (nose +X), (Y, Z) = r (cos az, sin az), az 0 = side hatch. Y points to the hatch, Z = az +90 = the crew's LEFT (the crew face
# the hatch side and the console, backs toward the shield and the az 180 wall). Metres, unit vectors unitless, angles degrees.
# Every value line carries [S] (published), [E] (own estimate, photo + known size named) or [D] (derived, how). Derivations,
# uncertainties and the photo list: docs/subsystems/cockpit.md and .superpowers/sdd/2026-11-07-m7-cockpit-crew-dragon/task-1-report.md.
# Photos (git-ignored, screenshots/m7-cockpit-refs/): mielke/discovery1..16 (camera between s2 and s3, flight panel), mielke/crew1_1
# (4-seat row seen from the hatch), wm_crew_dragon_interior_configuration (Wikimedia CC0, seats S1..S4 labelled), dragon_cockpit_crew10/11/11b/13
# (NASA, outer seat, windows), mielke/training2 (Engadget 2018 mock-up, button labels), D_CCP_SpaceX_Demo_2_Dragon__3_ (exterior, falcon9_ref).
# Known sizes used: seat pitch from the Wikimedia seat-back width, iPad mini 134.8 x 203.2 mm (Apple spec), index finger ~0.072 m,
# helmet ~0.30 m, exterior profile / windows / hatch of config/vehicles/detail/crew_dragon.toml (capsule D 4.0 m).

[cabin]
wall_m = 0.18                  # [E] side wall normal thickness (backshell TPS + pressure shell + liner): crew1_1 window wells ~0.15-0.25 deep; crew1_1 window spacing gives inner r 1.43 +-0.1 at x 2.38 (exterior 1.62)
floor_x_m = 1.15               # [E] floor panels: Wikimedia photo, cargo C5-C7 (bags ~0.45 m) under the seat pans; 0.5 m below the hatch sill (x 1.70 exterior); +-0.15
ceiling_x_m = 3.35             # [E] upper bulkhead trim around the forward tunnel (crew1_1, Wikimedia: flat annular ceiling with the tunnel ring); parachute bay above it; +-0.1
tunnel_radius_m = 0.45         # [E] forward-hatch tunnel trim: IDSS passage 0.8 m [S: IDSS IDD Rev E] + trim; dragon_crew12_portrait (four heads in the opening)
tunnel_top_x_m = 3.66          # [D] forward hatch face: exterior recess floor 3.74 (detail file neck_m) - 0.08 hatch plate
# Inner wall of revolution [x, r], floor centre -> side wall -> ceiling -> tunnel -> forward hatch centre. Side wall = exterior profile_m offset inward by wall_m along the meridian normal.
profile_m = [[1.15, 0.0], [1.15, 1.756], [1.4, 1.716], [1.6, 1.675], [1.8, 1.622], [2.0, 1.562], [2.2, 1.499], [2.4, 1.429], [2.6, 1.356], [2.8, 1.276], [3.0, 1.196], [3.2, 1.116], [3.35, 1.064], [3.35, 0.45], [3.66, 0.45], [3.66, 0.0]]  # [D] wall_m offset of the exterior profile_m (closest exterior point 0.094 m), floor_x_m, ceiling_x_m, tunnel_*
# Windows and hatch in the EXTERIOR table's convention (outer surface: [az deg, x, half x, half az deg]); the generator carries them through the wall along the local wall normal (x shifts -0.06 m on the inner face).
windows = [[33.3, 2.38, 0.255, 5.5], [90.0, 2.385, 0.245, 5.6]]  # [D] = detail/crew_dragon.toml windows (mirrored to -az); photos agree within their +-20 % / +-10 deg resolution (cockpit.md "Windows and hatch")
hatch = [0.0, 2.345, 0.645, 19.0]  # [D] = detail/crew_dragon.toml hatch; interior side seen only in part (discovery10 under the console)
window_reveal_radius_m = 0.24  # [E] round interior reveal (white bezel, dark well): crew1_1 opening ~0.46 x 0.50 m at the az 90 windows (helmet-scaled, +-25 %); dragon_cockpit_crew11 round bezel
window_bezel_m = 0.06          # [E] white bezel ring width around the reveal, dragon_cockpit_crew11 (ring ~1/4 of the reveal radius)
hatch_trim_m = 0.05            # [E] white trim frame around the hatch's inner face, discovery10

[[seat]]
id = "s1"                      # [D] S1..S4 from the crew's left: Wikimedia interior photo labels (S1 on the crew's left = +Z)
role = "specialist"            # [S] spec 2026-11-07: mission specialists on the outer seats
hip_m = [1.72, -0.02, 1.05]    # [E] Z = 1.5 seat pitches; outer seats 0.08 lower (Wikimedia: outer seat tops lower in the image); +-0.1
back_angle_deg = 35.0          # [E] seat back from +X toward -Y: crew1_1 torso foreshortening (hip-helmet 0.65 of 0.75 m seen from the hatch), knees above hips; +-10
width_m = 0.58                 # [E] seat shell at the hip: Wikimedia, pitch / back width = 1.2

[[seat]]
id = "s2"                      # [D] see s1
role = "commander"             # [S] spec 2026-11-07: player = commander, left of centre
hip_m = [1.80, -0.02, 0.35]    # [E] Z = half seat pitch 0.70 (Wikimedia pitch / back width 1.2, back 0.58); X, Y: eye 0.70 m from the console (arm's reach, crew2_1, inspiration4_1) and 0.55 m above the hatch sill; +-0.1
back_angle_deg = 35.0          # [E] see s1
width_m = 0.58                 # [E] see s1

[[seat]]
id = "s3"                      # [D] see s1
role = "pilot"                 # [S] spec 2026-11-07: pilot right of centre
hip_m = [1.80, -0.02, -0.35]   # [D] mirror of s2
back_angle_deg = 35.0          # [E] see s1
width_m = 0.58                 # [E] see s1

[[seat]]
id = "s4"                      # [D] see s1
role = "specialist"            # [S] spec 2026-11-07
hip_m = [1.72, -0.02, -1.05]   # [D] mirror of s1
back_angle_deg = 35.0          # [E] see s1
width_m = 0.58                 # [E] see s1

[eye]
position_m = [2.447, -0.351, 0.35]  # [D] s2 hip + 0.72 m up the seat back + 0.10 m forward (seated eye height 0.79 m above the pan, hip point 0.07 above it); +-0.10 per axis
forward = [0.81915, 0.57358, 0.0]     # [E] straight ahead, 20 deg above the seat's chest normal toward the console (crew11, crew10: gaze up to the screens)
up = [0.57358, -0.81915, 0.0]         # [D] perpendicular to forward in the X-Y plane, head-up side

[console]
# Housing: one slab across the panel, front face in the centre screen's plane, side wings folded like the side screens.
centre_m = [3.010, 0.066, 0.0]      # [D] centre screen centre - 0.02 up (housing reaches 0.25 above and 0.29 below it)
normal = [-0.81915, -0.57358, 0.0]    # [D] = centre screen normal
up = [0.57358, -0.81915, 0.0]         # [D] = eye up
width_m = 1.60                      # [E] crew1_1 console box 450 px wide below the tunnel at ~1.4 m (1.2-1.4 m) + side wings with the tablets (discovery10); +-0.15
height_m = 0.54                     # [D] 0.13 housing above the screens (tablet mounts, discovery10) + 0.215 screen + 0.195 shelf, button rows, handle box below
depth_m = 0.15                      # [E] crew11, crew13: thin box; back top stays below ceiling_x_m (x 3.29)
fold_deg = 12.0                     # [E] side wings and side screens turned toward the crew about `up`: discovery10, training2 (+-5)
strut_z_m = [0.55, -0.55]           # [E] two struts from the housing top to the ceiling ring, crew1_1 / Wikimedia (at 1/3 and 2/3 of the box)

[[screen]]
id = "left"                         # [S] spec 2026-11-07: left screen = external cameras
centre_m = [2.984, 0.025, 0.422]    # [D] centre screen edge + 0.045 m gap, folded fold_deg toward the crew
normal = [-0.8013, -0.5610, -0.2079]  # [D] centre normal turned fold_deg about up
up = [0.57358, -0.81915, 0.0]         # [D] = eye up
size_m = [0.382, 0.215]             # [E] active area: training2 finger scale (index finger ~0.072 m on the screen) gives 0.35-0.40 wide; 16:9 (17.3 in class); +-15 %
aspect = 1.7778                     # [E] discovery10 1.88, training2 1.76 (perspective): 16:9

[[screen]]
id = "centre"                       # [S] spec 2026-11-07
centre_m = [3.021, 0.050, 0.0]      # [D] on the centre line, 0.70 m along eye forward from the eye's (X, Y): reach (crew2_1, inspiration4_1: arms near straight); +-0.1
normal = [-0.81915, -0.57358, 0.0]    # [D] facing the eye's forward
up = [0.57358, -0.81915, 0.0]         # [D] = eye up
size_m = [0.382, 0.215]             # [E] see left
aspect = 1.7778                     # [E] see left

[[screen]]
