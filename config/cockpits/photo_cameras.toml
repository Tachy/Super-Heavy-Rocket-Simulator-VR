# Camera poses of the cabin reference photos (fidelity comparison shots, docs/subsystems/cockpit.md "Photo cameras").
# Frame: the capsule cabin frame of crew_dragon.toml (X nose, Y toward the hatch, Z crew left), metres, unit vectors, degrees.
# `file` is relative to the repo root (photos are git-ignored measuring references, nothing of them ships); `size_px` the photo size.
# `forward` / `up` give the camera axes (image right = forward x up of the render convention: right-handed, up = image up).
# model: "pinhole" (fov_h_deg horizontal field) or "fisheye_equidistant" (r = f * theta, fov_h_deg = 2 * (width / 2) / f in rad).
# Every value line carries [S] / [E] / [D] (config/README.md). Later fits (tools, Task 3 of the fidelity plan) write their poses here.

[[photo]]
id = "crew1_1"                                   # [D] photo id = shot name suffix (fid_crew1_1)
file = "screenshots/m7-cockpit-refs/mielke/crew1_1.jpg"   # [D] reference photo, hatch view of the four seats
size_px = [1200, 800]                            # [S] file size
position_m = [1.8093, 1.4174, 0.0033]            # [E] (y, z are [D]; x prior-dominated) fidelity Task 5 as-built console fit (cabin_fit/parts/console.py --as-built, crew1_1 + discovery2 + discovery10 incl. the iPad corners and the free screen height, prior = round 4 pose +-0.05 m / 0.02 rad): 1.18 px rms of 1200; y +-0.029, z +-0.015 data-constrained [D], x +-0.035 prior-dominated [E]; 2.7 cm from the Task 4 row
forward = [0.19650, -0.98050, 0.00362]           # [E] (yaw, roll are [D]; pitch prior-dominated) same fit: 11.3 deg up toward +X; yaw / roll data-constrained [D], pitch +-0.7 deg prior-dominated [E]
up = [0.98049, 0.19651, 0.00425]                 # [E] (follows forward, pitch prior-dominated) same fit
fov_h_deg = 97.341                               # [E] same fit: f 527 px on 1200 px, prior-dominated (+-1.8 %)
model = "pinhole"                                # [D] rectilinear photo

[[photo]]
id = "discovery2"                                # [D] photo id = shot name suffix (fid_discovery2)
file = "screenshots/m7-cockpit-refs/mielke/discovery2.jpg"   # [D] reference photo, GoPro between the heads toward the screens
size_px = [4128, 2322]                           # [S] file size
position_m = [2.2239, -0.6465, -0.0306]          # [D] fidelity Task 5 as-built console fit (screen glass corners + front bottom edge, prior = round 4 pose +-0.05 m / 0.035 rad), rms 6.3 px of 4128; +-0.013 / 0.024 / 0.007 m, data-constrained
forward = [0.34391, 0.93892, 0.01245]            # [D] same fit, +-0.6 deg (data-constrained)
up = [0.93870, -0.34343, -0.02987]               # [D] same fit
fov_h_deg = 114.991                              # [E] same fit: equidistant f 2057 px/rad, prior-dominated (+-1.5 %; k1 not used: the shots render k = 0)
model = "fisheye_equidistant"                    # [D] GoPro wide lens

[[photo]]
id = "discovery10"                               # [D] photo id = shot name suffix (fid_discovery10)
file = "screenshots/m7-cockpit-refs/mielke/discovery10.jpg"  # [D] reference photo, another frame of discovery2's fixed GoPro mount
size_px = [4128, 2322]                           # [S] file size
position_m = [2.2262, -0.6347, -0.0187]          # [D] fidelity Task 5 as-built console fit (10 screen glass corners, 6 iPad body corners, front bottom edge; prior = discovery2 pose +-0.05 m / 0.035 rad), rms 6.2 px of 4128; +-0.012 / 0.022 / 0.004 m, data-constrained (same GoPro mount as discovery2)
forward = [0.34498, 0.93860, -0.00294]           # [D] same fit, +-0.3-0.8 deg (data-constrained)
up = [0.93810, -0.34490, -0.03195]               # [D] same fit
fov_h_deg = 117.178                              # [D] same fit: equidistant f 2019 px/rad, +-1.2 % (data-constrained)
model = "fisheye_equidistant"                    # [D] GoPro wide lens
