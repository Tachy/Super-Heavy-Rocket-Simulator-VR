# Crew figure in the newer SpaceX EVA suit (M7 cockpit): one adult, seated in a Dragon seat, rebuilt by us (nothing of any photo or model
# is copied). Task 8b: an anatomical body from ANSUR II measures (figure_body.py), the suit as its own hull with ease over it, suit detail
# (stripes, seams, chevron, pockets, joint inserts, flag) and dynamic joint wrinkles by texture / shader (suit_textures.py, crew_suit.gdshader).
# Figure frame (glTF origin = the seat's hip reference point of config/cockpits/crew_dragon.toml [[seat]] hip_m = the point where the
# seat-back plane meets the pan surface; the figure's hip joint sits 0.10 above and 0.12 ahead of it):
#   X = up the seat back (toward the head), Y = the seat's chest normal (forward, away from the back), Z = the crew's LEFT.
# The game places the figure at a seat: origin = hip_m, basis columns (x, y, z) in the capsule frame = ((cos a, -sin a, 0), (sin a, cos a, 0), (0, 0, 1)),
# a = back_angle_deg. Left parts (_l) are at +Z. Metres; angles degrees. Every value line carries [S] / [E] / [D] with its derivation.
# Look references (git-ignored, screenshots/m7-cockpit-refs/): sheet_suit.jpg = eva_suit_newatlas (full suit, standing), eva_suit_detail1-4
# (helmet, collar, shoulder stripes), user/anzug/spacex.jpg (chest chevron, flag), mielke/crew1_1, demo1_1 (seated crew, knee folds),
# nasa/KSC-20190731-PH_SPX01_0002 (seated profile, hands on the thighs).
# Body measures: ANSUR II (2012 U.S. Army anthropometric survey, male public database, 4082 subjects; tools/data_pipeline/sources.toml
# ansur2_male): the MEDIAN (50th percentile) of each measure, read from data/anthropometry/ANSUR_II_MALE_Public.csv (mm -> m). The medians
# are per measure, not one person's set. The topology follows the edge-loop layout of the Blender Studio Human Base Meshes (CC0, reference only).

[figure]
stature_m = 1.755                # [S] ANSUR II male median stature (1755 mm)
hip_joint_up_m = 0.10            # [E] hip joint (trochanter) above the seat pan surface: seated anthropometry, buttock thickness ~0.09-0.10
hip_joint_forward_m = 0.12       # [E] hip joint ahead of the seat-back plane: back-to-trochanter depth ~0.11-0.13 (buttock depth 0.246 x back share 0.47, seated compression)
hip_joint_half_spacing_m = 0.088  # [E] hip joint centres 0.176 apart (about half the ANSUR hip breadth 0.344 plus the greater trochanter offset inward)
knee_angle_deg = 105.0           # [E] interior knee angle (thigh to shin; 180 = straight leg): crew1_1 (fix round 3, reviewer fit) shows a recliner posture, thigh 10-20 deg above the hatch axis and shin ~60-65 deg below it = 95-105; +-10
thigh_raise_deg = -25.0          # [E] thigh angle above the SEAT PAN plane (the pan is 35 deg above the hatch axis with the seat back at 35 deg): -25 puts the thighs 10 deg above the hatch axis (crew1_1 fit: 10-20), the shins 65 deg below it; +-10
arm_reach_fraction = 0.44        # [S] Drillis and Contini 1966: shoulder (acromion) to the tip of the middle finger, fraction of stature; the ANSUR chain is tested against it, +-0.05 m
shoulder_joint_drop_m = 0.0      # [D] the upper-arm bone starts at the acromion: its length is ANSUR acromion-radiale (measured from the acromion), as the round-4 reach fit of crew_dragon.toml assumes; the deltoid cap rounds the mesh around it
shoulder_joint_inset_m = 0.0     # [D] see shoulder_joint_drop_m: at the acromion tip (biacromial_breadth / 2)

[anthropometry]
# ANSUR II male medians (mm / 1000). Heights are standing heights above the floor; the generator uses differences of them.
acromial_height = 1.439          # [S] ANSUR II acromialheight
axilla_height = 1.328            # [S] ANSUR II axillaheight
chest_height = 1.289             # [S] ANSUR II chestheight
waist_height = 1.055             # [S] ANSUR II waistheightomphalion
trochanter_height = 0.899        # [S] ANSUR II trochanterionheight (the hip joint level)
crotch_height = 0.845            # [S] ANSUR II crotchheight
knee_height = 0.491              # [S] ANSUR II lateralfemoralepicondyleheight (the knee joint)
ankle_height = 0.073             # [S] ANSUR II lateralmalleolusheight (the ankle joint)
cervicale_height = 1.517         # [S] ANSUR II cervicaleheight (neck base, back)
biacromial_breadth = 0.415       # [S] ANSUR II biacromialbreadth
bideltoid_breadth = 0.509        # [S] ANSUR II bideltoidbreadth (across the deltoids, arms hanging)
chest_breadth = 0.289            # [S] ANSUR II chestbreadth
chest_depth = 0.253              # [S] ANSUR II chestdepth
chest_circumference = 1.056      # [S] ANSUR II chestcircumference
waist_breadth = 0.325            # [S] ANSUR II waistbreadth
waist_depth = 0.234              # [S] ANSUR II waistdepth
waist_circumference = 0.937      # [S] ANSUR II waistcircumference
hip_breadth = 0.344              # [S] ANSUR II hipbreadth
buttock_depth = 0.246            # [S] ANSUR II buttockdepth
buttock_circumference = 1.017    # [S] ANSUR II buttockcircumference
thigh_circumference = 0.624      # [S] ANSUR II thighcircumference (at the gluteal furrow)
lower_thigh_circumference = 0.408  # [S] ANSUR II lowerthighcircumference (just above the knee)
calf_circumference = 0.392       # [S] ANSUR II calfcircumference
ankle_circumference = 0.228      # [S] ANSUR II anklecircumference
wrist_circumference = 0.176      # [S] ANSUR II wristcircumference
neck_circumference_base = 0.433  # [S] ANSUR II neckcircumferencebase
upper_arm_length = 0.335         # [S] ANSUR II acromionradialelength (acromion to the elbow joint)
forearm_length = 0.267           # [S] ANSUR II radialestylionlength (elbow joint to the wrist)
hand_length = 0.193              # [S] ANSUR II handlength
hand_breadth = 0.088             # [S] ANSUR II handbreadth
palm_length = 0.116              # [S] ANSUR II palmlength
foot_length = 0.271              # [S] ANSUR II footlength
thigh_clearance = 0.180          # [S] ANSUR II thighclearance (seated thigh thickness): the thigh sections' depth

[body]
# The anatomical body hull (figure_body.py), WITHOUT the suit. Torso levels as rows [s = height above the hip joint, half breadth, depth,
# back share of the depth, girth (0 = none: the superellipse exponent is interpolated), forward offset of the section centre]; the
# exponent of a row with a girth is fitted so the section's perimeter equals it. Heights: ANSUR height minus trochanter_height.
torso_levels_m = [  # [D] one row per level, each tagged
  [-0.054, 0.150, 0.215, 0.50, 0.0, 0.0],   # [D] crotch (crotch_height - trochanter_height); [E] pelvis floor narrower than the hips
  [-0.025, 0.166, 0.238, 0.48, 0.0, 0.0],   # [E] between the crotch and the trochanter
  [0.000, 0.172, 0.246, 0.47, 1.017, 0.0],  # [S] buttock level: hip_breadth / 2, buttock_depth, buttock_circumference
  [0.080, 0.166, 0.238, 0.47, 0.0, 0.004],  # [E] iliac crest region, between the buttock and waist rows
  [0.156, 0.1625, 0.234, 0.47, 0.937, 0.008],  # [S] waist (omphalion): waist_breadth / 2, waist_depth, waist_circumference
  [0.220, 0.157, 0.238, 0.47, 0.0, 0.010],  # [E] tenth rib (ANSUR tenthribheight 1.119 - 0.899)
  [0.300, 0.150, 0.246, 0.46, 0.0, 0.012],  # [E] lower chest
  [0.390, 0.148, 0.258, 0.45, 1.056, 0.014],  # [S] chest (chest_height - trochanter): chest_circumference; [E] half breadth 0.148 / depth 0.258 = ANSUR chest_breadth / 2 + 3.5 mm, chest_depth + 5 mm (the girth of 1.056 needs a near-box section; the subdivided body keeps the breadth and depth within 1 cm of ANSUR)
  [0.429, 0.148, 0.250, 0.46, 0.0, 0.014],  # [D] axilla (axilla_height - trochanter): bottom of the arm port
  [0.470, 0.158, 0.236, 0.47, 0.0, 0.013],  # [E] upper chest, pectoral / posterior axillary folds
  [0.505, 0.170, 0.212, 0.49, 0.0, 0.011],  # [E] under the acromion
  [0.545, 0.176, 0.170, 0.52, 0.0, 0.008],  # [D] shoulder top just medial of the acromion (acromial_height - trochanter = 0.540): top of the arm port
  [0.572, 0.150, 0.152, 0.53, 0.0, 0.006],  # [E] trapezius slope toward the neck (a gentle shoulder line, eva_suit_newatlas)
  [0.598, 0.106, 0.138, 0.54, 0.0, 0.003],  # [E] trapezius near the neck
  [0.618, 0.069, 0.138, 0.50, 0.433, 0.0],  # [S] neck base (cervicale_height - trochanter): neck_circumference_base
  [0.650, 0.063, 0.126, 0.50, 0.0, 0.0]]    # [E] neck top inside the hood (closed by a cap)
arm_port_rows = [8, 11]          # [D] torso level indices of the arm port's bottom (axilla) and top (shoulder top) edges
arm_port_columns = 3             # [E] the port spans this many columns either side of the side column (32 columns around): 7 vertices front to back
torso_columns = 32               # [E] vertices around the torso (16 per half: each leg loop takes one half plus the crotch bridge)
crotch_bridge = 3                # [E] vertices on the crotch line between the two leg loops
# Limb sections [t = distance from the proximal joint along the limb, lateral half width, front-back half depth, girth (0 = none: as typed;
# otherwise the lateral half width is fitted so the ellipse's perimeter equals it)].
arm_sections_m = [  # [D] one row per section, each tagged
  [0.10, 0.048, 0.058, 0.0],     # [E] upper arm at the axilla: girth ~0.335 (ANSUR bicepscircumferenceflexed 0.357 x ~0.93 relaxed), flatter across (bideltoid_breadth with the arms hanging, tested)
  [0.20, 0.047, 0.054, 0.0],     # [E] biceps belly, relaxed (girth ~0.32)
  [0.28, 0.048, 0.044, 0.0],     # [E] above the elbow
  [0.335, 0.045, 0.039, 0.0],    # [E] elbow (upper_arm_length): elbow girth ~0.265
  [0.40, 0.047, 0.041, 0.0],     # [E] forearm maximum (forearmcircumferenceflexed 0.310 x ~0.92 relaxed = 0.285)
  [0.50, 0.039, 0.030, 0.0],     # [E] mid forearm
  [0.602, 0.0, 0.020, 0.176]]    # [S] wrist (upper_arm_length + forearm_length): wrist_circumference; [E] depth 0.020 (flat wrist)
leg_sections_m = [  # [D] one row per section, each tagged
  [0.10, 0.0, 0.088, 0.624],     # [S] upper thigh at the gluteal furrow: thigh_circumference; [D] depth = thigh_clearance / 2 (seated thickness)
  [0.22, 0.0, 0.080, 0.545],     # [E] mid thigh
  [0.33, 0.0, 0.066, 0.440],     # [E] lower thigh
  [0.378, 0.0, 0.062, 0.408],    # [S] lower_thigh_circumference, 0.03 above the knee joint
  [0.408, 0.0, 0.058, 0.380],    # [E] knee joint (trochanter_height - knee_height)
  [0.53, 0.0, 0.064, 0.392],     # [S] calf_circumference, ~0.12 below the knee
  [0.68, 0.0, 0.048, 0.290],     # [E] lower shin
  [0.80, 0.0, 0.034, 0.228]]     # [S] ankle_circumference just above the malleolus
thigh_lateral_offset_m = 0.012   # [E] the thigh section's centre sits this far lateral of the bone axis near the hip (gluteal / vastus mass), fading to 0 at the knee
build_arm_abduction_deg = 35.0   # [E] build pose (the mesh is modelled in it, then posed to the seated rest): arms 35 deg out from the torso (A-pose, base-mesh convention)
build_leg_abduction_deg = 6.0    # [E] build pose: legs straight down, 6 deg apart (the thighs clear each other at the crotch)
deltoid_radius_m = 0.070         # [E] the shoulder cap keeps at least this distance from the shoulder joint (the acromion) on its outer side: tested against bideltoid_breadth with the arms hanging
port_transition_rings = 3        # [E] rings between a port loop and the first limb section (deltoid / gluteal fold)

[pose]
# Seated rest pose (KSC-20190731-PH_SPX01_0002, crew1_1): forearms down beside the torso, hands resting on the thighs, palms down. Left side
# numbers (+Z); the right side is mirrored. The arm is a two-bone chain from the shoulder joint to the wrist with the elbow toward elbow_pole.
wrist_m = [0.152, 0.322, 0.115]  # [E] wrist on the thigh: palm centre ~0.30 m along the thigh from the hip joint, on its top surface (thigh_clearance / 2 + glove); +-0.03
elbow_pole = [-0.35, -0.55, 0.76]  # [E] the elbow points back, out and down: beside the torso, over the armrest (KSC-20190731 side view)
hand_inward_deg = 12.0           # [E] the hand's direction turns this far toward the body centre from the thigh direction (fingers over the inner thigh)
palm_lift_deg = 8.0              # [E] the hand's direction rises this far off the thigh surface toward the knee (the wrist sits higher than the fingertips' line)
neck_lean_m = 0.04               # [E] the head sits this far ahead of the neck base (helmet against the headrest, crew1_1)
head_centre_up_m = 0.80          # [D] eye contract: the figure's eye (helmet centre + EYE_UP 0.03) = 0.83 up the back = [eye] of crew_dragon.toml minus seat s2's hip_m
head_centre_forward_m = 0.17     # [D] eye contract: eye 0.23 along the chest normal (helmet centre + EYE_FORWARD 0.06); helmet rear at the headrest

[hand]
palm_length_m = 0.118            # [D] ANSUR palm_length 0.116 + glove 0.002
palm_half_width_m = 0.048        # [D] ANSUR hand_breadth 0.088 / 2 + glove 0.004
palm_half_thick_m = 0.020        # [E] glove palm, half thickness
index_m = [0.040, 0.024, 0.018]  # [E] index phalanges (proximal, middle, distal), glove; index tip 0.20 from the wrist
index_radius_m = 0.0105          # [E] glove finger radius
index_offset_m = 0.030           # [E] index knuckle toward the thumb side from the palm centre line
fingers_m = [0.044, 0.027, 0.020]  # [E] middle / ring / little phalanges on the bones fingers, fingers_2, fingers_3 (the middle finger: hand_length 0.193 - palm 0.116 = 0.077 + glove)
finger_spacing_m = 0.019         # [E] centre spacing of the middle, ring and little fingers (hand_breadth 0.088 / 4.6 with the glove)
finger_radius_m = 0.0100         # [E] glove finger radius (middle; ring and little 5 / 12 % thinner)
finger_length_share = [1.0, 0.94, 0.78]  # [E] ring and little finger length relative to the middle finger
fingers_offset_m = -0.010        # [E] the middle finger's knuckle toward the little finger from the palm centre line
thumb_m = [0.042, 0.032]         # [E] thumb proximal and distal, glove
thumb_radius_m = 0.0120          # [E] glove thumb radius
thumb_root_offset_m = 0.036      # [E] thumb root toward the thumb side, from the palm centre
thumb_root_forward_m = 0.020     # [E] thumb root forward of the wrist
thumb_spread_deg = 35.0          # [E] thumb direction away from the fingers, relaxed
finger_curl_deg = 14.0           # [E] relaxed curl per finger joint (toward the palm side): fingers drape over the thigh (KSC-20190731)

[suit]
# The suit is its own hull over the body: the body sections plus the ease (radial allowance) per region, from the photos (eva_suit_newatlas,
# crew1_1): loose at the thighs and upper arms, tight at the forearm and shank.
ease_torso_m = 0.014             # [E] torso: a soft pressure suit over the liner, ~1.5 cm (eva_suit_newatlas: the chest reads ~0.31 wide)
ease_upper_arm_m = 0.016         # [E] upper arm: loose (eva_suit_newatlas sleeves are full to the elbow)
ease_forearm_m = 0.007           # [E] forearm: close fitting toward the glove lock
ease_thigh_m = 0.016             # [E] thigh: loose (crew1_1, eva_suit_newatlas)
ease_shank_m = 0.006             # [E] shank: close fitting (the boot shaft goes over it)
cuff_radius_m = 0.042            # [E] wrist ring (glove lock), the white metal ring of eva_suit_detail1
cuff_length_m = 0.025            # [E] wrist ring length along the forearm
boot_shaft_fraction = 0.50       # [E] the black boot covers this fraction of the shin from the ankle up (sheet_suit: boots reach mid-calf)
boot_ease_m = 0.010              # [E] boot shaft over the suit's lower leg
boot_foot_half_width_m = 0.052   # [D] boot half width at the ball: ANSUR foot_breadth 0.102 / 2 + boot 0.001 (sole flare)
boot_foot_half_height_m = 0.045  # [E] boot half height at the ankle (sole + upper)
boot_heel_m = 0.065              # [E] heel behind the ankle joint
boot_length_m = 0.290            # [D] heel to toe: ANSUR foot_length 0.271 + boot 0.019
neck_radius_m = 0.080            # [E] neck ring (suit collar) radius under the helmet

[joints]
# Dynamic folds and corrective shapes per joint (figure_body.py; the game: figure_deform.gd). Bend angle theta = the angle between the
# reference direction (shoulder / hip: the torso's down axis; elbow / knee: the parent bone) and the child bone. Rows: [neutral, full bend,
# extension limit]: the wrinkle weight is 0 at `neutral` (straight joint, the build pose) and 1 at `full`; corrective shapes are baked for
# the rest pose -> full bend (flex) and rest -> extension limit (ext).
shoulder_deg = [0.0, 130.0, 0.0]  # [E] arm hanging = 0; raised to the top screen row ~120 deg (brief: 120 deg raise keeps volume)
elbow_deg = [0.0, 140.0, 0.0]    # [E] straight arm = 0; full flexion of a suited elbow ~140
hip_deg = [0.0, 110.0, 0.0]      # [E] standing = 0; seated recline 65; the deepest crouch the suit allows ~110
knee_deg = [0.0, 135.0, 0.0]     # [E] straight leg = 0; seated 75; full knee flexion in the suit ~135
fold_pitch_m = 0.028             # [E] spacing of the compression folds (crew1_1 knees, demo1_1 elbows: 2-4 cm)
fold_depth_m = 0.006             # [E] fold height at full bend (soft fabric over a joint, a few mm)
fold_reach_m = [0.075, 0.075, 0.09, 0.09]  # [E] half length of the fold zone along the limb at the shoulder, elbow, hip, knee

[suit_look]
# Surface detail of the suit as texture (suit_textures.py bakes suit_albedo.png and suit_wrinkle.png on the suit's UV atlas; nothing of a
# photo is copied). eva_suit_newatlas: dark grey side panels from the shoulders down the torso sides and the outer thighs, a grey stripe
# down the back of the upper arm and a grey forearm panel, thin seam lines, the chest plate's chevron edge under the collar (spacex.jpg),
# thigh pockets, ribbed knee bellows, grey joint inserts, the flag patch on the upper left arm (spacex.jpg).
atlas_m = [2.56, 1.60]           # [D] the atlas in metres of suit surface (torso 1.10 x 0.72, arms 0.40 x 0.78, legs 0.66 x 1.00, packed)
texel_m = 0.00125                # [E] albedo texel: 1.25 mm (2048 x 1280; a 3 mm seam is two texels)
wrinkle_texel_m = 0.0025         # [E] wrinkle map texel: 2.5 mm (folds are 2-4 cm apart)
stripe_albedo = [0.16, 0.16, 0.17]  # [E] dark grey side panels (eva_suit_newatlas: near charcoal against the white)
seam_albedo = [0.50, 0.50, 0.52]  # [E] seam lines: thin light grey piping
insert_albedo = [0.40, 0.40, 0.41]  # [E] grey joint inserts (inner elbow, back of the knee) and the chevron band
side_stripe_width_m = 0.075      # [E] torso side panel width (eva_suit_newatlas: ~0.07-0.08 at the waist)
arm_stripe_width_m = 0.040       # [E] stripe down the back of the upper arm
leg_stripe_width_m = 0.055       # [E] stripe down the outer thigh to above the knee
seam_width_m = 0.003             # [E] seam piping width
chevron_width_m = 0.018          # [E] the chest plate's grey chevron band under the collar (spacex.jpg)
zip_width_m = 0.006              # [E] the front closure line from the chevron to the crotch
pocket_m = [0.11, 0.13]          # [E] thigh pocket width and height (eva_suit_newatlas: square patches on the front of the thighs)
flag_m = [0.080, 0.050]          # [E] flag patch on the upper left arm (spacex.jpg: ~0.08 wide)
bellows_pitch_m = 0.020          # [E] rib pitch of the knee bellows (eva_suit_newatlas: 5-6 ribs over the knee)
bellows_count = 6                # [E] ribs of the knee bellows

[helmet]
# Shape (Task 5b) after the clean side profile spacex-anzug.jpg (visor closed, no headrest) with jsc2024e066389 / 066390 (thin shell around the opening) and
# spacex.jpg (3/4 front): a compact shell, not bulbous; the crown slopes back to a faceted rear (flat upper rear facet, flat rear face, flat sides); a recessed
# panel line from the crown down the side (surface detail: shader, `grooves`); a large face opening, wide at the brow and temple, narrowing to the chin;
# the closed visor seated in it (copper top, dark clear glass below), a thin white frame bead with a black seal inside it; a round grey visor-pivot button
# on each side; the shell's lower edge slopes from high at the rear to the chin, a grey knit neck hood fills the space down to the shoulders.
# Visor closed and copper: user decision (spec). Scale ruler: the face opening's height (top edge to the chin tip, 265 px in spacex-anzug.jpg) = the
# round-4 opening height 0.232 m (eva_suit_detail2 measure: +38 / -40 deg on the 0.20 / 0.17 m shell) -> 1142 px/m; helmet centre at photo pixel
# (513, 313) = the figure eye (0.06 behind the face front, 0.03 below mid head) minus EYE_UP / EYE_FORWARD. Photo outline residuals: scratch fit, report.
# Frame of the numbers below: helmet centre, x up, y forward, z left (figure_layout.helmet_*).
half_width_m = 0.135             # [E] superellipsoid half width (z) before the side facets: spacex.jpg, the shell is ~0.26 wide against the 0.28 m depth (head 0.155 + padding); +-0.015
side_flat_m = 0.125              # [E] the flat sides (facets) at z = +-0.125: spacex.jpg, flat cheek / temple panels behind the opening
half_depth_front_m = 0.125       # [E] centre to the shell's front (under the visor dome): spacex-anzug, front 155 px ahead of the centre minus the dome
half_depth_rear_m = 0.155        # [E] superellipsoid rear radius; the flat rear face (rear_flat_m) cuts it
rear_flat_m = 0.135              # [E] flat rear face at y = -0.135: spacex-anzug, rear outline vertical from 180 to 270 px at 349-358 px = 0.14 behind the centre
half_below_m = 0.15              # [E] centre to the chin bowl's bottom (superellipsoid): spacex-anzug, chin 0.12-0.13 below the centre at the front
half_above_m = 0.215             # [E] centre to the crown: spacex-anzug, crown 236 px = 0.207 above the centre (the superellipsoid fills the front top to the visor's top corner)
shell_exponent = 2.5             # [E] superellipsoid exponent: fuller than an ellipsoid (2): the visor's top corner (0.116, 0.147) lies on the profile within 1 cm
rear_facet_normal = [0.623, -0.782, 0.0]  # [E] sloped upper rear facet (x up, y forward, z left): spacex-anzug, straight rear-top outline 373,150 -> 417,94 px (52 deg from horizontal)
rear_facet_offset_m = 0.185      # [E] the facet plane's offset from the centre along its normal (through the two outline points)
cut_rear_m = [0.036, -0.134]     # [E] the shell's lower edge at the rear (x, y): spacex-anzug, rear bottom corner at 362,272 px (the grey hood shows below it)
cut_slope_deg = 36.0             # [E] the lower edge falls toward the chin by this angle: spacex-anzug, rear corner to the chin bottom 595,450 px (36 deg); +-5
visor_outline = [[-43.0, 12.0], [-30.0, 50.0], [-18.5, 62.0], [-7.0, 71.0], [11.5, 82.0], [23.0, 90.0], [31.5, 92.0], [38.0, 79.0], [43.5, 62.0], [49.0, 35.0], [52.5, 18.0]]  # [E] face opening as [elevation, half width (azimuth)] rows, bottom (chin tip) to top (brow on the sagittal line): spacex-anzug boundary points (10, read on the bright crop) projected onto the shell (scratch fit, 0.2-1 mm; the brow point 12 mm); the 95 deg at the temple capped at 92; the brow row kept 18 deg wide (the frame bead cannot close on a point); wide at the brow and temple, narrowing to the chin (spacex.jpg); +-5 deg
visor_proud_m = 0.012            # [E] closed visor bulge over the shell at its centre: spacex-anzug, the visor sits nearly flush in its frame (front 668 px, ~0.01 ahead of the frame line; 0.022 read as an egg-shaped dome in the first render)
visor_edge_m = 0.004             # [E] visor outer surface over the shell at its edge (it sits in the frame's inner lip)
visor_thickness_m = 0.006        # [E] visor shell thickness (closed solid)
