# Refuelling r5: one tanker flight in the full model (spec r5 "tanker_flight"): launch window into the depot plane ->
# ascent with booster catch -> phasing -> proximity -> docking -> transfer down to the computed reserve -> undocking
# and departure -> deorbit -> entry -> flip and catch on the header tanks.
[mission]
name = "Tankerflug zum Depot"
kind = "tanker_flight"
ascent = "tanker_ascent"
port = "transfer_dock"
return = "ship_return_starbase"   # its [deorbit] block (entry interface, bank, crossrange)

# The depot, placed (not flown in this mission): synthetic orbit advanced by J2 (r5 plan decision 2).
[depot]
vehicle = "starship_depot"
port = "transfer_dock"
height_km = 200.0
inclination_deg = 26.5            # true equator frame
raan_deg = 0.0                    # at earliest_utc
argument_of_latitude_deg = 0.0    # at earliest_utc
propellant_t = 600.0              # [test] a depot after a few tankers (r3/r4 tests)

[start]
mode = "pad"                      # "pad" | "phasing_orbit"

[launch_window]
earliest_utc = "2026-10-20T00:00:00"
search_days = 12.0                # [E] r3: the crossings close the phasing on few days
insertion_s = 445.5               # [D] r5: liftoff -> orbit insertion of the flown tanker ascent
insertion_arc_deg = 12.20         # [D] r5: inertial in-plane arc pad -> insertion point, flown

[phasing]
mission_limit_h = 48.0            # [E] uncrewed (the crew's 28 h opened the first window after 177 h, r3)
earliest_arrival_h = 0.0
periapsis_km = 170.0              # the reference phasing orbit (r5; --reference-phasing) after the raise at apoapsis
# [E] f1: the phasing orbits (periapsis, apoapsis km) the launch window chooses from - below the depot the tanker
# catches up, above it the depot does; 150 km: the lower bound for 48 h of drag
candidates_km = [[150.0, 190.0], [160.0, 190.0], [170.0, 190.0], [180.0, 190.0],
                 [220.0, 240.0], [250.0, 270.0]]
window_margin_h = 4.0             # [E] f1: the window closes this much before the limit (raise and drag move the arrival)
planning_mass_t = 308.0           # [D] r5: tanker dry 209 t + main residue 99.2 t after the ascent (choice of the orbit)
planning_boil_off_t_per_day = 15.9  # [D] f1 probe 2026-10-21: the bare tanker with 99.2 t main, orbit average, 200 km
