# Refuelling r5: the HLS launches into the depot plane, docks, is filled and undocks; at the lunar mission's epoch the
# lunar landing continues from the HLS's real state and tank load (spec r5 "hls_refuel").
[mission]
# where the mission starts and with which vehicle (mission selection panel; checked against the start dispatch
# by test_mission_start_places)
start_place = "starbase_olp1"
start_vehicle = "starship_hls_launch"
name = "HLS: Betankung am Depot und Mondmission"
display_name = "Mondlander: Betankung am Depot und Mondmission" # shown in the webcast overlay (no trademarks)
kind = "hls_refuel"
ascent = "hls_ascent"

# The depot, placed in the lunar mission's parking plane (its RAAN from the Moon at arrival, run back by J2).
[depot]
vehicle = "starship_depot"
port = "transfer_dock"
height_km = 200.0
inclination_deg = 26.5            # must equal the lunar mission's [orbit] inclination
argument_of_latitude_deg = 0.0    # at earliest_utc
propellant_t = 1500.0             # [test] a filled depot after the campaign (r6 computes how many tankers)

[start]
mode = "pad"

[launch_window]
earliest_utc = "2026-10-20T00:00:00"   # 13 days before the lunar epoch (2026-11-02): the window closing the 48 h phasing
search_days = 12.0                # [E] (5 days found none: the depot phase, as for the tanker); the HLS waits until the lunar epoch
insertion_s = 415.7               # [D] ascent Task 5 (Task 2: 421.4, r5: 428.3): liftoff -> insertion of the flown HLS
                                  # ascent (the planned kick)
insertion_arc_deg = 11.78         # [D] ascent Task 5 (Task 2: 11.37, r5: 11.68): inertial in-plane arc pad -> insertion,
                                  # flown

[phasing]
mission_limit_h = 48.0            # [E] uncrewed
earliest_arrival_h = 0.0
periapsis_km = 170.0              # the reference phasing orbit (r5; --reference-phasing) after the raise at apoapsis
# [E] f1: the phasing orbits (periapsis, apoapsis km) the launch window chooses from (as the tanker's)
# f2 (user 2026-10-21): 180 x 190 km dropped - flown against the launched depot (199.6 x 211.7 km) all five windows
# that chose it failed: the phasing plan reads the osculating apsides (J2: +-10 km) and found the orbit crossing the
# depot's or the phase out of reach
candidates_km = [[150.0, 190.0], [160.0, 190.0], [170.0, 190.0],
                 [220.0, 240.0], [250.0, 270.0]]
window_margin_h = 4.0             # [E] f1: the window closes this much before the limit (raise and drag move the arrival)
planning_mass_t = 328.0           # [D] r5: HLS dry 120 t + main residue 208 t after the ascent (choice of the orbit)
planning_boil_off_t_per_day = 0.45  # [D] f1 probe 2026-10-21: the insulated HLS with 208 t main, orbit average, 200 km

[lunar]
mission = "hls_lunar_llo_depot"
