# Refuelling r5: the HLS's ascent from Starbase towards the phasing orbit below the 200 km depot, as the tanker's
# (tanker_ascent.toml): insertion at a 120 km perigee, raised to 170 km at the first apoapsis (hls_refuel [phasing]
# periapsis_km). The pitch program is starship_leo's; the booster is caught.
[mission]
name = "HLS in den Phasenorbit"
vehicle = "starship_hls_launch"
site = "starbase_olp1"
heading_deg = 90.0
payload_t = 0.0
fairing = false

[target]
periapsis_km = 120.0          # insertion; raised to 170 km at apoapsis
apoapsis_km = 190.0
inclination_deg = 26.5
northerly = true

[pitch_program]
kick_deg = 14.0
booster_throttle = [[60.0, 0.85], [64.0, 0.76], [76.0, 0.76], [82.0, 0.83], [112.0, 0.83], [126.0, 0.76]]
