# Refuelling r5: the depot's ascent from Starbase into the depot orbit (spec r5 "depot_launch"). The pitch program is
# planned at the start (sim::plan_launch); the booster is caught.
[mission]
# where the mission starts and with which vehicle (mission selection panel; checked against the start dispatch
# by test_mission_start_places)
start_place = "starbase_pad2"
start_vehicle = "starship_depot"
vehicle = "starship_depot"
site = "starbase_pad2"
heading_deg = 90.0
payload_t = 0.0
fairing = false

[target]
periapsis_km = 200.0          # the lunar missions' start orbit (spec r3)
apoapsis_km = 200.0
inclination_deg = 26.5
northerly = true
