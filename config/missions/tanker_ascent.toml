# Refuelling r5: a tanker's ascent from Starbase towards the phasing orbit below the 200 km depot (r3: 170 x 190 km).
# User 2026-10-20: it inserts at a 120 km perigee (+9.7 t residue against 170 km) and raises it to 170 km at the first
# apoapsis (tanker_flight [phasing] periapsis_km); at 80 km the coast's drag (~60 m/s) brought it back down. The pitch
# program is planned at the start (sim::plan_launch); the booster is caught.
[mission]
# where the mission starts and with which vehicle (mission selection panel; checked against the start dispatch
# by test_mission_start_places)
start_place = "starbase_olp1"
start_vehicle = "starship_tanker"
name = "Tanker in den Phasenorbit"
display_name = "Tanker in den Phasenorbit" # shown in the webcast overlay (no trademarks)
vehicle = "starship_tanker"
site = "starbase_olp1"
heading_deg = 90.0
payload_t = 0.0
fairing = false

[target]
periapsis_km = 120.0          # insertion; raised to 170 km at apoapsis (user 2026-10-20)
apoapsis_km = 190.0
inclination_deg = 26.5
northerly = true
