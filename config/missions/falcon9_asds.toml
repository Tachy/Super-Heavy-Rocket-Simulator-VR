# Falcon 9 launch from SLC-40 with a Starlink-class payload and the first stage landing on a drone ship (ASDS, milestone
# c4; the onboard computer chooses the drone ship - the RTLS return leaves the upper stage short of this orbit - and
# puts it at the stage's predicted impact, sim::plan_launch): the ascent autopilot plans MECO for the drone-ship return
# (run-down, entry burn, landing propellant); the first stage coasts without a boostback, turns engines first on its RCS,
# flies its three-engine entry burn (steering onto the deck) and lands on one engine; the second stage flies on to
# orbit. Modelled on Starlink 15-25 (2026-10-12; that flight launched from Vandenberg - this mission flies the Florida
# 53 deg shell).

[mission]
# where the mission starts and with which vehicle (mission selection panel; checked against the start dispatch
# by test_mission_start_places)
start_place = "ccsfs_slc40"
start_vehicle = "falcon9_block5"
name = "Falcon 9 mit Landung auf dem Drohnenschiff"
display_name = "Medium Launcher: Landung auf dem Drohnenschiff" # shown in the webcast overlay (no trademarks)
vehicle = "falcon9_block5"
site = "ccsfs_slc40"
heading_deg = 45.0              # body +y on the pad (launch azimuth ~43 deg for 53 deg)
payload_t = 16.5                # [E] Starlink class: our vehicle model carries ~17 t to this orbit (17 t arrives
                                # with 0.3 t left in stage 2, 18 t does not); 16.5 t keeps a margin
fairing = true

[target]
periapsis_km = 200.0            # [E] Starlink insertion (the satellites raise their own orbit)
apoapsis_km = 280.0
inclination_deg = 53.0          # Starlink shell (Florida launches north-east)
northerly = true
