# Refuelling r5: tanker_flight from the phasing orbit (fast tests): the tanker 8 deg behind the depot in the ascent's
# 170 x 190 km orbit, then the same chain as tanker_flight (phasing -> ... -> catch).
[mission]
# where the mission starts and with which vehicle (mission selection panel; checked against the start dispatch
# by test_mission_start_places)
start_place = "earth_orbit"
start_vehicle = "starship_tanker"
name = "Tankerflug ab Phasenorbit"
display_name = "Tankerflug ab Phasenorbit" # shown in the webcast overlay (no trademarks)
kind = "tanker_flight"
ascent = "tanker_ascent"          # vehicle, site and phasing orbit
return = "ship_return_starbase"

[depot]
vehicle = "starship_depot"
port = "transfer_dock"
height_km = 200.0
inclination_deg = 26.5
raan_deg = 0.0
argument_of_latitude_deg = 0.0
propellant_t = 600.0              # [test]

[start]
mode = "phasing_orbit"
behind_deg = 8.0
propellant_t = 99.2               # [D] r5: main tanks after the flown tanker ascent and the perigee raise (170 x 190 km)

[launch_window]
earliest_utc = "2026-10-20T00:00:00"   # the start epoch of the phasing-orbit start
search_days = 12.0
insertion_s = 436.1               # [D] ascent Task 2 (r5: 445.5): the flown tanker ascent
insertion_arc_deg = 11.93         # [D] ascent Task 2 (r5: 12.20)

[phasing]
mission_limit_h = 48.0            # [E] uncrewed
earliest_arrival_h = 0.0
periapsis_km = 170.0              # the phasing orbit after the raise at apoapsis (the ascent inserts at 120 km)
