# Lunar return with aerocapture ("Aircatch", user 2026-10-14; spec l5): as ship_lunar_return_llo up to the braking
# burn, then one atmospheric pass into a 400 km apoapsis Earth orbit, the perigee raise at the apoapsis, and the
# ship return from orbit to Starbase (b4: deorbit, entry, flip and catch). Aerocapture has never been flown.

[mission]
name = "Rückkehr vom Mond (LLO, Aircatch)"
kind = "lunar_return"            # FlightSim.start_mission dispatches on it
vehicle = "starship_block3"
stage = "ship"
site = "starbase_olp1"

[orbit]
epoch_utc = "2026-11-12T00:00:00"   # [E] as ship_lunar_return_llo
kind = "llo"
altitude_km = 100.0                 # [S] spec
inclination_deg = 90.0              # [E] any inclination >= the return asymptote's declination (Moon equator) works:
                                    # the node is placed so the plane contains it; polar as the south-pole landing

[return]
variant = "aerocapture"
flight_time_days = 3.5              # [E] spec ~3-4 days (first guess)
search_days = 1.0                   # [E] departure revolutions scanned
mcc_after_tei_days = [1.0, 2.5]     # [E] spec: two corrections
entry_interface_km = 120.0          # b2
braking_height_km = 2000.0          # [E] user 2026-10-16
min_corridor_width_deg = 0.5        # [E] one pass to an apoapsis: the narrower corridor (l5 Task 5: 0.5 deg at 10.1 km/s)
nominal_bank_deg = 110.0            # [E] unused for the pass (the guidance flies the apoapsis); kept for the file shape
aerocapture_apoapsis_km = 400.0     # [E] spec
perigee_raise_km = 200.0            # spec

[deorbit]                           # b4 after the capture (as ship_return_starbase)
entry_interface_km = 120.0
entry_flight_path_deg = -1.0        # [E] b2's nominal entry
nominal_bank_deg = 50.0             # [E] the plan flies this bank: range to spare both ways
max_crossrange_km = 60.0            # [E] reach of the entry guidance's reversals (b2 campaign)
search_window_h = 48.0

[budget]
mcc_allowance_mps = 30.0            # [E]
coast_attitude_kg_per_day = 1000.0  # [D] l3: Sun hold ~0.9 t/day of cold gas
reserve_kg = 10000.0                # [E] as the lunar landing
