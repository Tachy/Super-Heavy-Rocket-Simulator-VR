# Pad B (Starbase OLP-2) tower and chopstick detail file - DRAFT from first measurements (prototype plan task 1).
# Site-independent: placement and the physics numbers (arm length, tower height, hinge) stay in launch_sites.toml.
# Every value carries [E] (own estimate, method named) or [S] (published, URL). Reference images: git-ignored
# screenshots/mechazilla/pad-b/ (INDEX.md); scale = booster diameter 9 m [S] (spacex.com/vehicles/starship)
# the images (points files), script tools/structures/measure/ratio.py. Single-view ratios only: no camera solve yet (full build).

[tower]
height_m = 144.5          # [E] count of sections x section height; matches 144.5 m of the spec (NAIP shadow + imagery)

[[tower.sections]]
height_m = 12.04          # [E] 144.5 m / 12 sections (rows in padb_tower_full_with_chopsticks_2025-08)
face_width_m = 12.0       # [E] ratio to 9 m booster, image padb_full_stack_on_mount_2026-05: 11.5 m, oblique -> 12
pitch_m = 8.0             # [E] estimate: gusset row spacing ~0.7 x face width, nsf_padb_chopsticks_2025-02
pattern = "x_brace"            # [E] layout read from nsf_padb_chopsticks_2025-02 / padb_tower_top_cabin_2026-04
leg_profile = "leg"       # [E] see profiles.leg
brace_profile = "brace"   # [E] see profiles.brace

