# Pad B (Starbase OLP-2) tower and chopstick detail file - DRAFT from first measurements (prototype plan tasks 1 and 4).
# Site-independent: placement and the physics numbers (arm length, tower height, hinge) stay in launch_sites.toml.
# Every value carries [E] (own estimate, method named) or [S] (published, URL). Reference images: git-ignored
# screenshots/mechazilla/pad-b/ (INDEX.md); scale = booster diameter 9 m [S] (spacex.com/vehicles/starship).
# Measured on the images by points files and tools/structures/measure/ratio.py. Single-view ratios only: no camera
# solve yet (full build).
# Task 4 look correction: scale of padb_tower_full_with_chopsticks_2025-08 = 1530 px lattice height / 144.5 m = 10.6 px/m.

[tower]
height_m = 144.5          # [E] count of sections x section height; matches 144.5 m of the spec (NAIP shadow + imagery)

[tower.deck]              # floor / platform at every brace row: dark slabs seen through the lattice
thickness_m = 0.5         # [E] dark bands ~5 px thick on padb_tower_full_with_chopsticks_2025-08 / 10.6 px/m, oblique view
inset_m = 1.0             # [E] slab edge to the leg centre line: the decks reach the corner columns, ~1 m of leg width each

[tower.core]              # dark column bundle (pipes, stairs) in the middle of the lattice
size_m = 3.6              # [E] ~35 px of the 120 px wide face on padb_tower_full_with_chopsticks_2025-08 = 0.3 x 12 m

[tower.roof]              # flat roof cap with a shallow pyramid frame on top
plate_thickness_m = 0.6   # [E] padb_tower_full_with_chopsticks_2025-08, top 60 px: cap ~6 px thick
overhang_m = 0.6          # [E] cap edge beyond the face, same image
pyramid_height_m = 5.0    # [E] pyramid frame ~55 px high on padb_tower_full_with_chopsticks_2025-08
pyramid_top_fraction = 0.3  # [E] flat top width / face width, same image

[tower.foot]              # wider platform ring at the tower foot
ring_width_m = 3.0        # [E] ring protrudes ~30 px beyond the face on padb_tower_full_with_chopsticks_2025-08
ring_thickness_m = 1.2    # [E] same image, ~13 px thick

[[tower.sections]]
height_m = 12.04          # [E] 144.5 m / 12 sections (rows in padb_tower_full_with_chopsticks_2025-08)
face_width_m = 12.0       # [E] ratio to 9 m booster, image padb_full_stack_on_mount_2026-05: 11.5 m, oblique -> 12
pitch_m = 4.0             # [E] ratio method: ~36 floor rows over 1530 px lattice height on padb_tower_full_with_chopsticks_2025-08 = 4.0 m
pattern = "x_brace"            # [E] nested chevron per row (Lambda between the corner columns), X at the foot: same image
leg_profile = "leg"       # [E] see profiles.leg
brace_profile = "brace"   # [E] see profiles.brace

