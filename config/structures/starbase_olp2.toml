leg_profile = "leg"       # [E] see profiles.leg
brace_profile = "brace"   # [E] see profiles.brace

[profiles.leg]            # white main chord: square box column
kind = "box"              # [E] reads as a hollow box column in nsf_padb_chopsticks_2025-02
size_m = 1.6              # [E] estimate: ~1/7.5 of the 12 m face, image nsf_padb_chopsticks_2025-02 (oblique)
wall_m = 0.04             # [E] estimate: plate column, no way to measure a wall from photos

[profiles.brace]          # dark K/X brace between gusset plates
kind = "h_beam"           # [E] reads as an I/H section with gusset plates in nsf_padb_chopsticks_2025-02
size_m = 0.7              # [E] ratio to the 12 m face, image nsf_padb_chopsticks_2025-02, ~0.6-0.8 m
wall_m = 0.03             # [E] estimate: flange thickness, not measurable

[profiles.chopstick_rail]
kind = "tube"             # [E] catch rail on the arm top is a round tube in padb_chopsticks_around_booster_top_2026-03
size_m = 0.65             # [E] ratio to 9 m booster, image padb_chopsticks_around_booster_top_2026-03 (0.63 m)
wall_m = 0.025            # [E] estimate: tube wall, not measurable

[profiles.chopstick_chord]
kind = "tube"             # [E] truss chords are round tubes (same image)
size_m = 0.65             # [E] ratio to 9 m booster, image padb_chopsticks_around_booster_top_2026-03 (0.63 m)
wall_m = 0.025            # [E] estimate: tube wall, not measurable

[profiles.chopstick_brace]
kind = "tube"             # [E] diagonals are round tubes (same image)
size_m = 0.5              # [E] ratio to 9 m booster, image padb_chopsticks_around_booster_top_2026-03 (0.51 m)
wall_m = 0.02             # [E] estimate: tube wall, not measurable

[chopstick]
length_m = 26.0           # [E] spec A: ~26 m hinge-to-tip from image ratios; physics arm stays 36 m (prototype)
width_m = 3.0             # [E] estimate: ~1/3 of the truss depth, padb_chopstick_arm_backlit_2026-04
depth_m = 8.75            # [E] ratio to 9 m booster, image padb_chopsticks_around_booster_top_2026-03
truss_pitch_m = 4.5       # [E] estimate: diagonal spacing ~ half the truss depth, same image
rail_profile = "chopstick_rail"     # [E] see profiles
chord_profile = "chopstick_chord"   # [E] see profiles
brace_profile = "chopstick_brace"   # [E] see profiles
