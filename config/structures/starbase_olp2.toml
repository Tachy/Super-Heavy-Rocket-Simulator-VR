[[tower.sections]]        # ... and a denser top section of two floors under the roof
height_m = 10.7           # [E] 2 floors x 5.35 m
face_width_m = 12.0       # [E] see above
pitch_m = 5.35            # [E] one chevron per floor under the roof deck (Ship 42 top: denser members)
pattern = "chevron"       # [E] Lambda per floor, Ship 42 top
leg_profile = "leg"       # [E] see profiles.leg
brace_profile = "brace"   # [E] see profiles.brace

[profiles.leg]            # closed bright main corner column: square box
kind = "box"              # [E] closed box column, galvanised: padb_tower_full_with_chopsticks_2025-08
size_m = 2.2              # [E] 2.2 +-0.4 m: QD arm photo, Ship 42 (measurements)
wall_m = 0.05             # [E] estimate: plate column, no way to measure a wall from photos

[profiles.brace]          # bracing between the columns, clearly thinner than the legs
kind = "h_beam"           # [E] reads as an I/H section with gusset plates in nsf_padb_chopsticks_2025-02
size_m = 0.5              # [E] 0.5 +-0.15 m: QD arm photo, diagonals 28 px (measurements)
wall_m = 0.04             # [E] estimate: flange thickness, not measurable

[profiles.chopstick_rail]
kind = "tube"             # [E] catch rail on the arm top is a round tube in padb_chopsticks_around_booster_top_2026-03
size_m = 0.9              # [E] heavier than Task 2: rails ~1/10 of the 9 m booster in padb_chopsticks_around_booster_top_2026-03
wall_m = 0.04             # [E] estimate: tube wall, not measurable

[profiles.chopstick_chord]
kind = "tube"             # [E] truss chords are round tubes (same image)
size_m = 1.1              # [E] chord tubes ~0.85-1.1 m (35-45 px at 41 px/m) in padb_chopsticks_around_booster_top_2026-03
wall_m = 0.04             # [E] estimate: tube wall, not measurable

[profiles.chopstick_brace]
kind = "tube"             # [E] diagonals are round tubes (same image)
size_m = 0.8              # [E] diagonals 28-33 px at 41 px/m = 0.7-0.8 m, same image
wall_m = 0.03             # [E] estimate: tube wall, not measurable

[profiles.chopstick_thin]
kind = "tube"             # [E] ties and thin braces, NSF 2026-03
size_m = 0.35             # [E] ~14 px at 40.6 px/m
wall_m = 0.02             # [E] estimate: tube wall, not measurable

[chopstick]               # Pad 2 arm, not the Pad 1 / V2 arm; chords, bends, evidence: launch-structures-measurements.md "Arm research"
length_m = 25.9           # [E] 26 +-2 m hinge to tip (NSF 2026-03 ratio, 27 before): tip 2 m past the catch axis, the most the bent tip clears the hull with; [S] ~10 m shorter than Pad 1; physics arm 36 m
width_m = 4.0             # [E] 4 +-1 m, images.jpeg deck strip against the tower face (no true top view)
depth_m = 8.6             # [E] 8.6 +-0.8 m deck to the lower chord where its rise ends (NSF 2026-03; side view 2025-08 8.4 m)
end_depth_m = 7.0         # [E] 6.9 +-0.7 m at the lower node near the tip: user view of the held V3 booster (45.6 px/m)
knee_depth_m = 11.0       # [E] +-1.5 m lower chord's knee, side view padb_mount_and_chopsticks_side_2025-08 (14.3 px/m)
foot_depth_m = 17.0       # [E] +-2 m root columns' foot below the deck, same view
knee_frac = 0.21          # [E] +-0.03 station of the knee, same view
kink_frac = 0.35          # [E] +-0.05 the lower chord stops rising here, same view
lower_end_frac = 0.87     # [E] +-0.04 lower chord's end, same view
root_kink_x_m = 5.2       # [E] 0.19 +-0.03 L: top chord breaks in NSF 2026-03 and 2026-05; flat in the side view, so the break is in plan
root_kink_deg = 5.0       # [E] +-5 deg, not measured: hinge at the tower corner (6.75 m) to the main beam (6.3 m) over the root
tip_kink_x_m = 24.8       # [E] 24.8 +-0.8 m station of the second top chord break (0.92 +-0.03 of the 27 m first read), NSF 2026-03 and 2026-05
tip_kink_deg = 28.0       # [E] +-15 deg: image slopes 5.6 / 32 deg at ~11 deg view from below; inward (recedes from a camera outside the arm)
inner_face_y_m = 1.0      # [E] main beam's inner face from the hinge line: lateral 4.8 m = arm_closed_gap_m / 2 (physics)
cap_scale = 1.04          # [E] round end caps a little proud of the tube (user view)
column_x_m = 0.8          # [E] hinge column at the root, side view 2025-08
column_size_m = 1.4       # [E] heavier than the chords, same view
deck_thickness_m = 0.15   # [E] not measurable
strip_width_m = 0.8       # [E] tan strip on the deck, images.jpeg
railing_height_m = 1.1    # [E] standard guard rail
railing_post_pitch_m = 6.0  # [E] not measurable; fewer posts, the real railing is sparse
pad_x_m = 24.85   # [E] pad ends at the arm tip and spans the catch axis station 24 m: under the fin at the closed pose
pad_length_m = 2.1        # [E] +-0.3 m user view, 98 px at 45.6 px/m
pad_width_m = 0.6         # [E] not measurable (edge-on)
pad_height_m = 1.2        # [E] +-0.2 m user view, 55 px
pad_top_depth_m = 0.6     # [E] +-0.2 m pad top below the deck top, user view
pad_proud_m = 0.2         # [E] proud of the inner face: 0.1 m from the 4.5 m hull, not measurable
pusher_start_x_m = 20.0    # [E] on top at the tip, NSF 2026-03 / 2026-05
pusher_end_x_m = 26.2      # [E] passes the tip a little, night view 2025-09 and side view 2025-08
pusher_size_m = 0.5       # [E] ~20 px at 40.6 px/m
pusher_spacing_m = 0.9    # [E] two cylinders, same views
probe_length_m = 5.0      # [E] +-1 m hanging stabilizer arm below the lower chord, NSF 2026-03 (200 px at 40.6 px/m)
probe_size_m = 0.4        # [E] same view
probe_brace_frac = 0.61   # [E] the long thin brace starts here, same view
ladder_a_frac = 0.60      # [E] ladder positions, NSF 2026-03
ladder_b_frac = 0.78      # [E] same view
platform_frac = 0.70      # [E] small platform with railing, NSF 2026-05
mast_x_m = 13.5           # [E] thin mast on the deck, NSF 2026-03
mast_height_m = 3.0       # [E] same view
rail_profile = "chopstick_rail"     # [E] see profiles
chord_profile = "chopstick_chord"   # [E] see profiles
brace_profile = "chopstick_brace"   # [E] see profiles
thin_profile = "chopstick_thin"     # [E] see profiles

[carriage]                # frame across the tower at the arm roots
