[[tower.sections]]        # ... and a denser top section of two floors under the roof
height_m = 10.7           # [E] 2 floors x 5.35 m
face_width_m = 12.0       # [E] see above
pitch_m = 5.35            # [E] one chevron per floor under the roof deck (Ship 42 top: denser members)
pattern = "chevron"       # [E] Lambda per floor, Ship 42 top
leg_profile = "leg"       # [E] see profiles.leg
brace_profile = "brace"   # [E] see profiles.brace

[profiles.leg]            # closed bright main corner column: square box
kind = "box"              # [E] closed box column, galvanised: padb_tower_full_with_chopsticks_2025-08
size_m = 2.2              # [E] 2.2 +-0.4 m: QD arm photo, Ship 42 (measurements)
wall_m = 0.05             # [E] estimate: plate column, no way to measure a wall from photos

[profiles.brace]          # bracing between the columns, clearly thinner than the legs
kind = "h_beam"           # [E] reads as an I/H section with gusset plates in nsf_padb_chopsticks_2025-02
size_m = 0.5              # [E] 0.5 +-0.15 m: QD arm photo, diagonals 28 px (measurements)
wall_m = 0.04             # [E] estimate: flange thickness, not measurable

[profiles.chopstick_rail]
kind = "tube"             # [E] catch rail on the arm top is a round tube in padb_chopsticks_around_booster_top_2026-03
size_m = 0.9              # [E] heavier than Task 2: rails ~1/10 of the 9 m booster in padb_chopsticks_around_booster_top_2026-03
wall_m = 0.04             # [E] estimate: tube wall, not measurable

[profiles.chopstick_chord]
kind = "tube"             # [E] truss chords are round tubes (same image)
size_m = 1.0              # [E] chord tubes ~1/9 of the 9 m booster in padb_chopsticks_around_booster_top_2026-03
wall_m = 0.04             # [E] estimate: tube wall, not measurable

[profiles.chopstick_brace]
kind = "tube"             # [E] diagonals are round tubes (same image)
size_m = 0.7              # [E] diagonals ~0.7 of the chord, same image
wall_m = 0.03             # [E] estimate: tube wall, not measurable

[chopstick]
length_m = 26.0           # [E] spec A: ~26 m hinge-to-tip from image ratios; physics arm stays 36 m (prototype)
width_m = 3.0             # [E] estimate: ~1/3 of the truss depth, padb_chopstick_arm_backlit_2026-04
depth_m = 8.75            # [E] ratio to 9 m booster, image padb_chopsticks_around_booster_top_2026-03
truss_pitch_m = 6.5       # [E] fewer panels: ~4 W-panels over the arm in padb_chopsticks_around_booster_top_2026-03 (Task 2: 4.5)
rail_profile = "chopstick_rail"     # [E] see profiles
chord_profile = "chopstick_chord"   # [E] see profiles
brace_profile = "chopstick_brace"   # [E] see profiles
