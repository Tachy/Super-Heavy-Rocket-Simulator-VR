# HOTAS mapping. Devices are found by a substring of their name (indices change when re-plugging).
# Raw axes need config/sdl_gamecontrollerdb.txt, loaded at engine start by Start-Desktop.cmd.
# Find axes with: godot --path game --script res://tests/joy_probe.gd -- --seconds=30
# Measured 2026-10-12 on Thrustmaster T.16000M FCS + TWCS throttle.

[stick]
device_name = "T16000M"
deadzone = 0.04
pitch_axis = 1          # stick forward = -1 -> inverted: forward tips the nose towards the heading
pitch_invert = true
yaw_axis = 0            # stick left/right
yaw_invert = false
roll_axis = 2           # twist
roll_invert = false
# axis 3 = slider (unused)

[throttle]
device_name = "TWCS"
throttle_axis = 2       # main lever, forward = -1
throttle_invert = true
# axes 0/1 = mini-stick, axis 5 = rocker (unused)

# Keyboard (always active): W/S pitch, A/D yaw, Q/E roll, Shift/Ctrl throttle up/down,
# I ignition, L release clamps (liftoff), K engine cutoff, G stage separation, M control mode.

# Free camera (view "Freie Kamera" in the time panel): 6 DOF, rotation on the stick, translation on the throttle.
# [E] Axis indices follow the measured table above (stick 0/1/2, throttle mini-stick 0/1, rocker 5); the signs of the
# throttle axes are not measured - flip *_invert when a direction is wrong (the free camera shows a live axis readout).
# Speed per axis: 0 inside the dead zone, else v_min * (v_max / v_min)^((|d| - dz) / (1 - dz)) (logarithmic).
[free_camera]
rotation_max_deg_s = 90.0   # full deflection
rotation_expo = 0.3         # 0 = linear, 1 = cubic
rotation_deadzone = 0.05
# Translation (all three axes, user 2026-10-29): full deflection = distance to the nearest surface (Earth ellipsoid,
# Moon, Sun) x speed_per_distance_hz (at least speed_floor_mps); logarithmic over speed_decades below full deflection.
# 1 Hz: at 9 km altitude 9 km/s; flying at a surface slows down exponentially.
speed_per_distance_hz = 1.0
speed_floor_mps = 0.5
speed_decades = 3.0
speed_deadzone = 0.05
roll_axis = 0               # stick left/right
roll_invert = false
pitch_axis = 1              # stick forward = nose down
pitch_invert = false
yaw_axis = 2                # stick twist
yaw_invert = false
forward_axis = 5            # throttle rocker: right = forward
forward_invert = false
strafe_axis = 0             # throttle mini-stick left/right
strafe_invert = false
vertical_axis = 1           # throttle mini-stick up/down (up = -1)
vertical_invert = true
